# Breakdown for epic-tale-studio-2, vertical slices in build order.
# Each entry is a flow a person reviews in Tale Studio (dashboard) or on the sample host page that loads the Web SDK.
# Table order is build order; id is permanent.
#
# One studio lane (tale-studio.ts/html/css and the panels split out of it):
#   1 (tracer shell) -> 2 (owner layout review, hitl) -> 3 -> 4 -> 5 -> 6 -> 7 -> 8 -> 9 -> 10 -> 11 -> 14 -> 15 -> 16
# Contract and SDK lane, beside the studio lane once 5 is in (each adds its own inspector controls):
#   12 (shapes), 13 (entrance animation, waits on an architect answer)
# Then 17 (accessibility review, hitl) and 18 (sweep).
#
# Interactive components (epic 4): the epic starts after 4.3 (quiz), which is being merged now.
# Stories 4.4 to 4.7 add descriptors and inspector fields in tale-element-types.ts and tale-fields-inspector.ts,
# the files that stories 3 and 6 reshape. Each of those stories says so; whichever merges second carries the other's
# change. A descriptor in today's shape keeps working (it shows under More with its fields in Content).

[[entry]]
id = 1
type = "story"
title = "Tracer: the studio in five regions"
description = "Rebuilds the studio page per epic R1 with today's controls: a full-height shell with the top bar (back, tale name, undo and redo, Preview, save state, status line, Update tale, and a tale menu holding Discard changes, Duplicate and Keyboard shortcuts), a left panel with an Elements tab (today's Add entries as tiles, grouped by their current row) and a Layers tab (today's layers list, keyboard model unchanged), the canvas centred on a workspace at a fit size, the inspector on the right (today's Selected and Canvas fieldsets), and the Preview pane opening in the inspector's place. The page no longer scrolls; each panel scrolls on its own; F6 and Shift+F6 cycle the regions. Click to add as today. Templates and Media tabs exist as placeholders that say what is coming. Studio e2e and a11y specs (studio-keyboard, studio-a11y) are updated to the new structure."
verify = "At 1440x900 the canvas, the palette and the inspector of a selected element are all visible without scrolling the page; a tale composed in the new shell (text, image, shape, poll) updates and shows on the sample page as before; F6 reaches each region in order; the existing studio e2e and WCAG 2.2 AA scan pass."
covers = ["R1", "R16", "R17"]
after = ["4.3", "7.15", "7.16"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/ux-tale-studio-2/EXPERIENCE.md#information-architecture", "_bmad-output/initiative-taleart/ux-tale-studio-2/mockups/tale-studio-2.html"]
notes = ["Restructures tale-studio.html: a story of 4.4 to 4.7 in flight at the same time rebases onto it (its changes are in descriptors and fields, not the page layout)."]

[[entry]]
id = 2
type = "story"
title = "Owner reviews the new layout and settles the design decisions"
description = "The owner walks the five-region studio from story 1 on a test build (screenshots at 1440, 1024 and 390 wide beside the mock in ux-tale-studio-2/mockups), and confirms or changes each item under 'Owner decisions to confirm' in EXPERIENCE.md (layers placement, animation in scope, canvas drawn by the SDK renderer, new shapes, built-in templates only, RTL mirror, phone edit-lite, Discard and Duplicate in the tale menu, strip reorder changing group order). Each answer becomes a dated Decision line in the epic's Notes and, where it changes the design, an update to EXPERIENCE.md and to the affected entries below."
verify = "Every owner decision in EXPERIENCE.md has a dated Decision line in the epic's Notes, and every entry it changes has been revised or dropped."
covers = ["R1"]
after = [1]
hitl = true # the owner reviews the layout and answers the decisions
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Find any element in a grouped, searchable palette"
description = "Adds a `palette` entry to the studio descriptor (category, order, keywords, presets with props and box) and builds the Elements tab from it per epic R2: categories Text, Media, Shapes, Stickers & emoji, Buttons & links, Interactive, More; text presets (Heading, Subheading, Body, Caption, Label) drawn in their style; one tile per shape kind; search over labels and keywords with a live count; limits and the project-media rule as focusable disabled tiles with their reason; a registered type without a palette entry under More; test-only types never shown. Migrates every existing descriptor to the new entry."
verify = "Typing 'vote' finds Poll and the count is announced; with a poll in the tale the Poll tile is disabled and says why; the test badge type registered without a palette entry shows under More in a test build and nowhere in production; a unit test checks every registry key has a tile."
covers = ["R2", "R17"]
after = [2]
hitl = false
risk = "medium"
notes = ["Conflicts with 4.4 to 4.7, which add descriptors to tale-element-types.ts in today's shape: whichever merges second migrates the other's descriptors (an unmigrated one still shows under More)."]

[[entry]]
id = 4
type = "story"
title = "Drag an element onto the canvas, or add it with a click or a key"
description = "Pointer drag from a palette tile onto the canvas per epic R3: a ghost at the element's real size, snapping and safe-area overlay while dragging, drop at the pointer clamped inside the stage, cancel by dropping outside or pressing Escape ('Not added'). Click, Enter or Space adds at the next free spot in the safe area. Both select the new element, focus it on the canvas and announce it in the studio's polite live region. Dragging is never the only way (WCAG 2.5.7)."
verify = "Drag a Poll to the lower third: it lands under the pointer, snapped to the centre guide, selected and announced; drop a tile on the workspace outside the stage: nothing is added; with the keyboard only, Tab to Rating, press Enter: it is added, selected and focused on the canvas; one undo removes each add."
covers = ["R3", "R16", "R17"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Edit an element in sections with swatches, sliders and a font picker"
description = "Rebuilds the inspector of the built-in types (text, media, shape, emoji, link) per epic R4 and R5: the contextual header (type, layer name, lock, hide), disclosure sections in order (Content, Style, Position & size, Action, Accessibility; Animation comes with story 13), remembered open state, a section with a problem opening itself, and the low-code controls: colour swatches (theme, this tale, recent, custom with hex, contrast badge on text colour), slider with number field, segmented control, toggle, and the font picker that shows each font in its face with an inline project-font upload. Nothing selected shows the Tale settings. One drag of a slider is one undo step."
verify = "Select a heading: change its font to a project font from the picker (each option drawn in its face), drag the size slider (one undo step reverts it), pick a theme swatch and see the contrast badge; select an image without alt text: Accessibility is open with the warning; keyboard only: arrows move through swatches and segmented options."
covers = ["R4", "R5", "R16", "R17"]
after = [4]
hitl = false
risk = "high"
notes = ["Touches tale-text-style.ts, tale-shapes.ts, tale-media.ts and tale-links.ts; does not touch the configured inspector, so it does not conflict with 4.4 to 4.7."]

[[entry]]
id = 6
type = "story"
title = "New component types get sections and low-code controls from their descriptor"
description = "Extends the descriptor's inspector fields per epic R5: each field names its `section` (content by default, style, action, accessibility) and may use the controls `slider`, `segmented`, `swatch`, `toggle` and `font`, with ranges and options taken from the type's props schema; the configured inspector renders them in the right sections, with Responses last for interactive types. Moves poll, rating and quiz (and any of 4.4 to 4.7 already merged) to sections, e.g. theme as a segmented Light/Dark in Style."
verify = "The poll's theme is a segmented control in Style and its question and options are in Content; a test type whose descriptor declares a slider field shows a slider with the schema's min and max, and a value out of range is refused with the schema's reason; responses still show for poll, rating and quiz."
covers = ["R4", "R5", "R2"]
after = [5]
hitl = false
risk = "medium"
notes = ["Conflicts with 4.4 to 4.7, which add fields to tale-fields-inspector.ts (4.5 adds a date-time field): whichever merges second carries the other's change. A field without a section keeps working in Content."]

[[entry]]
id = 7
type = "story"
title = "Zoom, pan and show the safe area on the canvas"
description = "Adds the zoom control per epic R6 (Fit by default, 25 to 400%, menu, Ctrl or Cmd plus, minus, 0 and 1, Ctrl or Cmd with the wheel, pinch), panning (Space+drag, middle drag, scrollbars, keys), and the safe-area toggle remembered per user, always shown while dragging. Moving, resizing, dropping and snapping map pointer positions through the zoom; an undo or a layers pick scrolls the selection into view."
verify = "At 200% drag a text to the safe-area edge: it snaps to the same place as at Fit; Ctrl+0 returns to Fit and it keeps fitting on window resize; with the overlay off, dragging still shows it; keyboard only: zoom in and out from the zoom menu."
covers = ["R6", "R17"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
