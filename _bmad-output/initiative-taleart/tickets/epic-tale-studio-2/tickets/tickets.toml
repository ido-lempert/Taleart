description = "Adds an optional entrance per element (none, fade, slide up, slide from start, pop, drift; delay and duration in ranges) as an additive field in libs/contract per epic R13, after the architect settles where it lives (epic Notes). The Web SDK plays it once when a tale opens and skips it under prefers-reduced-motion; the inspector gains the Animation section with a Play button that plays it on the canvas (also respecting reduced motion). Measures the SDK size and first-frame time."
