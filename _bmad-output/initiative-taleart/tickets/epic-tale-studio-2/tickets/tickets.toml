type = "story"
title = "Select several elements, align and distribute them"
description = "Multi-select per epic R7 by Shift or Cmd-click, marquee on empty canvas, select all and Shift selection in the layers list; the inspector's multi-selection context with Align (left, centre, right, top, middle, bottom), Distribute (with three or more) and the bounds; align a single element to the canvas or the safe area; equal-spacing smart guides with distance labels; keyboard shortcuts; each action one named undo step announced in the live region."
verify = "Marquee three elements and press Align centre: their centres line up, one undo restores them and 'Undid Align centre' is announced; distribute three texts vertically: equal gaps; drag a fourth between two others: an equal-spacing guide and its distance show; keyboard only: select three from the layers list and align them with the shortcut."
covers = ["R7", "R16", "R17"]
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Move between a group's tales in the tale strip"
description = "Adds the tale strip per epic R8: the group's tales as 9:16 thumbnails of their drafts, the current one marked (aria-current), Hidden and changes-not-updated marks, open another tale after autosave flushes (a failed flush stops the switch), '+' for a blank tale, from a template (once story 10 is in, until then blank and from media) or from media, and a menu with Duplicate, Move earlier, Move later, Hide or Show, Delete; drag to reorder with Alt+arrows as the alternative. Reorder uses the group's tale order, so the site follows."
verify = "In a group of three tales, move tale 3 to first with Alt+Left: the strip, the group drawer and the sample page show the new order; edit tale 1 and switch to tale 2: the edit is saved and tale 1 shows the changed mark until updated; hide a tale from the strip: it shows the Hidden mark and leaves the sample page."
covers = ["R8", "R16", "R17"]
after = [8, "8.11"]
hitl = false
risk = "medium"

