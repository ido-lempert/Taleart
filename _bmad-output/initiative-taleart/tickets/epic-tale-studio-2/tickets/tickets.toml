type = "story"
title = "Start a tale from a template or drop in a styled preset"
description = "Adds starter tales and element presets as registry data in libs/contract per epic R10 (Announcement, Product drop, Ask a question, Countdown to launch, Quiz time, Blank; heading styles, button styles, a poll with a heading), each valid against the document schema in a unit test; the Templates tab shows them as thumbnails drawn by the SDK renderer; applying to an empty tale fills it, to a non-empty one asks Replace elements or Add as new tale; replace is one undo step. A template that names a type the build does not have (e.g. countdown before 4.5) is hidden. The strip's '+' gains From template."
