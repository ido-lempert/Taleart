# The initiative's agreed epics, in build order. Table order is build order; id is permanent.

[[epic]]
id = 1
slug = "epic-platform-foundation"
title = "Platform foundation"
description = "Data model, API and project tag run in CI and deploy, with a dashboard shell, ready for the other epics."
covers = ["R3", "R8", "R10"]
after = [{ epic = 3, needs = "web-zones story 3.1, whose Delivery API zone query story 15 changes to read placements (story 15 only)" }]

[[epic]]
id = 2
slug = "epic-storyly-importer"
title = "Storyly importer"
description = "A Storyly account's groups, stories and zones import through the live API with a per-entity count report; later entries add components and user lists (Storyly audiences)."
covers = ["R1", "R2"]
after = [{ epic = 1, needs = "only the foundation stories each story lists in its own after (no gate on the whole epic)" }, { epic = 3, needs = "status and schedule fields on tales and tale groups (story 11 only)" }, { epic = 4, needs = "interactive components (story 13 only)" }, { epic = 5, needs = "user lists (story 12 only)" }, { epic = 8, needs = "the On/Off status model and tale defaults (8.1) for story 11 only" }]

[[epic]]
id = 3
slug = "epic-web-zones"
title = "Web zones"
description = "A visitor on a Web page sees a zone's bar or banner with its published tales, respecting schedules."
covers = ["R6", "R9", "R11"]
after = [{ epic = 1, needs = "only the foundation stories each story lists in its own after (no gate on the whole epic)" }]

[[epic]]
id = 8
slug = "epic-ux-rework"
title = "UX rework: a zone is a spot, one switch makes content visible"
description = "A zone is one spot with one display placed by site key and slug, a tale group's On switch shows its tales with per-tale hide, every zone, group and tale says whether it is visible and why not, and the zone page guides a first run; old zone keys and stages keep working. Runs before Tale Studio 7.7 onward (owner decisions D1 to D7, 2026-10-23)."
covers = ["R9", "R11", "R6", "R13", "R3"]
after = [{ epic = 3, needs = "the built zone, frame, stage, playbook, status and schedule behaviour (3.3 to 3.10) that this epic reworks" }]

[[epic]]
id = 7
slug = "epic-tale-studio"
title = "Tale Studio"
description = "Content managers compose a tale in Tale Studio from text, media, shapes, stickers and calls to action on a 9:16 canvas; the tale is a document of live elements that the Web SDK renders, and every existing tale is migrated to a document."
covers = ["R13", "R2", "R10"]
after = [{ epic = 1, needs = "only the foundation stories each story lists in its own after (media upload 1.12, dashboard shell 1.14)" }, { epic = 3, needs = "the viewer (3.2), the project theme (3.8) and the tale group cover (3.14), per story" }, { epic = 2, needs = "the difference report and re-import (2.6, 2.7) for story 13 only" }, { epic = 8, needs = "the UX rework's status model (8.1), Update tale wording (8.4), SDK zone and key changes (8.7) and accessibility review (8.17), per story: 7.7 onward runs after them" }]

[[epic]]
id = 4
slug = "epic-interactive-components"
title = "Interactive components"
description = "Authors add poll, quiz, emoji reaction, countdown, product pins, promo code and Rating to a tale, and viewers respond on the Web SDK."
covers = ["R4"]
after = [{ epic = 1, needs = "the data model and API" }, { epic = 7, needs = "the element-type registry (Tale Studio story 7.8), so each component is an element type in the tale document (AD-15)" }]

[[epic]]
id = 5
slug = "epic-targeting"
title = "Tag and audience targeting"
description = "Tags on tale groups combine with AND or OR, and user lists import from CSV and match the external user ID, deciding which groups a viewer sees; segments are built from user attributes."
covers = ["R5", "R12"]
after = [{ epic = 3, needs = "zones to demonstrate targeting (3.1)" }, { epic = 1, needs = "tags on tale groups (1.5) and the dashboard shell (1.14)" }, { epic = 8, needs = "site key and slug delivery (8.6), the indicator (8.2), the group row menu (8.10), the Tale groups page (8.14) and the docs (8.16), per story" }, { epic = 9, needs = "the native Delivery client and zone (9.2, 9.3) for story 9 only" }]

[[epic]]
id = 6
slug = "epic-analytics"
title = "Analytics"
description = "Per-widget and per-content metrics (Reach, Impression, Click, Engagement Rate, CTR) are recorded and shown, with published definitions."
covers = ["R7"]
after = [{ epic = 3, needs = "widgets emitting events" }, { epic = 4, needs = "interactive events" }]

[[epic]]
id = 9
slug = "epic-native-mobile"
title = "Native mobile"
description = "The Taller sample app and the mobile SDK, generated from the KMP wizard with package site.lempert.taleart and one shared Compose UI, show a zone's bar or banner and its tales on Android and iOS from the same Delivery API (owner direction 2026-10-23)."
covers = ["R9", "R11", "R13"]
after = [{ epic = 3, needs = "the Delivery API zone query by site key and slug (8.7)" }, { epic = 7, needs = "the tale document and registry (story 5 only)" }]
