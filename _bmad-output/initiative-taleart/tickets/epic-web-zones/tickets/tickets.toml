# Breakdown for epic-web-zones, vertical slices in build order.
# Each entry is a flow a person reviews in the dashboard or on the sample host page that loads the Web SDK.
# Table order is build order; id is permanent.
#
# Parallel lanes once story 1 is done:
#   SDK lane (renderers):        2 -> 5 -> 6 -> 8
#   Covers:                      14 (after 2, in parallel with 5 onward)
#   Stages:                      7 (after 5, in parallel with 6 and 8)
#   Tales lane (status, times):  3 -> 4 (in parallel with the whole SDK lane)
# Then 9 (after 7, 8), 10 (after 6, 7, 8); 11 and 12 run in parallel with each other; 13 closes.
# Lanes share the Delivery API router and the zone page in the dashboard, so merges there need care.

[[entry]]
id = 1
type = "story"
title = "Tracer: a sample web page shows a zone's tale groups in a bar"
description = "Extends GET /delivery/v1/zone (contract first) with the zone's tale groups and their tales in dashboard order, each tale with a link to its media. Media is served from public, unguessable URLs that need no key, so an <img> or <video> loads it directly; the zone key is used only to call the Delivery API (AD-11). Until story 3 adds status, all content counts as published. The Web SDK element <taleart-view> takes the API URL and zone key, fetches the zone and renders a bar frame: one item per tale group with its first tale's media as cover and the group's title, scrollable horizontally, with default bar settings (R2 here is the bar with defaults; its settings come in story 5). Frame types the SDK does not know are skipped (AD-5); a refused key renders nothing and logs one console error. Adds the sample host page that loads the built SDK, and a build check that fails above 50 KB gzipped (R10 here is the bundle check only; first-content time is story 11)."
verify = "In the dashboard issue a zone key for a zone with a bar frame and two tale groups with media; open the sample host page with that key: both groups show as bar items in dashboard order with covers and titles, and the cover's media URL opens in a fresh browser tab without any key; revoke the key and reload: nothing renders and the console shows one error."
covers = ["R1", "R2", "R10"]
after = ["1.4", "1.6", "1.8", "1.12"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-2", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-5", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]

[[entry]]
id = 2
type = "story"
title = "Open a tale group in the full-screen viewer"
description = "Activating a bar item opens its tale group in a full-screen viewer: images show for a fixed duration and videos play to their end, with progress segments; tap or arrow keys move to the next or previous tale, past the last or first tale they move to the next or previous group, swipe moves between groups, tap-and-hold or the Space key pauses and resumes, Escape or the close button closes and returns focus to the bar item. Viewed groups are remembered in the browser's local storage and show the seen ring in the bar. Includes an automated WCAG 2.2 AA scan of the viewer (R11 here is the viewer scan; the manual walk is story 12)."
verify = "On the sample page open a group, step through its tales by tap and arrow keys, pause and resume with Space, swipe to the next group and back, close with Escape and see focus back on the bar item; reload: the viewed group shows the seen ring."
covers = ["R4", "R11"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Choose a tale group cover, still or animated"
description = "A tale group gets an optional cover, stored as media through the storage port and served like other published media (AD-11). With none set, the bar shows the group's first tale's image. In the dashboard a content manager uploads a cover image, or for a video tale picks the cover frame with a timeline knob, or makes a short animated cover (a few frames, encoded as WebM or GIF); frames are captured and encoded in the browser, since the server does not transcode. An animated cover is at most 300 KB [ASSUMPTION], refused above that. The Delivery API returns the cover link with the group, and the bar shows it, animating an animated cover unless the visitor prefers reduced motion."
verify = "A group with no cover shows its first tale's image in the bar on the sample page; on a video tale drag the timeline knob, save, reload: the bar shows that frame; make an animated cover: the bar item animates, and stays still with reduced motion turned on in the OS; an animated cover above 300 KB is refused."
covers = ["R12"]
after = [2]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]
notes = ["The 300 KB cap is an [ASSUMPTION] to protect the 1.5 s budget (R10); the user confirms it."]

[[entry]]
id = 3
type = "story"
title = "Publish, pause and archive tale groups and tales"
description = "Adds the AD-6 status map to libs/contract (key and HTTP code, defined once, including draft mapped to 204 [ASSUMPTION]) and a stored status on tale groups and tales in the tales module. In the dashboard a content manager publishes, pauses and archives a group or a tale, sees a status badge, and restores an archived item. New items start draft; existing rows migrate to live. The Delivery API returns only live groups and their live tales; the tales of a paused group read as blocked-by-group in the dashboard. Media of content that is not published stops being public: its public URL answers 404 (AD-11)."
verify = "Pause a tale group in the dashboard and reload the sample page: it is gone; publish it: it is back; pause the first tale of a live group: the bar item's cover becomes the group's next tale; archive a group and restore it: it returns paused; a new tale group shows a draft badge and does not appear on the sample page until published; the media URL of a paused tale answers 404."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-6", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]
notes = ["draft maps to HTTP 204 as an [ASSUMPTION]; the user confirms it."]

[[entry]]
id = 4
type = "story"
title = "Schedule tale groups and tales with start and end times"
description = "A content manager sets an optional start and end time on a tale group and on a tale in the dashboard, entered in the browser's time zone and stored in UTC; an end before the start is refused. The dashboard shows scheduled before the start and expired after the end; both are computed from the stored live status and the window when the content is read, and no job stores them (AD-6). The Delivery API returns only content whose own window and its group's window contain the current time."
verify = "Set the end time of a group's first tale one minute ahead, wait, reload the sample page: the bar item's cover becomes the next tale and the dashboard shows expired; give a group a start time one minute ahead: it is hidden, then appears after the start passes; an end before the start is refused."
covers = ["R6"]
after = [3]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-6"]

[[entry]]
id = 5
type = "story"
title = "Edit bar settings in the dashboard"
description = "Defines the bar fields in libs/contract/frame-types/bar.schema.json (shape, size, showTitles, alignment, gap, with defaults per epic R2). The dashboard edits an existing frame's settings through a form built from the frame type's schema, and the API validates on update. Stories 6 and 8 reuse this schema-built settings form. The SDK bar renderer applies each setting."
verify = "In the dashboard set the bar to rounded-square, large, titles hidden, centered, gap 20; reload the sample page: the bar follows each setting; a gap of 40 is refused with an error."
covers = ["R2"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Show a banner frame on the sample page"
description = "Defines the banner fields in libs/contract/frame-types/banner.schema.json (aspectRatio, autoplay, intervalSeconds, showDots, loop, with defaults per epic R3), edited with the schema-built form from story 5. The SDK banner renderer shows one slide per published tale group with its first tale, with previous and next buttons, swipe and dots; autoplay stops on interaction or when the visitor prefers reduced motion. Activating a slide opens the viewer at that group. Includes an automated WCAG 2.2 AA scan of the banner (R11 here is the banner scan; the manual walk is story 12)."
verify = "Add a banner frame to a zone that has a bar; the sample page shows both; set the banner to 3:1, interval 3 s, no dots: it follows after a reload; with reduced motion turned on in the OS it does not autoplay; clicking a slide opens the viewer at that group."
covers = ["R3", "R11"]
after = [2, 5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Place a zone on a page with stages"
description = "In the zones module a stage belongs to a zone and its project, has a name and a key unique in the zone, and shows one of the zone's frames. A content manager creates, renames and deletes stages on the zone page in the dashboard. The Delivery API returns the zone's stages; <taleart-view stage=\"<key>\"> renders that stage's frame, an unknown stage key renders nothing with a console warning, and with no stage named the zone's frames render in order."
verify = "Give a zone two bar frames, one with circle items and one with rounded-square items, and a stage for each; put two <taleart-view> elements naming the two stage keys on the sample page: each shows its own frame's shape; an unknown stage key renders nothing and logs a warning."
covers = ["R7"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Set the project theme in the dashboard"
description = "Adds a theme schema in libs/contract (ringStyle, ringColors, seenRingColor, ringWidth, cornerRadius, fontFamily, titleColor, backgroundColor, accentColor per epic R9) and TaleArt's default theme, which passes WCAG 2.2 AA contrast. The theme is stored once per project (not per frame or zone). A content manager edits the project's theme in the dashboard with color pickers. The Delivery API returns the project's theme with the zone, and the SDK applies it to the bar, the banner and the viewer."
verify = "In the dashboard set a solid ring in one color, corner radius 0 and a serif font in the project's theme; reload the sample page: the bar, the banner, the seen ring and the viewer follow; an invalid color is refused."
covers = ["R9"]
after = [5, 6]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Override the theme in the Web SDK configuration"
description = "A developer passes theme fields for a zone in the Web SDK configuration (a JavaScript option for the zone and the element's theme property); there is no override per frame. Each field resolves from the SDK configuration for that zone, then the project's theme, then TaleArt's default; an invalid SDK value is ignored with a console warning naming the field. The SDK's public configuration is documented in the web-sdk README."
verify = "Set a red ring in the project's theme in the dashboard and a blue ring for the zone in the sample page's SDK configuration: the bar and the banner show blue; remove the SDK value: red returns; an SDK ringWidth of 9 is ignored with a warning and the dashboard width applies. Then the epic demo: one zone with a bar stage and a banner stage on the sample page, both styled by the project's theme with the zone's SDK override applied."
covers = ["R9"]
after = [7, 8]
hitl = false
risk = "low"

[[entry]]
id = 10
type = "story"
title = "Apply a playbook to a zone"
description = "Adds a playbook registry in libs/contract (key, label, goal, preset frames with settings, and a stage per frame), registry data like the frame-type registry, not a table. Two presets ship: \"Home page stories bar\", one bar frame (circle, medium, titles shown, start, gap 12) with its stage; and \"Promo banner\", one banner frame (3:1, autoplay, interval 5 s, dots shown, loop) with its stage. Playbooks set no theme; frames use the project's theme. In the dashboard a content manager picks a playbook for a zone; the zone records the playbook's key and gets its frames and stages, which stay editable. Applying it twice does not duplicate frames."
verify = "Apply \"Home page stories bar\" to an empty zone and \"Promo banner\" to another in the dashboard: each zone's frame and stage appear with the preset settings, and the sample page renders them by stage; editing a preset frame works; applying a playbook again adds nothing."
covers = ["R8"]
after = [6, 7, 8]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Show first zone content within 1.5 s on Fast 4G"
description = "Adds a repeatable measurement of the sample page under a mid-tier mobile profile on Fast 4G that reports p75 time to first visible zone content over repeated loads, and makes it meet 1.5 s: changing only what the measurement shows is needed (caching is deferred by the architecture until measured), for example small cover renditions for bar items, loading viewer code only on first open, or cache headers, while the bundle stays within 50 KB gzipped. The measurement runs as one Nx target named in the web-sdk README."
verify = "Run the measurement target named in the web-sdk README against the sample page: it reports p75 first content at or under 1.5 s and a bundle at or under 50 KB gzipped."
covers = ["R10"]
after = [4, 7, 9, 14]
hitl = false
risk = "high"
notes = ["Animated tale group covers (story 14) count toward the 1.5 s budget; the measurement includes a zone with an animated cover."]

[[entry]]
id = 12
type = "story"
title = "Accessibility review of bar, banner and viewer"
description = "Runs the WCAG 2.2 AA scan over the sample page with the default theme, and over the dashboard screens this epic adds (status badges and actions, start and end fields, the settings form, theme color pickers, stages, playbooks, the cover editor), and fixes what it finds; a person then walks the bar, banner and viewer with a keyboard and a screen reader (VoiceOver or NVDA) and records the result, and the issues found are fixed."
verify = "The automated scan of the sample page and the new dashboard screens reports no WCAG 2.2 AA violations, and the person's walk record shows every bar item, slide, viewer control and close action reachable and announced."
covers = ["R11"]
after = [9, 10, 14]
hitl = true # a person does the screen-reader and keyboard walk
risk = "medium"

