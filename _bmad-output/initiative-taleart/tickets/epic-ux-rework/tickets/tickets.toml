[[entry]]
id = 10
type = "story"
title = "Tale groups as a list with a switch and a ⋯ menu"
description = "Size M. Turns each placed group on the Tale groups tab into one list row: reorder handle (drag and keyboard), cover, name, 'n of m shown', On/Off switch, indicator text and a ⋯ menu holding Rename, Cover, Tags, Schedule, Show in another zone, Copy to zone, Remove from this zone and Archive, with disabled items stating their reason; 'New tale group' and 'Add existing group' below; stacked two-line rows at 390 px (epic R10). The tale strip moves into the group view (story 11)."
verify = "A zone with three groups lists them with counts and indicators; switching one On updates its indicator and the sample page; every ⋯ item works, and 'Show in another zone' is disabled with 'Already in every zone' when it applies; a 390x844 screenshot shows full names and no horizontal scroll."
covers = ["R10", "R8"]
after = [3, 9]
hitl = false
risk = "medium"
notes = ["Owner decision D5 (2026-10-23)."]

