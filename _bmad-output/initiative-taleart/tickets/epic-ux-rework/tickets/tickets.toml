# Breakdown for epic-ux-rework, vertical slices in build order.
# Each entry is a flow a person reviews in the dashboard or on the sample host page that loads the Web SDK.
# Table order is build order; id is permanent.
#
# Phase 1, concept and status model with migrations:
#   Status lane (tales module, contract, Delivery filter): 1 -> 2 -> 3, 4
#   Zone lane (zones and access modules, Delivery API, SDK), after 2 because it changes
#   the indicator's zone reasons: 5 -> 6 -> 7, and 8 after 5
#   After 2, the zone lane runs beside 3 and 4; they share the zone page, so merges there need care.
# Phase 2, layout (dashboard): 9 -> 10 -> 11 -> 12 -> 13, and 14 after 10
# Phase 3, polish: 15, 16, then 17 (accessibility review, hitl), 18 (sweep).
# Sizes (S, M, L) are the UX report's, for planning only; not estimates.

[[entry]]
id = 1
type = "story"
title = "Tracer: turning a group On shows its tales; tales are hidden one by one"
description = "Size M. Adds the shown-status mapping to libs/contract (group On = live, Off = draft or paused; tale Shown = live, Hidden = draft or paused; Archived) and changes the tales module: new tales are stored live, turning Off and hiding store paused, blocked-by-group applies when the group is draft or paused, and a tale with nothing published is not delivered (epic R6). A forward-only migration makes draft tales in never-live groups live and leaves draft tales in live groups draft, so no visitor sees a change. The dashboard's current group rows and tale cards say On/Off and Shown/Hidden with a switch in place of Publish/Pause; Archive stays where it is until story 10."
verify = "On the sample page: create a group with three tales from media, turn it On: all three show; hide one: two show; turn the group Off: none show and each tale reads blocked by group; on a pre-rework database snapshot, the Delivery responses for every zone are byte-identical before and after the migration."
covers = ["R6"]
after = ["3.3", "3.4"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-6", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-15"]
notes = ["Owner decisions D2 and D3 (2026-10-23)."]

[[entry]]
id = 2
type = "story"
title = "Every zone, group and tale says whether it is visible, and why not"
description = "Size M. Adds one visibility function (contract types, tales and zones modules) that the Delivery filter and the Management API both use, returning visible plus the reasons of epic R7, and shows it in the current dashboard: a dot and 'Visible on site' or 'Not visible: <reason>' on zone cards, group rows and every tale card. 'Zone not installed' and 'zone has no display' use today's zone key and frames until stories 5 and 6 change them."
verify = "A fixture per reason puts content in that state: the indicator names it and the sample page shows nothing; fixing it turns the indicator to 'Visible on site' and the sample page shows the content; a unit test runs the indicator and the Delivery filter on the same fixtures and they agree on every case."
covers = ["R7"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Schedules stay out of sight until used"
description = "Size S. Removes every 'No schedule' text and the row's Schedule button; Schedule moves into the group's and tale's ⋯ (a temporary menu on today's row until story 10 builds the real one); a chip shows a window when one exists; the schedule drawer offers 'Remove schedule' only then; a window that hides content shows as 'Not visible: starts …' or 'ended …' (epic R8)."
verify = "A group and a tale without a window show no schedule text or button outside the ⋯ menu; set a future start: the chip and 'Not visible: starts …' appear; remove it: both disappear."
covers = ["R8"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Tale Studio says Update tale and speaks the indicator's words"
description = "Size S. Renames 'Publish changes' to 'Update tale' and 'Discard draft' to 'Discard changes', removes 'Publish' from the studio, and makes the status line use the indicator (epic R15); behaviour stays as AD-15 defines it."
verify = "Edit a visible tale: the line says changes are not updated yet and the sample page is unchanged; press Update tale: the sample page shows the edit and the line says up to date; in a group that is Off the line says 'Not visible: group is off'."
covers = ["R15"]
after = [2]
hitl = false
risk = "low"
notes = ["Owner decision D4 (2026-10-23)."]

[[entry]]
id = 5
type = "story"
title = "A zone has one display and a slug; stages and frames migrate into zones"
description = "Size L. Zones get a slug and at most one display (a frame row, unique per zone); the stages API and the dashboard Stages card go away, and the Frames card becomes a single Display card (epic R1). A forward-only migration follows epic R2: each stage and each extra frame becomes its own zone with copied placements, recording the original zone id and stage key for legacy keys. Until story 7, the Delivery API keeps serving old zone keys through those records."
verify = "On a database seeded with a zone of two stages and an unstaged frame and a zone of two frames without stages, the migration yields five zones with one display each, the expected names and slugs and identical placement lists, and a second run changes nothing; the sample page with each old zone key and stage shows what it showed before."
covers = ["R1", "R2"]
after = [2, "3.7", "3.10"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-17", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-14"]
notes = ["Owner decision D1 (2026-10-23)."]

[[entry]]
id = 6
type = "story"
title = "Place a zone with the project's site key and its slug"
description = "Size M. Adds the project site key to the access module (one active per project, shown once, hashed, rotate and revoke, AD-9), lets the Delivery API answer a site key plus a zone slug (AD-2), and adds the site-key and zone attributes and properties to <taleart-view>, with the SDK theme override set per zone slug (epic R3). Issuing the site key is a temporary action on the zone page until the Install tab (story 13)."
verify = "Issue a site key, place two zones of the project on the sample page with it: each shows its own display and groups; an unknown slug and a revoked site key render nothing and log one console error each; a theme override for one slug changes only that zone; the bundle stays at or under 50 KB gzipped."
covers = ["R3"]
after = [5]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-2", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-9"]
notes = ["Owner decision D6 (2026-10-23)."]

[[entry]]
id = 7
type = "story"
title = "Remove zone keys and the stage attribute"
description = "Size S. Owner decision 2026-10-22: no host page uses the old zone keys, so the legacy paths go (epic R4 dropped). Removes zone keys (issue, rotate, revoke, Delivery lookup), the stage attribute and configureZone(zoneKey) from the API, the Web SDK and the dashboard, and drops the legacy-SDK check and the original-zone/stage-key records the migration kept; the site key plus zone slug (story 6) is the only way to place a zone."
verify = "No zone-key or stage code path remains in the API, the SDK or the dashboard; the sample page renders every zone with the site key and slug; the SDK stays at or under 50 KB gzipped and first content at or under 1.5 s p75."
covers = ["R4"]
after = [6]
hitl = false
risk = "medium"
notes = ["Owner decision 2026-10-22: 'No one used it, you can change and remove what you want.'"]

[[entry]]
id = 8
type = "story"
title = "Pick a template when creating a zone"
description = "Size S. Renames the playbook registry to templates (Stories bar, Promo banner, plus Blank) and adds the template choice to the New zone drawer, which sets the display once and records the 'created from template' note; removes the Playbook card and the apply-playbook action; preselects and hides the project picker when the user has one project (epic R5)."
verify = "Create a zone from each template and see its preset display on the sample page; with one project the drawer shows no project picker; no Playbook card or apply action remains."
covers = ["R5"]
after = [5]
hitl = false
risk = "low"
notes = ["Owner decision D7 (2026-10-23)."]

[[entry]]
id = 9
type = "story"
title = "Zone page with a header, a setup checklist and three tabs"
description = "Size M. Replaces the five equal cards with a header (name, indicator, display type, group count, installed state), tabs Tale groups (default), Display (type, settings, 'Style: project theme' link) and Install (key actions moved here; snippet in story 13), with the tab in the URL, and a setup checklist shown until the zone is first visible (epic R9)."
verify = "A new zone opens on Tale groups with three open checklist steps; doing each ticks it; once the zone is visible the checklist is gone after reload; reloading on the Display tab keeps it; the theme link opens the project theme."
covers = ["R9"]
after = [2, 5, 6, 8]
