title = "Accessibility review of the reworked dashboard (WCAG 2.2 AA)"
description = "Size M. Runs automated WCAG 2.2 AA scans of the zones list, the zone page on each tab, the group drawer, the tale drawer, the Tale groups page and the Tale Studio status bar, and fixes what they find; a person then completes the first-run path with only a keyboard and a screen reader (VoiceOver or NVDA), and the walk and its fixes are recorded (epic R18)."
