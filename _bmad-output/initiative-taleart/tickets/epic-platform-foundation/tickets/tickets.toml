[[entry]]
id = 6
type = "story"
title = "Pick a frame type for a zone"
description = "A user assigns a bar or banner frame to a zone. Frame settings are validated against the type's JSON Schema in libs/contract. A frame type added by configuration appears in the picker and saves with no migration."
verify = "Assign bar; add a test frame type by configuration; it appears in the picker and saves; invalid settings are refused."
covers = ["R3"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Sign in to the dashboard"
description = "A user signs in to the dashboard with a server-side session in an http-only cookie and sees only the zones of their own project; every Management API call checks the project against the session."
verify = "A user from another project does not see the zone, and a request naming that project is refused."
covers = ["R2"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Issue, rotate and revoke a zone key"
description = "In the dashboard a user issues a zone key, shown once and stored hashed, then rotates or revokes it. The Delivery API at /delivery/v1 accepts or refuses the key accordingly."
verify = "A revoked key is refused with 401; a rotated key replaces the old one."
covers = []
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Staging demo of the full flow"
description = "On the staging host a user signs in, creates a zone and a tale in a group, and issues a zone key that works."
verify = "On staging: sign in, create a zone and a tale, issue a key, and the key is accepted by the API."
covers = []
after = [2, 8]
hitl = true # a person provides the staging host and its credentials
risk = "medium"

