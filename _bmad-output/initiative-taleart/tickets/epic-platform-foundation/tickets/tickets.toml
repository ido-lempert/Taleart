# Draft breakdown for epic-platform-foundation, vertical slices in build order.
# Each entry is one flow a user can click through in the dashboard, from UI to API to database.
# Table order is build order; id is permanent.

[[entry]]
id = 1
type = "story"
title = "Tracer: create and list a zone in the dashboard"
description = "A user creates a project, then a zone in it, in the dashboard; both are stored in PostgreSQL through the API and are still listed after a restart."
verify = "Create a project and a zone in the dashboard, restart the API, reload: both are listed and the zone belongs to the project."
covers = ["R1", "R2"]
after = []
hitl = true # a person provisions the local PostgreSQL database
risk = "high"

[[entry]]
id = 11
type = "story"
title = "Align the prototype with the architecture"
description = "Moves the project and zone routes to /api/v1, adds libs/contract with the OpenAPI 3.1 document and generated types, splits access and zones into libs/server modules with Nx boundary tags, and returns the standard error body. The dashboard flow from story 1 keeps working."
verify = "In the dashboard, create a project and a zone through /api/v1; a zone without a project returns the standard error body; an import across a module boundary fails lint."
covers = ["R1", "R3"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-1", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-3"]

[[entry]]
id = 2
type = "story"
title = "CI runs tests and blocks merges that fail"
description = "Lint, test and build run for the API and dashboard on each pull request on Node 24, with PostgreSQL 18 from a Docker Compose file shared with local development; a failing check blocks the merge."
verify = "A pull request with a failing test shows a red check and cannot be merged."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Add a tale to a zone, with a project required"
description = "In the dashboard a user adds a tale to a zone through /api/v1. The form requires a project, and the tale is stored with it, in the tales module."
verify = "Submitting a tale without a project shows an error; with a project, the tale appears in the zone."
covers = ["R1", "R2"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Organize tales into tale groups"
description = "A user groups tales into a tale group and reorders groups and tales in the dashboard."
verify = "Drag a tale into a group and reorder it; after a reload the group and order are kept."
covers = ["R1"]
