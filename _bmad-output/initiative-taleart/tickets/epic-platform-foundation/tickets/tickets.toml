[[entry]]
id = 8
type = "story"
title = "Issue, rotate and revoke a zone key"
description = "In the dashboard a user issues a zone key, shown once, then rotates or revokes it. The API accepts or refuses the key accordingly."
verify = "A revoked key is refused with 401; a rotated key replaces the old one."
covers = []
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Staging demo of the full flow"
description = "On the staging host a user signs in, creates a zone and a tale in a group, and issues a zone key that works."
verify = "On staging: sign in, create a zone and a tale, issue a key, and the key is accepted by the API."
covers = []
after = [2, 8]
hitl = true # a person provides the staging host and its credentials
risk = "medium"

