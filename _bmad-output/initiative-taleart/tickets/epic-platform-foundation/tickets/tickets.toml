type = "story"
title = "CI runs tests and blocks merges that fail"
description = "Dropped on 2026-10-20 by the user: the project only commits locally, with no remote repository or hosted CI for now. Revisit when a remote repository exists."
verify = "A pull request with a failing test shows a red check and cannot be merged."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Create a tale group in a zone and add tales to it"
description = "In the dashboard a user creates a tale group in a zone, then adds tales to it through /api/v1. A tale exists only inside a tale group (PRD FR-010), never directly in a zone. Tale groups and tales carry the zone's project, in the tales module. A tale has a title only in this slice; media comes in story 12."
verify = "Create a tale group in a zone and add two tales; after a reload both are listed under the group in the order added. Adding a tale to an unknown group shows an error."
covers = ["R1", "R2"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Modern dashboard: app shell and design system"
description = "Requested by the user on 2026-10-20: the dashboard must look like a modern engagement product (comparable to Storyly's dashboard), not a plain HTML page. Adds TaleArt's own design system (tokens, typography, components) and an app shell: a left navigation rail, a top bar with a project switcher, pages per area with routing, cards and a side panel (drawer) for create forms, and tale previews as 9:16 phone cards inside tale-group rows. Existing flows (projects, zones, frames, tale groups, tales) keep their behavior. TaleArt's own name, logo, colors and wording; no Storyly assets, logo, colors or copied text."
verify = "Open the dashboard: a navigation rail and project switcher are shown; Zones lists zone cards for the chosen project; opening a zone shows its frames and its tale groups as rows of 9:16 tale cards; creating a project, zone, frame, tale group and tale works from side panels; the layout works at desktop and phone widths."
covers = ["R1"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Upload an image or video to a tale"
description = "A user uploads an image, GIF or video to a tale in the dashboard. The file goes through the media storage port with the local-disk adapter (AD-11); the tale stores the storage key, and the dashboard shows a preview."
verify = "Upload an image to a tale, reload, and the preview is shown; a file of an unsupported type is refused with an error."
covers = ["R1"]
after = [3, 14]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]

