# Draft breakdown for epic-platform-foundation, vertical slices in build order.
# Each entry is one flow a user can click through in the dashboard, from UI to API to database.
# Table order is build order; id is permanent.

[[entry]]
id = 1
type = "story"
title = "Tracer: create and list a zone in the dashboard"
description = "A user creates a project, then a zone in it, in the dashboard; both are stored in PostgreSQL through the API and are still listed after a restart."
verify = "Create a project and a zone in the dashboard, restart the API, reload: both are listed and the zone belongs to the project."
covers = ["R1", "R2"]
after = []
hitl = true # a person provisions the local PostgreSQL database
risk = "high"

[[entry]]
id = 11
type = "story"
title = "Align the prototype with the architecture"
description = "Moves the project and zone routes to /api/v1, adds libs/contract with the OpenAPI 3.1 document and generated types, splits access and zones into libs/server modules with Nx boundary tags, and returns the standard error body. The dashboard flow from story 1 keeps working."
verify = "In the dashboard, create a project and a zone through /api/v1; a zone without a project returns the standard error body; an import across a module boundary fails lint."
covers = ["R1", "R3"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-1", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-3"]

[[entry]]
id = 2
type = "story"
title = "CI runs tests and blocks merges that fail"
description = "Dropped on 2026-10-20 by the user: the project only commits locally, with no remote repository or hosted CI for now. Revisit when a remote repository exists."
verify = "A pull request with a failing test shows a red check and cannot be merged."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Create a tale group in a zone and add tales to it"
description = "In the dashboard a user creates a tale group in a zone, then adds tales to it through /api/v1. A tale exists only inside a tale group (PRD FR-010), never directly in a zone. Tale groups and tales carry the zone's project, in the tales module. A tale has a title only in this slice; media comes in story 12."
verify = "Create a tale group in a zone and add two tales; after a reload both are listed under the group in the order added. Adding a tale to an unknown group shows an error."
covers = ["R1", "R2"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Modern dashboard: app shell and design system"
description = "Requested by the user on 2026-10-20: the dashboard must look like a modern engagement product (comparable to another tool's dashboard), not a plain HTML page. Adds TaleArt's own design system (tokens, typography, components) and an app shell: a left navigation rail, a top bar with a project switcher, pages per area with routing, cards and a side panel (drawer) for create forms, and tale previews as 9:16 phone cards inside tale-group rows. Existing flows (projects, zones, frames, tale groups, tales) keep their behavior. TaleArt's own name, logo, colors and wording; no another tool assets, logo, colors or copied text."
verify = "Open the dashboard: a navigation rail and project switcher are shown; Zones lists zone cards for the chosen project; opening a zone shows its frames and its tale groups as rows of 9:16 tale cards; creating a project, zone, frame, tale group and tale works from side panels; the layout works at desktop and phone widths."
covers = ["R1"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Upload an image or video to a tale"
description = "A user uploads an image, GIF or video to a tale in the dashboard. The file goes through the media storage port with the local-disk adapter (AD-11); the tale stores the storage key, and the dashboard shows a preview."
verify = "Upload an image to a tale, reload, and the preview is shown; a file of an unsupported type is refused with an error."
covers = ["R1"]
after = [3, 14]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]

[[entry]]
id = 4
type = "story"
title = "Reorder tale groups and tales"
description = "A user reorders the tale groups in a zone and the tales in a group in the dashboard."
verify = "Reorder a tale within its group and a group within its zone; after a reload the order is kept."
covers = ["R1"]
after = [3, 14]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Tag tale groups"
description = "A user creates tags in a project and adds them to tale groups in the dashboard (PRD FR-017; user decision 2026-10-20: tags go on tale groups, not tales). Tags carry the project. Targeting by tags is the targeting epic; collections wait for the user's answer on what a collection holds."
verify = "Create a tag, add it to two tale groups, filter the zone page by that tag, reload: the same groups carry the tag."
covers = ["R1", "R2"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Pick a frame type for a zone"
description = "A user assigns a bar or banner frame to a zone. Frame settings are validated against the type's JSON Schema in libs/contract. A frame type added by configuration appears in the picker and saves with no migration."
verify = "Assign bar; add a test frame type by configuration; it appears in the picker and saves; invalid settings are refused."
covers = ["R3"]
after = [1, 11]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Set up the first admin and sign in with a passkey"
description = "On a fresh install with no users, the dashboard asks for a name and email and registers a passkey (WebAuthn); that first user is the admin. Afterwards anyone signs in with their passkey only; there are no passwords and no open sign-up. A session lives server-side behind an http-only cookie, and every /api/v1 call except health and sign-in needs it."
verify = "On an empty database, register the first admin with a passkey and see the dashboard; sign out and sign in again with the passkey; once an admin exists the setup screen is gone; a call without a session gets 401."
covers = ["R2"]
after = [1, 11, 14]
hitl = false
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "Invite a user to a project"
description = "An admin creates an invitation for a project, shown as a one-time link in the dashboard (no mail server needed). The invitee opens it, registers a passkey and becomes a content manager of that project. A content manager sees only the projects they belong to; a request naming another project is refused. Only an admin creates projects and invitations."
verify = "An admin invites a user to project A; the user registers a passkey and sees project A but not project B; a request for project B returns 403; a used or expired link is refused."
covers = ["R2"]
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Issue, rotate and revoke a zone key"
description = "In the dashboard a user issues a zone key, shown once and stored hashed, then rotates or revokes it. The Delivery API at /delivery/v1 accepts or refuses the key accordingly."
verify = "A revoked key is refused with 401; a rotated key replaces the old one."
covers = []
after = [13]
hitl = false
risk = "medium"

