[[entry]]
id = 15
type = "story"
title = "Show one tale group in several zones"
description = "Decided by the user on 2026-10-20 (AD-14): a tale group belongs to its project, not to one zone. The tales module adds zone placements (zone, tale group, position, project) and a migration that turns every existing group into a project group with one placement in its current zone, keeping its position (groups made by stories 1.3, 1.4, 1.5 and web-zones 3.1). The zone page, reordering (1.4) and the Delivery API zone response (3.1) read a zone's groups through its placements, and each zone keeps its own order. On a tale group the dashboard adds \"Add to zone…\" (places the same group, linked, in another zone of the project), \"Remove from this zone\" (deletes only that placement), and an \"Also in: …\" line naming its other zones. A group placed in no zone stays in the project and is listed on a project-level groups view."
verify = "Open a zone with a tale group, choose \"Add to zone…\" and pick a second zone: the group appears there and shows \"Also in: <first zone>\"; rename the group and add a tale in one zone: both zones show the change after a reload; reorder groups in one zone: the other zone's order is unchanged; \"Remove from this zone\" in the first zone leaves the group in the second; remove it there too: it still exists in the project's groups list. Groups created before the change sit in their old zone at their old position."
covers = ["R1", "R2"]
after = [3, 4, 5, "3.1"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-14", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-4"]
notes = ["Waits on web-zones story 3.1 because it changes the Delivery API zone query that 3.1 builds; foundation runs before web zones in the epic order, so this cross-epic after is recorded by Decision."]

[[entry]]
id = 16
type = "story"
title = "Copy a tale group to another zone"
description = "On a tale group the dashboard offers \"Copy to zone…\": the user picks a zone in the same project or in another project they can access, and gets an independent tale group with copies of its tales, tags and media references (the same storage keys; media files are not duplicated), placed at the end of that zone. Later edits to either group do not reach the other. In another project, tags are matched by name and created when missing. The API checks the user's access to both projects (AD-4). Typical use: test in a staging zone, then copy to the production zone."
verify = "Copy a tagged group with two tales from zone A to zone B in the same project: B shows a new group with the same tales, media previews and tags; rename the copy: the original keeps its name. Copy a group to a zone in another project you can access: it arrives with its media, and its tags exist in that project by name, reusing one that already had the same name. A content manager does not see projects they do not belong to in the zone picker, and the API refuses such a copy with 403."
covers = ["R1", "R2"]
after = [15]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-14", "_bmad-output/initiative-taleart/architecture-taleart/architecture-taleart.md#ad-11"]

