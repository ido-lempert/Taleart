        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateZone
      summary: Rename a zone or change its slug.
      description: >-
        `name` is trimmed and must not be blank. `slug` must be lowercase
        letters and digits, words joined by single hyphens, at most 64
        characters (400 `validation_failed`), and free in the zone's project
