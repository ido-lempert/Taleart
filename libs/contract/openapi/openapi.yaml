                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
