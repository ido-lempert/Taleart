openapi: 3.1.0
info:
  title: TaleArt Management API
  version: 1.0.0
  description: >-
    Source of truth for TaleArt request and response shapes (AD-3).
    A shape change starts here; regenerate the TypeScript types with
    `npm exec nx -- run contract:generate`.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the API is up.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/state:
    get:
      operationId: getAuthState
      summary: Whether setup is still needed, and who is signed in.
      description: >-
        Works with or without a session. `user` is null when the request has
        no valid session.
      security: []
      responses:
        '200':
          description: The auth state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/options:
    post:
      operationId: startSetup
      summary: Start registering the first admin's passkey.
      description: >-
        Only while no user exists; afterwards 409 `setup_closed`. Answers WebAuthn
        creation options (user verification and a resident key required) and sets
        the http-only `taleart_challenge` cookie. The challenge is single-use and
        expires after 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/verify:
    post:
      operationId: finishSetup
      summary: Register the first admin's passkey and sign them in.
      description: >-
        Checks the authenticator response against the challenge found through
        the `taleart_challenge` cookie, creates the admin and their passkey, and
        sets the `taleart_session` cookie. Bad or expired challenge, or failed
        verification: 400 `passkey_failed`. A user already exists: 409 `setup_closed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: The admin, now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/options:
    post:
      operationId: startSignIn
      summary: Start signing in with a passkey.
      description: >-
        Answers WebAuthn request options without `allowCredentials` (the passkey
        is discoverable, so no email is needed) and sets the http-only
        `taleart_challenge` cookie. The challenge is single-use and expires after 5 minutes.
      security: []
      responses:
        '200':
          description: WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/verify:
    post:
      operationId: finishSignIn
      summary: Sign in with a stored passkey.
      description: >-
        Checks the authenticator response and the signature counter, then sets
        the `taleart_session` cookie (7 days). Unknown passkey, bad or expired
        challenge, or failed verification: 401 `passkey_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session.
      description: Deletes the session and clears the `taleart_session` cookie. Works without a session too.
      security: []
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      summary: List projects, oldest first.
      responses:
        '200':
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones:
    get:
      operationId: listZones
      summary: List zones, oldest first.
      responses:
        '200':
          description: All zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZone
      summary: Create a zone in a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /frame-types:
    get:
      operationId: listFrameTypes
      summary: List the frame types in the registry (AD-5).
      responses:
        '200':
          description: Every registered frame type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrameType'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/frames:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneFrames
      summary: List a zone's frames, oldest first.
      responses:
        '200':
          description: The zone's frames.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Frame'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneFrame
      summary: Add a frame of a registered type to a zone.
      description: >-
        `settings` is validated against the JSON Schema of the frame type.
        A missing `settings` is treated as `{}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFrameRequest'
      responses:
        '201':
          description: The created frame.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneTaleGroups
      summary: List a zone's tale groups by position, each with its tales by position.
      responses:
        '200':
          description: The zone's tale groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaleGroup'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneTaleGroup
      summary: Create a tale group in a zone, after its existing groups.
      description: The tale group takes its project from the zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleGroupRequest'
      responses:
        '201':
          description: The created tale group, with no tales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups/order:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderZoneTaleGroups
      summary: Set the order of a zone's tale groups.
      description: >-
        The list names every tale group of the zone exactly once; positions are
        rewritten to 0..n-1 in that order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown zone: 404 `zone_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTaleGroupsRequest'
      responses:
        '200':
          description: The zone's tale groups in the new order, each with its tales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createTale
      summary: Add a tale to a tale group, after its existing tales.
      description: >-
        The tale takes its project from the tale group. A tale group holds at
        most 100 tales; adding to a full group answers 409 `tale_group_full`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleRequest'
      responses:
        '201':
          description: The created tale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales/order:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderTales
      summary: Set the order of a tale group's tales.
      description: >-
        The list names every tale of the group exactly once; positions are
        rewritten to 0..n-1 in that order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown tale group: 404
        `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTalesRequest'
      responses:
        '200':
          description: The group's tales in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/media:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleMedia
      summary: Read a tale's media file.
      description: The stored bytes, with the `Content-Type` they were uploaded with.
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putTaleMedia
      summary: Upload or replace a tale's image, GIF or video.
      description: >-
        The body is the file's bytes and `Content-Type` its type. Images
        (`image/jpeg`, `image/png`, `image/webp`, `image/gif`) may be up to
        10 MB and videos (`video/mp4`, `video/webm`) up to 100 MB. The declared
        type must match the file's leading bytes. Unknown tale: 404
        `tale_not_found`; other or mismatched type: 415 `unsupported_media_type`;
        too large: 413 `media_too_large`; empty body: 400 `validation_failed`.
        Replacing media removes the previous file.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          image/gif:
            schema: { type: string, contentMediaType: image/gif }
          video/mp4:
            schema: { type: string, contentMediaType: video/mp4 }
          video/webm:
            schema: { type: string, contentMediaType: video/webm }
      responses:
        '200':
          description: The tale, with its new media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: taleart_session
      description: >-
        Server-side session started by a passkey sign-in (AD-9). Without a valid
        session every route except `/health` and `/auth/*` answers 401 `unauthenticated`.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Zone:
      type: object
      required: [id, name, projectId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: string
          format: uuid
    CreateZoneRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
          minLength: 1
        projectId:
          type: string
          format: uuid
    FrameType:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: Registry key stored on each frame as `type`.
        label:
          type: string
    Frame:
      type: object
      required: [id, zoneId, projectId, type, settings]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key from the registry.
        settings:
          type: object
          additionalProperties: true
          description: Settings valid against the frame type's JSON Schema.
    CreateFrameRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
        settings:
          type: object
          additionalProperties: true
    TaleGroup:
      type: object
      required: [id, zoneId, projectId, name, position, tales]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the zone; lists are sorted by it.
        tales:
          type: array
          maxItems: 100
          description: The group's tales, by position.
          items:
            $ref: '#/components/schemas/Tale'
    CreateTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Tale:
      type: object
      required: [id, taleGroupId, projectId, title, position, media]
      properties:
        id:
          type: string
          format: uuid
        taleGroupId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the tale group; lists are sorted by it.
        media:
          description: The tale's image, GIF or video, or null when it has none.
          oneOf:
            - $ref: '#/components/schemas/TaleMedia'
            - type: 'null'
    TaleMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          description: Where the Management API serves the file, such as `/api/v1/tales/{taleId}/media`.
    MediaKind:
      type: string
      enum: [image, video]
    MediaContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
        - video/mp4
        - video/webm
    CreateTaleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    OrderTaleGroupsRequest:
      type: object
      required: [taleGroupIds]
      properties:
        taleGroupIds:
          type: array
          description: Every tale group id of the zone, once each, in the new order.
          items:
            type: string
    OrderTalesRequest:
      type: object
      required: [taleIds]
      properties:
        taleIds:
          type: array
          description: Every tale id of the group, once each, in the new order.
          items:
            type: string
    UserRole:
      type: string
      enum: [admin, content_manager]
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    AuthState:
      type: object
      required: [setupRequired, user]
      properties:
        setupRequired:
          type: boolean
          description: True while no user exists; the dashboard then shows the setup screen.
        user:
          description: The signed-in user, or null without a valid session.
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    SetupRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    SignedIn:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    PasskeyCreationOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialCreationOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyRequestOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialRequestOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyResponse:
      type: object
      required: [id]
      additionalProperties: true
      description: >-
        The authenticator's answer as WebAuthn JSON (`RegistrationResponseJSON`
        or `AuthenticationResponseJSON`), sent as the browser produced it.
      properties:
        id:
          type: string
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - project_not_found
        - not_found
        - zone_not_found
        - unknown_frame_type
        - invalid_frame_settings
        - tale_group_not_found
        - tale_group_full
        - tale_not_found
        - order_mismatch
        - media_not_found
        - unsupported_media_type
        - media_too_large
        - unauthenticated
        - setup_closed
        - passkey_failed
        - internal_error
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
