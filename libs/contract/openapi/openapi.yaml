        required: true
        schema:
          type: string
    get:
      operationId: getProjectFontFile
      summary: Read a font's file with a session, whether a published tale uses it or not.
      description: >-
        What Tale Studio and the font list load. `font/woff2`, cached
        privately with an opaque ETag (304 when it matches). Unknown font, or a font of
