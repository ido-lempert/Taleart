    put:
      operationId: putTaleGroupCover
      summary: Set or replace a tale group's cover, still or animated.
      description: >-
        The body is the file's bytes and `Content-Type` its type, one of the
        tale media types. The dashboard makes the file in the browser (an
        image, a video frame, or a short clip); the server does not
        transcode (AD-11). The server decides from the bytes whether the
