openapi: 3.1.0
info:
  title: TaleArt Management API
  version: 1.0.0
  description: >-
    Source of truth for TaleArt request and response shapes (AD-3).
    A shape change starts here; regenerate the TypeScript types with
    `npm exec nx -- run contract:generate`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the API is up.
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /projects:
    get:
      operationId: listProjects
      summary: List projects, oldest first.
      responses:
        '200':
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones:
    get:
      operationId: listZones
      summary: List zones, oldest first.
      responses:
        '200':
          description: All zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZone
      summary: Create a zone in a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /frame-types:
    get:
      operationId: listFrameTypes
      summary: List the frame types in the registry (AD-5).
      responses:
        '200':
          description: Every registered frame type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrameType'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/frames:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneFrames
      summary: List a zone's frames, oldest first.
      responses:
        '200':
          description: The zone's frames.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Frame'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneFrame
      summary: Add a frame of a registered type to a zone.
      description: >-
        `settings` is validated against the JSON Schema of the frame type.
        A missing `settings` is treated as `{}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFrameRequest'
      responses:
        '201':
          description: The created frame.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneTaleGroups
      summary: List a zone's tale groups by position, each with its tales by position.
      responses:
        '200':
          description: The zone's tale groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaleGroup'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneTaleGroup
      summary: Create a tale group in a zone, after its existing groups.
      description: The tale group takes its project from the zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleGroupRequest'
      responses:
        '201':
          description: The created tale group, with no tales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createTale
      summary: Add a tale to a tale group, after its existing tales.
      description: >-
        The tale takes its project from the tale group. A tale group holds at
        most 100 tales; adding to a full group answers 409 `tale_group_full`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleRequest'
      responses:
        '201':
          description: The created tale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Zone:
      type: object
      required: [id, name, projectId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: string
          format: uuid
    CreateZoneRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
          minLength: 1
        projectId:
          type: string
          format: uuid
    FrameType:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: Registry key stored on each frame as `type`.
        label:
          type: string
    Frame:
      type: object
      required: [id, zoneId, projectId, type, settings]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key from the registry.
        settings:
          type: object
          additionalProperties: true
          description: Settings valid against the frame type's JSON Schema.
    CreateFrameRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
        settings:
          type: object
          additionalProperties: true
    TaleGroup:
      type: object
      required: [id, zoneId, projectId, name, position, tales]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the zone; lists are sorted by it.
        tales:
          type: array
          maxItems: 100
          description: The group's tales, by position.
          items:
            $ref: '#/components/schemas/Tale'
    CreateTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Tale:
      type: object
      required: [id, taleGroupId, projectId, title, position]
      properties:
        id:
          type: string
          format: uuid
        taleGroupId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the tale group; lists are sorted by it.
    CreateTaleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - project_not_found
        - not_found
        - zone_not_found
        - unknown_frame_type
        - invalid_frame_settings
        - tale_group_not_found
        - tale_group_full
        - internal_error
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
