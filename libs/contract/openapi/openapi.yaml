openapi: 3.1.0
info:
  title: TaleArt API
  version: 1.0.0
  description: >-
    Source of truth for TaleArt request and response shapes (AD-3): the
    Management API under `/api/v1` and the Delivery API under `/delivery/v1`.
    A shape change starts here; regenerate the TypeScript types with
    `npm exec nx -- run contract:generate`.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the API is up.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/state:
    get:
      operationId: getAuthState
      summary: Whether setup is still needed, and who is signed in.
      description: >-
        Works with or without a session. `user` is null when the request has
        no valid session.
      security: []
      responses:
        '200':
          description: The auth state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/options:
    post:
      operationId: startSetup
      summary: Start registering the first admin's passkey.
      description: >-
        Only while no user exists; afterwards 409 `setup_closed`. Answers WebAuthn
        creation options (user verification and a resident key required) and sets
        the http-only `taleart_challenge` cookie. The challenge is single-use and
        expires after 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/verify:
    post:
      operationId: finishSetup
      summary: Register the first admin's passkey and sign them in.
      description: >-
        Checks the authenticator response against the challenge found through
        the `taleart_challenge` cookie, creates the admin and their passkey, and
        sets the `taleart_session` cookie. Bad or expired challenge, or failed
        verification: 400 `passkey_failed`. A user already exists: 409 `setup_closed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: The admin, now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/options:
    post:
      operationId: startSignIn
      summary: Start signing in with a passkey.
      description: >-
        Answers WebAuthn request options without `allowCredentials` (the passkey
        is discoverable, so no email is needed) and sets the http-only
        `taleart_challenge` cookie. The challenge is single-use and expires after 5 minutes.
      security: []
      responses:
        '200':
          description: WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/verify:
    post:
      operationId: finishSignIn
      summary: Sign in with a stored passkey.
      description: >-
        Checks the authenticator response and the signature counter, then sets
        the `taleart_session` cookie (7 days). Unknown passkey, bad or expired
        challenge, or failed verification: 401 `passkey_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session.
      description: Deletes the session and clears the `taleart_session` cookie. Works without a session too.
      security: []
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitation
      summary: Read an invitation before joining.
      description: >-
        Works without a session. An unknown, used or expired invitation answers
        410 `invitation_invalid`.
      security: []
      responses:
        '200':
          description: The project the invitation is for, and when it expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}/options:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: startInvitation
      summary: Start registering an invitee's passkey.
      description: >-
        Answers WebAuthn creation options and sets the http-only
        `taleart_challenge` cookie (single-use, 5 minutes). Unknown, used or
        expired invitation: 410 `invitation_invalid`. An email that already
        belongs to a user: 409 `email_taken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '200':
          description: WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}/verify:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: finishInvitation
      summary: Register the invitee's passkey, use the invitation and sign them in.
      description: >-
        Creates the user as a `content_manager`, their passkey and their
        membership of the invitation's project, marks the invitation used and
        sets the `taleart_session` cookie, all in one transaction. Bad or
        expired challenge, or failed verification: 400 `passkey_failed`. The
        invitation was used meanwhile or expired: 410 `invitation_invalid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: The new content manager, now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      summary: List the projects the caller can access, oldest first.
      description: Admins see every project; content managers see the projects they are members of.
      responses:
        '200':
          description: The accessible projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      summary: Create a project (admins only).
      description: A content manager gets 403 `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/invitations:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createInvitation
      summary: Invite someone to a project (admins only).
      description: >-
        Creates a one-time invitation, valid for 7 days. The invitee opens `url`,
        registers a passkey and becomes a content manager of the project. The
        token in `url` is shown only in this response; only its SHA-256 hash is
        stored. A content manager gets 403 `forbidden`; an unknown project 404
        `project_not_found`.
      responses:
        '201':
          description: The invitation, with its one-time link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/tale-groups:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectTaleGroups
      summary: List every tale group of a project by name, with its tale count and zones.
      description: >-
        Tale groups belong to the project (AD-14); a group placed in no zone is
        listed with an empty `zoneIds`. Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's tale groups, by name ignoring case.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTaleGroup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/tags:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTags
      summary: List a project's tags by name.
      description: Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's tags, by name ignoring case.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTag
      summary: Create a tag in a project.
      description: >-
        The name is trimmed and holds 1 to 40 characters (400
        `validation_failed` otherwise). Names are unique per project ignoring
        case; a taken name answers 409 `tag_exists`. Unknown project 404
        `project_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: The created tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports/storyly/apps:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: findStorylyApps
      summary: List the Storyly apps a Storyly API token can read (admins only).
      description: >-
        Calls the Storyly External API with the token and answers its apps. The
        token is not stored and no job is created. A token Storyly refuses
        answers 400 `storyly_token_invalid`; Storyly unreachable or answering an
        unexpected shape 502 `storyly_unavailable`. Without `IMPORT_TOKEN_KEY`
        the importer answers 503 `importer_not_configured`. A content manager
        gets 403 `forbidden`; an unknown project 404 `project_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindStorylyAppsRequest'
      responses:
        '200':
          description: The token's apps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorylyApp'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listImports
      summary: List the project's imports, newest first (admins only).
      description: >-
        The project's import jobs, newest first, at most 50, with their state,
        times and failure reason; the report is read per job. A content manager
        gets 403 `forbidden`; an unknown project 404 `project_not_found`;
        without `IMPORT_TOKEN_KEY` 503 `importer_not_configured`.
      responses:
        '200':
          description: The project's imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJobSummary'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startImport
      summary: Start importing a Storyly app into the project (admins only).
      description: >-
        Stores a queued import job and answers at once (AD-8); a background
        worker runs it. The token is stored encrypted with the job only until
        the job ends. A content manager gets 403 `forbidden`; an unknown project
        404 `project_not_found`; without `IMPORT_TOKEN_KEY` 503
        `importer_not_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImportRequest'
      responses:
        '202':
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStarted'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports/{importId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: importId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getImport
      summary: Read an import job, its state, progress and report (admins only).
      description: >-
        Poll it while the job is queued or running to follow its progress. A job of another project, or none, answers 404 `not_found`. A content
        manager gets 403 `forbidden`; without `IMPORT_TOKEN_KEY` 503
        `importer_not_configured`.
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones:
    get:
      operationId: listZones
      summary: List the zones of the projects the caller can access, oldest first.
      responses:
        '200':
          description: The accessible zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZone
      summary: Create a zone in a project.
      description: A project the caller cannot access answers 403 `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /frame-types:
    get:
      operationId: listFrameTypes
      summary: List the frame types in the registry (AD-5).
      responses:
        '200':
          description: Every registered frame type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrameType'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/frames:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneFrames
      summary: List a zone's frames, oldest first.
      responses:
        '200':
          description: The zone's frames.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Frame'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneFrame
      summary: Add a frame of a registered type to a zone.
      description: >-
        `settings` is validated against the JSON Schema of the frame type.
        A missing `settings` is treated as `{}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFrameRequest'
      responses:
        '201':
          description: The created frame.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/frames/{frameId}:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      - name: frameId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateZoneFrame
      summary: Replace a frame's settings.
      description: >-
        `settings` replaces the frame's settings and is validated against the
        JSON Schema of the frame's type (AD-5): an invalid value answers 400
        `invalid_frame_settings` naming the field, and nothing is stored. A
        missing `settings` answers 400 `validation_failed`. Unknown zone: 404
        `zone_not_found`; a frame that is not in the zone: 404 `frame_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFrameRequest'
      responses:
        '200':
          description: The frame with its new settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/key:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getZoneKey
      summary: Whether the zone has an active key, with its prefix and issue date.
      description: >-
        Answers `null` when the zone has no active key. Never returns the key
        or its hash. Anyone who can access the zone's project may read it.
      responses:
        '200':
          description: The active key's info, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ZoneKeyInfo'
                  - type: 'null'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: issueZoneKey
      summary: Issue a zone key, or rotate it (admins only).
      description: >-
        Creates a new key for the zone. When the zone already has an active key,
        that key is revoked in the same transaction (rotation). `key` appears
        only in this response; only its SHA-256 hash is stored. A content
        manager gets 403 `forbidden`; an unknown zone 404 `zone_not_found`.
      responses:
        '201':
          description: The new key, shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedZoneKey'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeZoneKey
      summary: Revoke the zone's active key (admins only).
      description: >-
        The key stops working on the Delivery API at once. A zone without an
        active key answers 404 `zone_key_not_found`.
      responses:
        '204':
          description: The key is revoked.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zone:
    servers:
      - url: /delivery/v1
        description: Delivery API (AD-2), for SDKs. Accepts zone keys only.
    get:
      operationId: getDeliveryZone
      summary: The zone of the zone key, with its frames and tale groups (Delivery API).
      description: >-
        Served under `/delivery/v1`. Accepts only a zone key in
        `Authorization: Bearer <key>`, never a session. A missing, unknown or
        revoked key answers 401 `invalid_zone_key`. CORS is open to any origin,
        without credentials. Tale groups and their tales come in dashboard
        order; only `live` groups and tales whose start and end times, and
        their group's, contain the current time are listed (AD-6); each
        tale's media URL is absolute and public (AD-11).
      security:
        - zoneKey: []
      responses:
        '200':
          description: The zone, its frames oldest first, and its tale groups by position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /media/{key}:
    servers:
      - url: /
        description: Public media (AD-11). No session and no zone key.
    parameters:
      - name: key
        in: path
        required: true
        description: >-
          The storage key of a published tale's media, such as
          `tales/<uuid>.png`. It contains a slash, sent as is.
        schema:
          type: string
        allowReserved: true
    get:
      operationId: getPublicMedia
      summary: Read a published tale's media file, with no credentials.
      description: >-
        Serves only keys that a published tale (a `live` tale of a `live`
        group, each inside its start and end time, AD-6) currently
        references; any other key, including the key of replaced media or of
        draft, paused, archived, scheduled or expired content, answers
        404 `media_not_found` (AD-11). The response carries the stored
        `Content-Type`, supports one byte range (206, or 416 when
        unsatisfiable) and is open to any origin. It is cached as `public,
        no-cache` with the key as ETag, so a client revalidates (304 while
        published) and sees the 404 as soon as the content is unpublished.
      security: []
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
        '206':
          description: The requested byte range of the media file.
        '304':
          description: The client's copy, named by `If-None-Match`, is still current.
        '404':
          $ref: '#/components/responses/Error'
        '416':
          description: The requested range lies outside the file.
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneTaleGroups
      summary: List the tale groups placed in a zone by position, each with its tales by position.
      responses:
        '200':
          description: The zone's tale groups, each with its position in this zone.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneTaleGroup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneTaleGroup
      summary: Create a tale group and place it in a zone, after the zone's existing groups.
      description: >-
        The tale group belongs to the zone's project and gets one placement, at
        the end of this zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleGroupRequest'
      responses:
        '201':
          description: The created tale group, with no tales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups/order:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderZoneTaleGroups
      summary: Set the order of the tale groups placed in a zone.
      description: >-
        The list names every tale group placed in the zone exactly once;
        positions in this zone are rewritten to 0..n-1 in that order, and other
        zones keep their own order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown zone: 404 `zone_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTaleGroupsRequest'
      responses:
        '200':
          description: The zone's tale groups in the new order, each with its tales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups/{taleGroupId}:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: placeZoneTaleGroup
      summary: Place an existing tale group of the zone's project in the zone, after its groups.
      description: >-
        The group keeps its tales, tags and media; edits show in every zone it
        is placed in (AD-14). A group already placed here answers 200
        unchanged. A group that does not exist or belongs to another project
        answers 400 `tale_group_not_found`. Unknown zone: 404 `zone_not_found`.
      responses:
        '200':
          description: The group was already placed here; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '201':
          description: The placed tale group, with its position in this zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeZoneTaleGroup
      summary: Remove a tale group from a zone.
      description: >-
        Deletes only this placement: the group, its tales and its other
        placements stay. The zone's remaining positions become 0..n-1. A group
        not placed here answers 404 `tale_group_not_found`; an unknown zone 404
        `zone_not_found`.
      responses:
        '204':
          description: The group is no longer placed in the zone.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: renameTaleGroup
      summary: Rename a tale group.
      description: >-
        The name is trimmed and must not be blank (400 `validation_failed`).
        The group is the same in every zone it is placed in, so every zone
        shows the new name (AD-14). Unknown tale group: 404
        `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTaleGroupRequest'
      responses:
        '200':
          description: The renamed tale group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/copy:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: copyTaleGroup
      summary: Copy a tale group into a zone, as an independent group.
      description: >-
        Creates a new tale group in the target zone's project, with the same
        name, placed after the zone's groups (AD-14). Its tales are new rows
        with the same titles, positions and media; media files are not
        duplicated, the copy shares their storage keys (AD-11). For each of
        the source's tags, a tag of the target project with the same name,
        ignoring case, is reused, else created. Copy and source are
        independent afterwards. The caller needs access to the source group's
        project and to the target zone's project (403 `forbidden`). Unknown
        tale group: 404 `tale_group_not_found`; missing `zoneId`: 400
        `validation_failed`; unknown zone: 404 `zone_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTaleGroupRequest'
      responses:
        '201':
          description: The copy, as placed in the target zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/status:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupStatus
      summary: Publish, pause, archive or restore a tale group.
      description: >-
        Sets the group's stored status key (AD-6). Allowed: `live` from
        `draft` or `paused` (publish); `paused` from `live` (pause) or from
        `archived` (restore); `archived` from `draft`, `live` or `paused`
        (archive). Setting the current status again changes nothing. Any
        other change: 409 `invalid_status_transition`. A status other than
        `live`, `paused` or `archived`: 400 `validation_failed`. Unknown tale
        group: 404 `tale_group_not_found`. Only `live` groups reach the
        Delivery API; the `live` tales of a `paused` group read
        `blocked-by-group`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
      responses:
        '200':
          description: The tale group with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/schedule:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupSchedule
      summary: Set the start and end time of a tale group.
      description: >-
        Sets or clears the start and end time (AD-6). Live content is
        delivered only while the current time is at or after `startsAt` and
        before `endsAt`; before it, it reads `scheduled`, after it `expired`;
        nothing stores those keys. A bound that is not an ISO 8601 date-time
        with a time zone, a missing field, or an `endsAt` not later than
        `startsAt`: 400 `validation_failed`, nothing changes. Unknown
        tale group: 404 `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScheduleRequest'
      responses:
        '200':
          description: The tale group with its new window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createTale
      summary: Add a tale to a tale group, after its existing tales.
      description: >-
        The tale takes its project from the tale group. A tale group holds at
        most 100 tales; adding to a full group answers 409 `tale_group_full`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleRequest'
      responses:
        '201':
          description: The created tale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales/order:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderTales
      summary: Set the order of a tale group's tales.
      description: >-
        The list names every tale of the group exactly once; positions are
        rewritten to 0..n-1 in that order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown tale group: 404
        `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTalesRequest'
      responses:
        '200':
          description: The group's tales in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tags:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupTags
      summary: Replace the tags of a tale group.
      description: >-
        The list becomes the group's full set of tags; an empty list clears
        them, and repeated ids count once. Every id must name a tag of the
        group's own project; otherwise nothing changes and the answer is 400
        `tag_not_found`. Unknown tale group: 404 `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaleGroupTagsRequest'
      responses:
        '200':
          description: The tale group with its new tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/status:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleStatus
      summary: Publish, pause, archive or restore a tale.
      description: >-
        Sets the tale's stored status key (AD-6), with the same allowed
        changes as a tale group's: 409 `invalid_status_transition` for any
        other, 400 `validation_failed` for a status other than `live`,
        `paused` or `archived`. Unknown tale: 404 `tale_not_found`. Only
        `live` tales of `live` groups reach the Delivery API, and only their
        media is public (AD-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
      responses:
        '200':
          description: The tale with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/schedule:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleSchedule
      summary: Set the start and end time of a tale.
      description: >-
        Sets or clears the start and end time (AD-6). Live content is
        delivered only while the current time is at or after `startsAt` and
        before `endsAt`; before it, it reads `scheduled`, after it `expired`;
        nothing stores those keys. A bound that is not an ISO 8601 date-time
        with a time zone, a missing field, or an `endsAt` not later than
        `startsAt`: 400 `validation_failed`, nothing changes. Unknown
        tale: 404 `tale_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScheduleRequest'
      responses:
        '200':
          description: The tale with its new window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/media:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleMedia
      summary: Read a tale's media file.
      description: The stored bytes, with the `Content-Type` they were uploaded with.
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putTaleMedia
      summary: Upload or replace a tale's image, GIF or video.
      description: >-
        The body is the file's bytes and `Content-Type` its type. Images
        (`image/jpeg`, `image/png`, `image/webp`, `image/gif`) may be up to
        10 MB and videos (`video/mp4`, `video/webm`) up to 100 MB. The declared
        type must match the file's leading bytes. Unknown tale: 404
        `tale_not_found`; other or mismatched type: 415 `unsupported_media_type`;
        too large: 413 `media_too_large`; empty body: 400 `validation_failed`.
        Replacing media removes the previous file.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          image/gif:
            schema: { type: string, contentMediaType: image/gif }
          video/mp4:
            schema: { type: string, contentMediaType: video/mp4 }
          video/webm:
            schema: { type: string, contentMediaType: video/webm }
      responses:
        '200':
          description: The tale, with its new media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: taleart_session
      description: >-
        Server-side session started by a passkey sign-in (AD-9). Without a valid
        session every route except `/health` and `/auth/*` answers 401 `unauthenticated`.
        A signed-in user who cannot access the project of a resource gets 403
        `forbidden`; a resource that does not exist still answers 404.
    zoneKey:
      type: http
      scheme: bearer
      description: >-
        A zone key (`tak_...`) issued in the dashboard (AD-9), sent as
        `Authorization: Bearer <key>`. Only the Delivery API accepts it.
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      description: The one-time token from the invitation link.
      schema:
        type: string
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Zone:
      type: object
      required: [id, name, projectId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: string
          format: uuid
    CreateZoneRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
          minLength: 1
        projectId:
          type: string
          format: uuid
    FrameType:
      type: object
      required: [key, label, schema]
      properties:
        key:
          type: string
          description: Registry key stored on each frame as `type`.
        label:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: >-
            The JSON Schema (draft 2020-12) of the type's `settings`, from
            `libs/contract/frame-types/`. Each field's `title`, `description`
            and `default` drive the dashboard's settings form.
    Frame:
      type: object
      required: [id, zoneId, projectId, type, settings]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key from the registry.
        settings:
          type: object
          additionalProperties: true
          description: Settings valid against the frame type's JSON Schema.
    CreateFrameRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
        settings:
          type: object
          additionalProperties: true
    UpdateFrameRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: The frame's new settings, valid against its type's JSON Schema.
    TaleGroup:
      type: object
      description: >-
        A tale group belongs to its project (AD-14). Zones place it, each in
        its own order; its tales, tags and media are the same in every zone.
      required: [id, projectId, name, status, storedStatus, startsAt, endsAt, zoneIds, tales, tags]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The group's status as read (AD-6): `scheduled` or `expired` when
            `storedStatus` is `live` and the current time is before
            `startsAt` or at or after `endsAt`, else `storedStatus`.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The status key a person set (AD-6): `draft` for a new group, then
            `live`, `paused` or `archived`.
        startsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Start of the window, ISO 8601 UTC, or null for no start. Before it,
            live content reads `scheduled` and is not delivered (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            End of the window, ISO 8601 UTC, or null for no end; later than
            `startsAt`. From it on, live content reads `expired` and is not
            delivered (AD-6).
        zoneIds:
          type: array
          description: Every zone the group is placed in, in the order it was placed; empty when none.
          items:
            type: string
            format: uuid
        tales:
          type: array
          maxItems: 100
          description: The group's tales, by position.
          items:
            $ref: '#/components/schemas/Tale'
        tags:
          type: array
          description: The group's tags, by name ignoring case.
          items:
            $ref: '#/components/schemas/TaleGroupTag'
    ZoneTaleGroup:
      description: A tale group as a zone lists it, with its position in that zone.
      allOf:
        - $ref: '#/components/schemas/TaleGroup'
        - type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 0
              description: Order within this zone; the zone's lists are sorted by it.
    ProjectTaleGroup:
      type: object
      description: A tale group as the project's list shows it.
      required: [id, projectId, name, status, storedStatus, startsAt, endsAt, taleCount, zoneIds]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The group's status as read (AD-6), as on `TaleGroup`.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: The status key a person set (AD-6).
        startsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Start of the window, ISO 8601 UTC, or null for no start. Before it,
            live content reads `scheduled` and is not delivered (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            End of the window, ISO 8601 UTC, or null for no end; later than
            `startsAt`. From it on, live content reads `expired` and is not
            delivered (AD-6).
        taleCount:
          type: integer
          minimum: 0
          maximum: 100
        zoneIds:
          type: array
          description: Every zone the group is placed in, in the order it was placed; empty when none.
          items:
            type: string
            format: uuid
    Tag:
      type: object
      required: [id, projectId, name]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
    TaleGroupTag:
      type: object
      required: [id, name]
      description: A tag as a tale group carries it.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Trimmed before it is checked and stored; unique in the project ignoring case.
    SetTaleGroupTagsRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          description: The ids of the group's new tags, all of the group's project. Repeats count once.
          items:
            type: string
    CreateTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    RenameTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed before it is checked and stored.
    CopyTaleGroupRequest:
      type: object
      required: [zoneId]
      properties:
        zoneId:
          type: string
          description: The zone to place the copy in; its project may differ from the source's.
    Tale:
      type: object
      required: [id, taleGroupId, projectId, title, position, status, storedStatus, startsAt, endsAt, media]
      properties:
        id:
          type: string
          format: uuid
        taleGroupId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the tale group; lists are sorted by it.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The tale's status as read (AD-6): `storedStatus` unless it is
            `live`; then `blocked-by-group` when its group is `paused`, else
            `scheduled` before `startsAt`, `expired` at or after `endsAt`, else
            `live`. The group's window does not change the tale's status, but
            the Delivery API needs both windows to contain the current time.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The status key a person set: `draft` for a new tale, then `live`,
            `paused` or `archived`.
        startsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Start of the window, ISO 8601 UTC, or null for no start. Before it,
            live content reads `scheduled` and is not delivered (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            End of the window, ISO 8601 UTC, or null for no end; later than
            `startsAt`. From it on, live content reads `expired` and is not
            delivered (AD-6).
        media:
          description: The tale's image, GIF or video, or null when it has none.
          oneOf:
            - $ref: '#/components/schemas/TaleMedia'
            - type: 'null'
    TaleMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          description: Where the Management API serves the file, such as `/api/v1/tales/{taleId}/media`.
    ContentStatus:
      type: string
      description: >-
        A status key of the AD-6 scheme. Each key has one HTTP code, defined
        in `libs/contract` (`CONTENT_STATUS_HTTP_CODES`): draft 204, live 200,
        scheduled 202, processing 102, invalid-media 422, paused 403,
        blocked-by-group 423, expired 410, quota-reached 429, archived 404.
        `scheduled`, `expired` and `blocked-by-group` are computed when
        content is read and never stored.
      enum:
        - draft
        - live
        - scheduled
        - processing
        - invalid-media
        - paused
        - blocked-by-group
        - expired
        - quota-reached
        - archived
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [live, paused, archived]
          description: >-
            `live` publishes, `paused` pauses (or restores an archived item),
            `archived` archives.
    SetScheduleRequest:
      type: object
      required: [startsAt, endsAt]
      description: >-
        The window in which live content is delivered (AD-6). Each bound is an
        ISO 8601 date-time with `Z` or an offset, stored and returned in UTC,
        or null for an open bound. `endsAt` must be later than `startsAt`
        when both are set.
      properties:
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
    MediaKind:
      type: string
      enum: [image, video]
    MediaContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
        - video/mp4
        - video/webm
    CreateTaleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    OrderTaleGroupsRequest:
      type: object
      required: [taleGroupIds]
      properties:
        taleGroupIds:
          type: array
          description: Every tale group id placed in the zone, once each, in the new order.
          items:
            type: string
    OrderTalesRequest:
      type: object
      required: [taleIds]
      properties:
        taleIds:
          type: array
          description: Every tale id of the group, once each, in the new order.
          items:
            type: string
    ZoneKeyInfo:
      type: object
      required: [prefix, createdAt]
      properties:
        prefix:
          type: string
          description: The start of the key, `tak_` and the next 6 characters, to recognise it.
        createdAt:
          type: string
          format: date-time
    IssuedZoneKey:
      type: object
      required: [key, prefix, createdAt]
      properties:
        key:
          type: string
          description: The secret zone key, `tak_` and 32 random bytes in base64url. Shown only once.
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
    DeliveryFrame:
      type: object
      required: [id, type, settings]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key; clients skip types they don't know (AD-5).
        settings:
          type: object
          additionalProperties: true
          description: >-
            The frame's settings, with every field the stored settings leave
            out filled with its default from the type's JSON Schema.
    DeliveryZone:
      type: object
      required: [id, name, frames, taleGroups]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        frames:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryFrame'
        taleGroups:
          type: array
          description: >-
            The published tale groups placed in the zone, in this zone's order
            (AD-2, AD-14); every frame shows all of them.
          items:
            $ref: '#/components/schemas/DeliveryTaleGroup'
    DeliveryTaleGroup:
      type: object
      required: [id, name, tales]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tales:
          type: array
          description: The group's published tales by position.
          items:
            $ref: '#/components/schemas/DeliveryTale'
    DeliveryTale:
      type: object
      required: [id, title, media]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        media:
          description: The tale's image, GIF or video, or null when it has none.
          oneOf:
            - $ref: '#/components/schemas/DeliveryMedia'
            - type: 'null'
    DeliveryMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          format: uri
          description: >-
            Absolute, public and unguessable URL of the file, such as
            `https://api.example.com/media/tales/<uuid>.png`. Needs no key (AD-11).
    UserRole:
      type: string
      enum: [admin, content_manager]
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    AuthState:
      type: object
      required: [setupRequired, user]
      properties:
        setupRequired:
          type: boolean
          description: True while no user exists; the dashboard then shows the setup screen.
        user:
          description: The signed-in user, or null without a valid session.
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    SetupRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    RedeemInvitationRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    Invitation:
      type: object
      required: [id, projectId, url, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        url:
          type: string
          description: The one-time link to share, `<dashboard origin>/invite/<token>`. Shown only once.
        expiresAt:
          type: string
          format: date-time
    InvitationPreview:
      type: object
      required: [projectName, expiresAt]
      properties:
        projectName:
          type: string
        expiresAt:
          type: string
          format: date-time
    SignedIn:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    PasskeyCreationOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialCreationOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyRequestOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialRequestOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyResponse:
      type: object
      required: [id]
      additionalProperties: true
      description: >-
        The authenticator's answer as WebAuthn JSON (`RegistrationResponseJSON`
        or `AuthenticationResponseJSON`), sent as the browser produced it.
      properties:
        id:
          type: string
    FindStorylyAppsRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: A Storyly API token. Used for this call only; never stored.
    StorylyApp:
      type: object
      required: [id, name]
      description: An app of the Storyly account, as the import source.
      properties:
        id:
          type: string
        name:
          type: string
    StartImportRequest:
      type: object
      required: [token, appId]
      properties:
        token:
          type: string
          minLength: 1
          description: The Storyly API token; stored encrypted only while the job is queued or running.
        appId:
          type: string
          minLength: 1
          description: The id of the Storyly app to import, from the apps list.
    ImportStatus:
      type: string
      enum: [queued, running, done, failed]
    ImportStarted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
    ImportCount:
      type: object
      required: [source, imported, skipped]
      description: How many records the source had, how many are in TaleArt now, and how many were skipped.
      properties:
        source:
          type: integer
        imported:
          type: integer
        skipped:
          type: integer
    ImportReport:
      type: object
      required: [zones, notes]
      properties:
        zones:
          $ref: '#/components/schemas/ImportCount'
        taleGroups:
          $ref: '#/components/schemas/ImportCount'
          description: Story groups as tale groups. Absent in reports of imports made before tale groups were imported.
        tales:
          $ref: '#/components/schemas/ImportCount'
          description: Stories as tales. Absent in reports of imports made before tales were imported.
        notes:
          type: array
          description: What did not come across, such as "frame type unknown" for each zone or a skipped tale.
          items:
            type: string
        differences:
          type: array
          description: >-
            Each difference between a source record and the shape the import expects, or a field TaleArt
            does not hold, in reading order, once per record. Holds field names, never field values. Absent
            in reports of imports made before records were checked.
          items:
            $ref: '#/components/schemas/ImportDifference'
        differencesOmitted:
          type: integer
          minimum: 0
          description: How many more differences were found than the report stores.
        notImportedByDesign:
          type: array
          description: What the import never brings across, listed once, such as conversion records and stats.
          items:
            type: string
    ImportDifferenceEntity:
      type: string
      enum: [app, zone, taleGroup, tale]
      description: What the source record becomes in TaleArt (the app is the project).
    ImportDifferenceKind:
      type: string
      enum: [missing, renamed, unexpected, wrongType, notHeld, invalidRecord]
      description: >-
        missing: a field the import needs is absent; renamed: an expected field came under another name;
        unexpected: a field the import does not know; wrongType: a needed field is empty or of the wrong
        type; notHeld: a field with a value TaleArt does not hold; invalidRecord: the record could not be
        read and was skipped.
    ImportDifferenceRecord:
      type: object
      required: [sourceId, name, within, position]
      description: The source record a difference belongs to.
      properties:
        sourceId:
          type: [string, 'null']
          description: The record's id at the source; null when it has none.
        name:
          type: [string, 'null']
          description: The record's title at the source, if it has one.
        within:
          type: [string, 'null']
          description: The title of the record it belongs to, such as a story's group; null for top-level records.
        position:
          type: integer
          minimum: 1
          description: The record's place in its source list, from 1.
    ImportDifference:
      type: object
      required: [entity, record, kind, field, sourceField]
      properties:
        entity:
          $ref: '#/components/schemas/ImportDifferenceEntity'
        record:
          $ref: '#/components/schemas/ImportDifferenceRecord'
        kind:
          $ref: '#/components/schemas/ImportDifferenceKind'
        field:
          type: [string, 'null']
          description: The field name the import expects (or the unexpected one); null for an invalid record.
        sourceField:
          type: [string, 'null']
          description: For a rename, the name the source used; null otherwise.
    ImportProgressCount:
      type: object
      required: [read, written]
      description: Records read from the source so far, and records in TaleArt so far (already linked ones included).
      properties:
        read:
          type: integer
        written:
          type: integer
    ImportProgress:
      type: object
      required: [zones, taleGroups, tales]
      description: How far a job got, per entity type; updated while it runs.
      properties:
        zones:
          $ref: '#/components/schemas/ImportProgressCount'
        taleGroups:
          $ref: '#/components/schemas/ImportProgressCount'
        tales:
          $ref: '#/components/schemas/ImportProgressCount'
    ImportJobSummary:
      type: object
      required: [id, status, sourceAppName, error, createdAt, startedAt, finishedAt]
      description: An import job in the project's list of imports, without its report.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        sourceAppName:
          type: [string, 'null']
          description: The source app's name, once the worker has read it.
        error:
          type: [string, 'null']
          description: Why the job failed; null unless the status is failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When a worker last started the job; null while it waits in the queue.
        finishedAt:
          type: [string, 'null']
          format: date-time
    ImportJob:
      type: object
      required: [id, status, sourceAppName, report, progress, error, createdAt, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        sourceAppName:
          type: [string, 'null']
          description: The source app's name, once the worker has read it.
        report:
          oneOf:
            - $ref: '#/components/schemas/ImportReport'
            - type: 'null'
        progress:
          description: How far the job got; null until a worker has started it.
          oneOf:
            - $ref: '#/components/schemas/ImportProgress'
            - type: 'null'
        error:
          type: [string, 'null']
          description: Why the job failed; null unless the status is failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When a worker last started the job; null while it waits in the queue.
        finishedAt:
          type: [string, 'null']
          format: date-time
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - project_not_found
        - not_found
        - zone_not_found
        - unknown_frame_type
        - invalid_frame_settings
        - frame_not_found
        - tale_group_not_found
        - tale_group_full
        - tale_not_found
        - order_mismatch
        - media_not_found
        - unsupported_media_type
        - media_too_large
        - unauthenticated
        - setup_closed
        - passkey_failed
        - forbidden
        - invitation_invalid
        - email_taken
        - tag_exists
        - tag_not_found
        - zone_key_not_found
        - invalid_zone_key
        - storyly_token_invalid
        - storyly_unavailable
        - importer_not_configured
        - invalid_status_transition
        - internal_error
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
