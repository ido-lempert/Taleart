  /zones/{zoneId}/frame:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: setZoneFrame
      summary: Give a zone its display, a frame of a registered type.
      description: >-
        A zone has at most one frame, its display (AD-5, AD-17). `settings` is
        validated against the JSON Schema of the frame type (400
        `invalid_frame_settings`); a missing `settings` is the type's defaults.
        An unknown type answers 400 `unknown_frame_type`. A zone that already
        has a display answers 409 `display_exists`; change it with PATCH.
        Unknown zone: 404 `zone_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFrameRequest'
      responses:
        '201':
          description: The zone's display.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateZoneFrame
      summary: Change the type or the settings of a zone's display.
      description: >-
        A new `type` changes the display's frame type and resets its settings
        to that type's defaults, unless `settings` is given too. `settings`
        replaces the settings and is validated against the JSON Schema of the
        display's (new) type (AD-5): an invalid value answers 400
        `invalid_frame_settings` naming the field, and nothing is stored. A
        body with neither answers 400 `validation_failed`. The display keeps
        its id, so events keep their `frame_id` (AD-10). Unknown zone: 404
        `zone_not_found`; a zone without a display: 404 `display_not_found`.
        When another change switches the display's type meanwhile, the change
        is checked again against the new type once, then refused with 409
        `concurrent_change`; nothing is stored and it can be tried again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFrameRequest'
      responses:
        '200':
          description: The display as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zone:
    servers:
      - url: /delivery/v1
        description: Delivery API (AD-2), for SDKs. Accepts site keys only.
    get:
      operationId: getDeliveryZone
      summary: A zone, named by site key and slug, with its display and tale groups (Delivery API).
      description: >-
        Served under `/delivery/v1`. Accepts only the project's site key
        (`tas_...`) in `Authorization: Bearer <key>`, never a session, and
        answers the project's zone whose slug the `zone` query parameter
        names (epic UX rework R3). Every refusal (a missing, unknown or
        revoked site key, any other key, a missing slug, or a slug no zone of
        the key's project has) answers the same 401 `invalid_site_key` body,
        so a caller cannot tell an unknown slug from a refused key. A 401 is sent with
        `Cache-Control: no-store`. Every Delivery API request counts against
        a per-address token bucket (by default 600 at once, 20 per second);
        over it the API answers 429 `rate_limited` with `Retry-After`.
        CORS is open to any origin,
        without credentials. Tale groups and their tales come in dashboard
        order; only `live` groups and tales whose start and end times, and
        their group's, contain the current time are listed (AD-6); each
        tale's media URL is absolute and public (AD-11). The zone is cached
        as `private, no-cache`, varies by `Authorization` and carries an
        ETag, so a browser revalidates it on every load (304 while
        unchanged) and sees a change at once (NFR-006).
      security:
        - siteKey: []
      parameters:
        - name: zone
          in: query
          required: true
          description: >-
            The zone's slug (lowercase letters, digits and hyphens), sent with
            the project's site key, as a host page names it in `zone="..."`.
          schema:
            type: string
      responses:
        '200':
          description: The zone, its display, and its tale groups by position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '304':
          description: The client's copy, named by `If-None-Match`, is still current.
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /media/{key}:
    servers:
      - url: /
        description: Public media (AD-11). No session and no site key.
    parameters:
      - name: key
        in: path
        required: true
        description: >-
          The storage key of a published tale's media, a published tale
          group's cover or a project font a published tale uses, such as
          `tales/<uuid>.png`, `covers/<uuid>.webm` or `fonts/<uuid>.woff2`.
          It contains a slash, sent as is.
        schema:
          type: string
        allowReserved: true
    get:
      operationId: getPublicMedia
      summary: Read a published tale's media file, with no credentials.
      description: >-
        Serves only keys that a published tale (a `live` tale of a `live`
        group, each inside its start and end time, AD-6) currently
        references; any other key, including the key of replaced media or of
        draft, paused, archived, scheduled or expired content, answers
        404 `media_not_found` (AD-11). A tale group's cover is served while
        the group is delivered: `live`, inside its window, with at least one
        published tale. A project font (`fonts/<uuid>.woff2`, epic Tale
        Studio R18) is served as `font/woff2` while a published tale of a
        delivered group (`live`, in its window, placed in a zone) has a
        published document with a visible text that uses it; any other
        font key answers 404. The response carries the stored
        `Content-Type`, supports one byte range (206, or 416 when
        unsatisfiable) and is open to any origin. It is cached as `public,
        no-cache` with the key as ETag, so a client revalidates (304 while
        published) and sees the 404 as soon as the content is unpublished.
      security: []
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
            font/woff2:
              schema: { type: string, contentMediaType: font/woff2 }
        '206':
          description: The requested byte range of the media file.
        '304':
          description: The client's copy, named by `If-None-Match`, is still current.
        '404':
          $ref: '#/components/responses/Error'
        '416':
          description: The requested range lies outside the file.
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups:
