              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/user-lists/{userListId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: userListId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: renameUserList
      summary: Rename a user list.
      description: >-
        Same name rules as creating one. A list of another project, or none,
        404 `user_list_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameUserListRequest'
      responses:
        '200':
          description: The renamed list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUserList
      summary: Delete a user list and every ID it holds, for good.
      description: >-
        A hard delete in one transaction: the list and all its hashes go, with
        no soft delete (epic targeting R5). When it was the project's last
        list, the project's hashing secret goes too, so the next list gets a
        new one. Admins and content managers delete. 404
        `user_list_not_found` for a list of another project, or none.
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/user-lists/{userListId}/ids:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: userListId
        in: path
        required: true
        schema:
          type: string
      - name: header
        in: query
        required: false
        description: '`true` when the first row is a header, which is skipped; any other value reads every row.'
        schema:
          type: string
    post:
      operationId: addUserListIds
      summary: Add the external user IDs of a single-column CSV to a user list.
      description: >-
        The body is the CSV, UTF-8 (a byte order mark is skipped), one ID per
        row, read as a stream and not kept. Each non-empty row, trimmed (and
        unquoted when it is a quoted field), is one ID of at most 256
        ASCII characters with no control characters; matching is exact
        (case-sensitive, no Unicode normalization). Each ID is stored only as HMAC-SHA-256 under the
        project's secret (epic targeting R5); no ID is ever returned, logged
        or kept. Rows already in the list, or earlier in the file, count as
        already present; refused rows are counted and the first 10 named by
        line number and reason. The upload is all or nothing. Admins and
        content managers upload. An upload that sends no byte for 30 s, or
        takes more than 280 s in all (a 50 MB file needs about 190 KB/s), is
        ended with nothing added (408 `validation_failed`, often on a closed
        connection). Checked before the body is read (with
        `Connection: close`): too many uploads at once 429 `upload_busy`;
        unknown project 404 `project_not_found`; unknown list 404
        `user_list_not_found`; a type other than `text/csv` or `text/plain`
        415 `unsupported_media_type`; a compressed body 415; no valid
        `Content-Length` 411 `length_required`; empty 400
        `validation_failed`; over 50 MB 413 `user_list_file_too_large`. While
        it streams: over 1,000,000 rows 413 `user_list_file_too_large`, not
        UTF-8 or a body other than its declared length 400
        `validation_failed`; nothing is added in either case.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: What the upload did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListUploadReport'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '411':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports/storyly/apps:
