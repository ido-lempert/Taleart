openapi: 3.1.0
info:
  title: TaleArt API
  version: 1.0.0
  description: >-
    Source of truth for TaleArt request and response shapes (AD-3): the
    Management API under `/api/v1` and the Delivery API under `/delivery/v1`.
    A shape change starts here; regenerate the TypeScript types with
    `npm exec nx -- run contract:generate`.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the API is up.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/state:
    get:
      operationId: getAuthState
      summary: Whether setup is still needed, and who is signed in.
      description: >-
        Works with or without a session. `user` is null when the request has
        no valid session.
      security: []
      responses:
        '200':
          description: The auth state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/options:
    post:
      operationId: startSetup
      summary: Start registering the first admin's passkey.
      description: >-
        Only while no user exists; afterwards 409 `setup_closed`. Answers WebAuthn
        creation options (user verification and a resident key required) and sets
        the http-only `taleart_challenge` cookie. The challenge is single-use and
        expires after 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/setup/verify:
    post:
      operationId: finishSetup
      summary: Register the first admin's passkey and sign them in.
      description: >-
        Checks the authenticator response against the challenge found through
        the `taleart_challenge` cookie, creates the admin and their passkey, and
        sets the `taleart_session` cookie. Bad or expired challenge, or failed
        verification: 400 `passkey_failed`. A user already exists: 409 `setup_closed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: The admin, now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/options:
    post:
      operationId: startSignIn
      summary: Start signing in with a passkey.
      description: >-
        Answers WebAuthn request options without `allowCredentials` (the passkey
        is discoverable, so no email is needed) and sets the http-only
        `taleart_challenge` cookie. The challenge is single-use and expires after 5 minutes.
      security: []
      responses:
        '200':
          description: WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-in/verify:
    post:
      operationId: finishSignIn
      summary: Sign in with a stored passkey.
      description: >-
        Checks the authenticator response and the signature counter, then sets
        the `taleart_session` cookie (7 days). Unknown passkey, bad or expired
        challenge, or failed verification: 401 `passkey_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session.
      description: Deletes the session and clears the `taleart_session` cookie. Works without a session too.
      security: []
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: getInvitation
      summary: Read an invitation before joining.
      description: >-
        Works without a session. An unknown, used or expired invitation answers
        410 `invitation_invalid`.
      security: []
      responses:
        '200':
          description: The project the invitation is for, and when it expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}/options:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: startInvitation
      summary: Start registering an invitee's passkey.
      description: >-
        Answers WebAuthn creation options and sets the http-only
        `taleart_challenge` cookie (single-use, 5 minutes). Unknown, used or
        expired invitation: 410 `invitation_invalid`. An email that already
        belongs to a user: 409 `email_taken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '200':
          description: WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/invitations/{token}/verify:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: finishInvitation
      summary: Register the invitee's passkey, use the invitation and sign them in.
      description: >-
        Creates the user as a `content_manager`, their passkey and their
        membership of the invitation's project, marks the invitation used and
        sets the `taleart_session` cookie, all in one transaction. Bad or
        expired challenge, or failed verification: 400 `passkey_failed`. The
        invitation was used meanwhile or expired: 410 `invitation_invalid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: The new content manager, now signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      summary: List the projects the caller can access, oldest first.
      description: Admins see every project; content managers see the projects they are members of.
      responses:
        '200':
          description: The accessible projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      summary: Create a project (admins only).
      description: A content manager gets 403 `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/invitations:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createInvitation
      summary: Invite someone to a project (admins only).
      description: >-
        Creates a one-time invitation, valid for 7 days. The invitee opens `url`,
        registers a passkey and becomes a content manager of the project. The
        token in `url` is shown only in this response; only its SHA-256 hash is
        stored. A content manager gets 403 `forbidden`; an unknown project 404
        `project_not_found`.
      responses:
        '201':
          description: The invitation, with its one-time link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/site-key:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSiteKey
      summary: Whether the project has an active site key, with its prefix and issue date.
      description: >-
        Answers `null` when the project has no active site key. Never returns
        the key or its hash. Anyone who can access the project may read it. An
        unknown project answers 404 `project_not_found`.
      responses:
        '200':
          description: The active site key's info, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SiteKeyInfo'
                  - type: 'null'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: issueSiteKey
      summary: Issue the project's site key, or rotate it (admins only).
      description: >-
        A project has at most one active site key (AD-9 amended, epic UX rework
        R3), which places every zone of the project on a page with the zone's
        slug. When the project already has an active site key, that key is
        revoked in the same transaction (rotation), which affects every zone of
        the project. `key` appears only in this response; only its SHA-256 hash
        is stored, and the response is sent with `Cache-Control: no-store`. A
        content manager gets 403 `forbidden`; an unknown project 404
        `project_not_found`.
      responses:
        '201':
          description: The new site key, shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedSiteKey'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeSiteKey
      summary: Revoke the project's active site key (admins only).
      description: >-
        The key stops working on the Delivery API at once, for every zone of
        the project. A project without an active site key answers 404
        `site_key_not_found`.
      responses:
        '204':
          description: The site key is revoked.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/tale-groups:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectTaleGroups
      summary: List every tale group of a project by name, with its tale count and zones.
      description: >-
        Tale groups belong to the project (AD-14); a group placed in no zone is
        listed with an empty `zoneIds`. Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's tale groups, by name ignoring case.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTaleGroup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProjectTaleGroup
      summary: Create a tale group in a project, placed in no zone (epic UX rework R14).
      description: >-
        The group starts Off (`draft`) with no tales and no placement; it can
        be shown in a zone later. Unknown project 404 `project_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleGroupRequest'
      responses:
        '201':
          description: The created tale group, with no tales and no zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/theme:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProjectTheme
      summary: The project's theme (epic web zones R9).
      description: >-
        One theme per project styles every zone's frames and the viewer.
        `theme` holds the fields the project sets; `resolved` fills the rest
        with TaleArt's default theme. Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTheme'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setProjectTheme
      summary: Replace the project's theme.
      description: >-
        The body replaces the stored theme; a field left out takes TaleArt's
        default (`{}` resets the theme). A value outside its pattern or range,
        or an unknown field, answers 400 `invalid_theme` naming the field, and
        nothing is stored. Low contrast is not refused; the dashboard warns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeSettings'
      responses:
        '200':
          description: The project's new theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTheme'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/media:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectMedia
      summary: The project's media (epic Tale Studio R5), which Tale Studio's image and video elements pick from.
      description: >-
        The project's uploads (newest first), then its tales' media, then
        media its tales' documents use (such as a copied group's), each key
        once. Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's media.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMedia'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: uploadProjectMedia
      summary: Upload an image (GIF included) or a video to the project's media.
      description: >-
        The body is the file's bytes, with its type declared as one of the
        tale media types. The server checks the bytes' magic number against
        the declared type and stores the file through the storage port
        without transcoding it (AD-11), streaming it to storage. Images are
        at most 10 MB, videos 100 MB; a project holds at most 500 files and
        2 GB (PROJECT_MEDIA_MAX_FILES, PROJECT_MEDIA_MAX_BYTES). Admins and
        content managers upload. Checked in this order, all but the last
        three before the body is read (with `Connection: close`): too many
        uploads at once in this process 429 `upload_busy`; unknown project
        404 `project_not_found`; another declared type 415
        `unsupported_media_type`; a compressed body 415; no valid
        `Content-Length` 411 `length_required`; empty 400
        `validation_failed`; over the type's limit 413 `media_too_large`;
        a full project 409 `media_limit_reached` or 413
        `media_storage_full`; then, while it streams, first bytes of another
        type 415, and a body other than its declared length 400; the caps
        again when the row is inserted.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/gif:
            schema: { type: string, contentMediaType: image/gif }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          video/mp4:
            schema: { type: string, contentMediaType: video/mp4 }
          video/webm:
            schema: { type: string, contentMediaType: video/webm }
      responses:
        '201':
          description: The uploaded media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMedia'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '411':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/media/file:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: query
        required: true
        description: The media's storage key, as the list names it.
        schema:
          type: string
    get:
      operationId: getProjectMediaFile
      summary: A file of the project's media, with a session (for Tale Studio).
      description: >-
        Answers one byte range (206) for videos. A key that is not the
        project's media answers 404 `media_not_found`.
      responses:
        '200':
          description: The file.
          content:
            image/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }
        '206':
          description: One byte range of the file.
        '304':
          description: Not modified.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/fonts:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectFonts
      summary: The project's fonts (epic Tale Studio R18), by family, weight and style.
      description: >-
        Every face uploaded to the project, with whether a tale's draft or
        published document uses it. Unknown project 404 `project_not_found`.
      responses:
        '200':
          description: The project's fonts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectFont'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: uploadProjectFont
      summary: Upload a font face to the project.
      description: >-
        The body is the font file's bytes, uncompressed (no
        `Content-Encoding`), sent as `font/woff2` or
        `application/octet-stream`, types a form cannot send without CORS
        preflight. Only WOFF2 is accepted, judged from the bytes: the
        `wOF2` signature, a header whose length is the file's, a TrueType,
        CFF or collection flavour, a reserved field of 0, 1 to 256 tables,
        a declared decoded size of at most 30 MB, and table and collection
        directories, metadata and compressed data that lie inside the
        file. Nothing is decompressed. At most 500 KB; a project holds at
        most 50 faces and 10 MB of font files. The query names the face
        (the family stored with its spaces collapsed) and carries the
        uploader's confirmation that they may use and distribute the font,
        which is stored with their id and name and the time. Admins and
        content managers upload. Checked in this order: unknown project
        404 `project_not_found`; another type 415 `unsupported_media_type`;
        an invalid `family`, `weight`, `style` or `fallback` 400
        `validation_failed`; no licence confirmation 400
        `validation_failed`; too large 413 `media_too_large` (refused
        before the body is read when its declared length is too large,
        with `Connection: close`); a compressed body 415; a body that did
        not arrive whole 400; empty 400 `validation_failed`; not WOFF2 415
        `unsupported_media_type`; 50 faces already 409
        `font_limit_reached`; over 10 MB together 413 `font_storage_full`;
        a face with the same family (in any case), weight and style 409
        `font_exists`.
      parameters:
        - name: family
          in: query
          required: true
          description: >-
            One font name, the label people read: letters, digits, spaces
            and hyphens, starting with a letter, at most 100 characters, and
            no CSS-wide keyword (the theme's font-list rules). It never
            reaches CSS: the SDK draws the font under an alias made of its id.
          schema:
            type: string
        - name: weight
          in: query
          required: true
          schema:
            type: integer
            enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
        - name: style
          in: query
          required: true
          schema:
            type: string
            enum: [normal, italic]
        - name: fallback
          in: query
          required: true
          description: The system stack text shows until, or when, the font is not available.
          schema:
            type: string
            enum: [sans, serif, rounded, monospace]
        - name: licence
          in: query
          required: true
          description: "`confirmed`: the uploader may use and distribute this font."
          schema:
            type: string
            enum: [confirmed]
      requestBody:
        required: true
        content:
          font/woff2:
            schema: { type: string, contentMediaType: font/woff2 }
          application/octet-stream:
            schema: { type: string, contentMediaType: font/woff2 }
      responses:
        '201':
          description: The new font face.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFont'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/fonts/{fontId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: fontId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteProjectFont
      summary: Delete a font face and its file.
      description: >-
        A font that any tale's draft or published document uses cannot be
        deleted: 409 `font_in_use`. Unknown font, or a font of another
        project: 404 `font_not_found`.
      responses:
        '204':
          description: The font and its file are gone.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/fonts/{fontId}/file:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: fontId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProjectFontFile
      summary: Read a font's file with a session, whether a published tale uses it or not.
      description: >-
        What Tale Studio and the font list load. `font/woff2`, cached
        privately with an opaque ETag (304 when it matches). Unknown font, or a font of
        another project: 404 `font_not_found`.
      responses:
        '200':
          description: The font file.
          content:
            font/woff2:
              schema: { type: string, contentMediaType: font/woff2 }
        '304':
