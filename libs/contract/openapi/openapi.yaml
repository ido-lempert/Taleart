    post:
      operationId: createZone
      summary: Create a zone in a project, from a template or without a display.
      description: >-
        `template` is optional: a template with a display gives the new zone
        that display with its preset settings in the same transaction, so a
        refused display leaves no zone; its key is recorded as the zone's
        `createdFromTemplate` note. A key not in the template registry answers
        400 `unknown_template` and nothing is created.
        `slug` is optional: when missing, it is made from the name (lowercase
        ASCII letters and digits joined by hyphens; `zone` when the name has
        none, as a Hebrew name has none) and made unique in the project with
        `-2`, `-3`. A given slug must be lowercase letters and digits, words
        joined by single hyphens, at most 64 characters (400
        `validation_failed`), and free in the project (409 `slug_taken`). A
        blank name answers 400 `validation_failed`; a project that does not
        exist 400 `project_not_found`; a project the caller cannot access 403
        `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
