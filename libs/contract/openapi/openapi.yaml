          $ref: '#/components/responses/Error'
    patch:
      operationId: renameTaleGroup
      summary: Rename a tale group.
      description: >-
        The name is trimmed and must not be blank (400 `validation_failed`).
        The group is the same in every zone it is placed in, so every zone
        shows the new name (AD-14). Unknown tale group: 404
        `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTaleGroupRequest'
      responses:
        '200':
          description: The renamed tale group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/copy:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: copyTaleGroup
      summary: Copy a tale group into a zone, as an independent group.
      description: >-
        Creates a new tale group in the target zone's project, with the same
        name, placed after the zone's groups (AD-14). Its tales are new rows
        with the same titles, positions and media; media files are not
        duplicated, the copy shares their storage keys (AD-11). For each of
        the source's tags, a tag of the target project with the same name,
        ignoring case, is reused, else created; the copy keeps the source's
        `tagMatch`. Copy and source are independent afterwards. The caller needs access to the source group's
        project and to the target zone's project (403 `forbidden`). Unknown
        tale group: 404 `tale_group_not_found`; missing `zoneId`: 400
        `validation_failed`; unknown zone: 404 `zone_not_found`. The copy counts
        against the target zone's project, which holds at most 500 tale groups
        that are not archived: 409 `tale_group_limit_reached`, and nothing is
        copied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTaleGroupRequest'
      responses:
        '201':
          description: The copy, as placed in the target zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/status:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupStatus
      summary: Publish, pause, archive or restore a tale group.
      description: >-
        Sets the group's stored status key (AD-6). Allowed: `live` from
        `draft` or `paused` (publish); `paused` from `live` (pause) or from
        `archived` (restore); `archived` from `draft`, `live` or `paused`
        (archive). Setting the current status again changes nothing. Any
        other change: 409 `invalid_status_transition`. A restore in a project
        that already has 500 tale groups that are not archived: 409
        `tale_group_limit_reached`. A status other than
        `live`, `paused` or `archived`: 400 `validation_failed`. Unknown tale
        group: 404 `tale_group_not_found`. Only `live` groups reach the
        Delivery API; the `live` tales of a `draft` or `paused` group read
        `blocked-by-group`. The dashboard shows `live` as On and `draft` or
        `paused` as Off (`groupShownStatus`); its switch sets `live` (On) or
        `paused` (Off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
      responses:
        '200':
          description: The tale group with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/schedule:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupSchedule
      summary: Set the start and end time of a tale group.
      description: >-
        Sets or clears the start and end time (AD-6). Live content is
        delivered only while the current time is at or after `startsAt` and
        before `endsAt`; before it, it reads `scheduled`, after it `expired`;
        nothing stores those keys. A bound that is not an ISO 8601 date-time
        with a time zone, a missing field, or an `endsAt` not later than
        `startsAt`: 400 `validation_failed`, nothing changes. Unknown
        tale group: 404 `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScheduleRequest'
      responses:
        '200':
          description: The tale group with its new window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/cover:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleGroupCover
      summary: Read a tale group's cover file.
      description: >-
        The stored bytes, with the `Content-Type` they were uploaded with.
        No cover: 404 `media_not_found`. Unknown tale group: 404
        `tale_group_not_found`.
      responses:
        '200':
          description: The cover file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putTaleGroupCover
      summary: Set or replace a tale group's cover, still or animated.
      description: >-
        The body is the file's bytes and `Content-Type` its type, one of the
        tale media types. The dashboard makes the file in the browser (an
        image, a video frame, or a short clip); the server does not
        transcode (AD-11). The server decides from the bytes whether the
        cover is animated: every video, every GIF, an animated WebP and an
        APNG. An animated cover is at most 300 KB (307 200 bytes,
        `MAX_ANIMATED_COVER_BYTES`), a still image at most 10 MB; larger:
        413 `media_too_large`. Other or mismatched type: 415
        `unsupported_media_type`; empty body: 400 `validation_failed`;
        unknown tale group: 404 `tale_group_not_found`. The previous cover's
        file is deleted unless a tale or another cover still references it.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          image/gif:
            schema: { type: string, contentMediaType: image/gif }
          video/mp4:
            schema: { type: string, contentMediaType: video/mp4 }
          video/webm:
            schema: { type: string, contentMediaType: video/webm }
      responses:
        '200':
          description: The tale group with its new cover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeTaleGroupCover
      summary: Remove a tale group's cover.
      description: >-
        The group goes back to the default cover, its first published tale's
        media. The file is deleted unless a tale or another cover still
        references it. Removing a cover the group does not have changes
        nothing. Unknown tale group: 404 `tale_group_not_found`.
      responses:
        '200':
          description: The tale group, with no cover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createTale
      summary: Add a tale to a tale group, after its existing tales.
      description: >-
        The tale takes its project from the tale group. A new tale is stored
        `live` (Shown): it shows once its group is On and it has a published
        document, which uploading its media creates (AD-6, AD-15). A tale
        group holds at most 100 tales; adding to a full group answers 409
        `tale_group_full`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleRequest'
      responses:
        '201':
          description: The created tale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tales/order:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderTales
      summary: Set the order of a tale group's tales.
      description: >-
        The list names every tale of the group exactly once; positions are
        rewritten to 0..n-1 in that order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown tale group: 404
        `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTalesRequest'
      responses:
        '200':
          description: The group's tales in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/tags:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupTags
      summary: Replace the tags of a tale group.
      description: >-
        The list becomes the group's full set of tags; an empty list clears
        them, and repeated ids count once. Every id must name a tag of the
        group's own project; otherwise nothing changes and the answer is 400
        `tag_not_found`. `tagMatch`, when given, sets how the tags combine
        (`any` or `all`); a value that is neither is 400 `validation_failed`.
        Unknown tale group: 404 `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaleGroupTagsRequest'
      responses:
        '200':
          description: The tale group with its new tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}/user-lists:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleGroupUserLists
      summary: Replace the user lists a tale group is targeted to.
      description: >-
        The list becomes the group's full set of user lists (epic targeting
        R4); an empty list clears them, and repeated ids count once. Every id
        must name a user list of the group's own project; otherwise nothing
        changes and the answer is 404 `user_list_not_found`. Only admins and
        content managers change it (403 `forbidden`). A group with user lists
        is delivered only to viewers whose external user ID is in one of them;
        one whose lists all hold no ID is not visible (`audience-empty`).
        Unknown tale group: 404 `tale_group_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaleGroupUserListsRequest'
      responses:
        '200':
          description: The tale group with its new user lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTale
      summary: Read one tale.
      description: >-
        The tale with its status as read and its visibility in any zone its
        group is placed in (epic UX rework R7), as Tale Studio's status line
        shows it. Unknown tale: 404 `tale_not_found`.
      responses:
        '200':
          description: The tale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTale
      summary: Delete a tale.
      description: >-
        Deletes the tale for good (epic UX rework R11): its draft and
        published documents, and its references to media and project fonts.
        The group's remaining tales keep their order, numbered from the start
        again. A file the tale used is deleted only when nothing references
        it any more: a copy of the tale (AD-14), another tale, a tale group
        cover or the project's uploaded media keeps it (AD-11). Project fonts
        stay in the project. Once deleted, the tale is no longer delivered and
        its media's public URL answers 404 unless a delivered tale or cover
        still uses that file. A tale that came from an import is not created
        again by a later import of the same source: a person's deletion wins
        (AD-7). Events already recorded keep the tale's id (AD-10); the
        visitors' responses to its interactive components are deleted with
        it (epic interactive components R9). Any member
        with access to the tale's project may delete it (403 `forbidden`
        otherwise). Unknown tale: 404 `tale_not_found`.
      responses:
        '204':
          description: The tale was deleted.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/status:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleStatus
      summary: Publish, pause, archive or restore a tale.
      description: >-
        Sets the tale's stored status key (AD-6), with the same allowed
        changes as a tale group's: 409 `invalid_status_transition` for any
        other, 400 `validation_failed` for a status other than `live`,
        `paused` or `archived`. Unknown tale: 404 `tale_not_found`. Only
        `live` tales of `live` groups reach the Delivery API, and only their
        media is public (AD-11). Setting `live` on a tale that has nothing
        published yet (from any status) also publishes its draft document
        (AD-15) in the same transaction, after checking it again; a tale that
        already has a published document keeps it. When the draft no longer
        passes the check, the status still changes, the draft is not
        published, and the answer says so with `draftNotPublished: true` and
        why in `draftNotPublishedReason`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
      responses:
        '200':
          description: The tale with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleStatusResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/schedule:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaleSchedule
      summary: Set the start and end time of a tale.
      description: >-
        Sets or clears the start and end time (AD-6). Live content is
        delivered only while the current time is at or after `startsAt` and
        before `endsAt`; before it, it reads `scheduled`, after it `expired`;
        nothing stores those keys. A bound that is not an ISO 8601 date-time
        with a time zone, a missing field, or an `endsAt` not later than
        `startsAt`: 400 `validation_failed`, nothing changes. Unknown
        tale: 404 `tale_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScheduleRequest'
      responses:
        '200':
          description: The tale with its new window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/media:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleMedia
      summary: Read a tale's media file.
      description: The stored bytes, with the `Content-Type` they were uploaded with.
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putTaleMedia
      summary: Upload or replace a tale's image, GIF or video.
      description: >-
        The body is the file's bytes and `Content-Type` its type. Images
        (`image/jpeg`, `image/png`, `image/webp`, `image/gif`) may be up to
        10 MB and videos (`video/mp4`, `video/webm`) up to 100 MB. The declared
        type must match the file's leading bytes. Unknown tale: 404
        `tale_not_found`; other or mismatched type: 415 `unsupported_media_type`;
        too large: 413 `media_too_large`; empty body: 400 `validation_failed`.
        Replacing media removes the previous file.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          image/gif:
            schema: { type: string, contentMediaType: image/gif }
          video/mp4:
            schema: { type: string, contentMediaType: video/mp4 }
          video/webm:
            schema: { type: string, contentMediaType: video/webm }
      responses:
        '200':
          description: The tale, with its new media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/document:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleDocument
      summary: Read a tale's draft document, with its published one.
      description: >-
        The tale's draft document (AD-15), the one Tale Studio edits, with its
        revision, and the published document with its own revision, the one
        the Delivery API serves. A tale without a draft answers `document:
        null` and revision 0; without a published document, `published:
        { document: null, revision: 0 }`, and it shows its media only.
        Unknown tale: 404 `tale_not_found`.
      responses:
        '200':
          description: The document and its revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleDocumentRevision'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveTaleDocument
      summary: Save a tale's draft document.
      description: >-
        Replaces the draft document when `revision` is the draft's current
        revision, and answers it with the next revision and the published
        document. The published document, and so what visitors see, does not
        change. A write based on an
        older revision changes nothing and answers 409 `stale_revision`, so
        two editors never overwrite each other silently. The document is
        checked against `tale-document/v1.schema.json` (no additional
        properties), each element's `props` against the schema of its
        registered type, and the rules of AD-15: at most 60 elements, 1,000
        characters per text, unique ids, numbers in range, no control
        characters except a line feed in text. A refused document answers 400
        `invalid_tale_document` with `pointer`, the JSON pointer of the field
        it refused (from the document's root); a document over 128 KB answers
        413 `tale_document_too_large`. A body without a document or a revision (an integer from 0 to 2147483647):
        400 `validation_failed`. Unknown tale: 404 `tale_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTaleDocumentRequest'
      responses:
        '200':
          description: The saved document and its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleDocumentRevision'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/document/publish:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishTaleDocument
      summary: Publish a tale's draft document.
      description: >-
        Copies the draft document to the published one, which the Delivery
        API serves, raising the published revision, when `revision` is the
        draft's current revision and `publishedRevision` the published one's
        (compare-and-set on both, in one statement); otherwise nothing
        changes and it answers 409 `stale_revision`. A tale with no draft
        answers 409 `nothing_to_publish`; publishing never empties the
        published document. The draft is checked
        again first (400 `invalid_tale_document` with `pointer`), with the
        publish rule too: every visible image and video needs alt text
        (`a11y.label`) or `a11y.decorative` (epic Tale Studio R12), refused
        with a message naming the element. The tale's
        status is not changed: a tale that is not `live` stays unseen. A body
        without integer revisions: 400 `validation_failed`. Unknown tale: 404
        `tale_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaleDocumentRevisionsRequest'
      responses:
        '200':
          description: The draft and the newly published document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleDocumentRevision'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/document/discard:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: discardTaleDraft
      summary: Discard a tale's draft, back to the published document.
      description: >-
        Replaces the draft with the published document (null when nothing is
        published), raising the draft's revision, when `revision` and
        `publishedRevision` are the current ones (compare-and-set on both);
        otherwise nothing changes and it answers 409 `stale_revision`. A body
        without integer revisions: 400 `validation_failed`. Unknown tale: 404
        `tale_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaleDocumentRevisionsRequest'
      responses:
        '200':
          description: The draft, now the published document, and the published document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleDocumentRevision'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/document/copy:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: copyTaleDocument
      summary: Keep a document as a new tale in the tale's group.
      description: >-
        For a save refused with 409 `stale_revision`: keeps the editor's own
        version as a new tale instead of dropping it. In one transaction,
        creates a `draft` tale at the end of the source tale's group, titled
        after the source with " (copy)", sharing the source's media storage
        key (AD-11, AD-14), and holding `document` as its draft at revision 1,
        with nothing published (revision 0). The document
        is checked as a save checks it: 400 `invalid_tale_document` with
        `pointer`, 413 `tale_document_too_large`. A tale group holds at most
        100 tales: 409 `tale_group_full`, and nothing is created. The caller
        needs access to the source tale's project (403 `forbidden`). Unknown
        tale: 404 `tale_not_found`; a body without a document: 400
        `validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTaleDocumentRequest'
      responses:
        '201':
          description: The new tale, a draft, holding the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/duplicate:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: duplicateTale
      summary: Duplicate a tale with its documents into a tale group of its project.
      description: >-
        Creates a new tale in `taleGroupId` (default: the tale's own group),
        which must be a group of the tale's project (AD-4): an unknown group
        or one of another project answers 400 `tale_group_not_found`, as
        placing a group does. The copy is stored `paused` (Hidden), so it does
        not show twice on the site until someone shows it. In the tale's own
        group it is placed right after the original (the later tales move one
        on); in another group, last. Its title is the original's with
        " (copy)"; it keeps the start and end time. It holds the original's
        published document as its published document and the original's
        draft as its draft (AD-15), each at revision 1 (0 when there is
        none), so a pending change is still pending on the copy; every element
        gets a new id. Media and project fonts are not copied: the copy shares
        the original's storage keys (AD-11, AD-14), and a file stays while any
        tale uses it, so changing or archiving the original never breaks the
        copy. A tale group holds at most 100 tales: 409 `tale_group_full`,
        and nothing is created. The caller needs access to the tale's project
        (403 `forbidden`). Unknown tale: 404 `tale_not_found`; a `taleGroupId`
        that is not a string: 400 `validation_failed`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateTaleRequest'
      responses:
        '201':
          description: The copy, Hidden, as its group lists it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tale'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tales/{taleId}/responses:
    parameters:
      - name: taleId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleResponses
      summary: Read the responses to a tale's interactive components.
      description: >-
        The visitors' responses to the tale's interactive components (epic
        interactive components R11), as Tale Studio's inspector shows them:
        per component, the number of responses in all and per stored value
        (a poll's option id, a quiz's answer id, a Rating's value from 0 to
        100), whatever the
        tale's documents hold now. A
        component without a response is not listed. Counts include only
        responses from the site; the studio preview records none. Any member
        with access to the tale's project may read them (403 `forbidden`
        otherwise). Unknown tale: 404 `tale_not_found`.
      responses:
        '200':
          description: The counts per component.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleResponses'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /responses:
    servers:
      - url: /delivery/v1
        description: Delivery API (AD-2), for SDKs. Accepts site keys only.
    post:
      operationId: postDeliveryResponse
      summary: Record a visitor's response to an interactive component (Delivery API).
      description: >-
        Served under `/delivery/v1` (epic interactive components R9). Accepts
        the project's site key and the zone's slug exactly as `GET /zone`
        does, with the same 401 `invalid_site_key` for every refused key or
        slug, and the same per-visitor rate limit, plus a stricter limit of
        its own for writes (by default 30 at once and 1 per second per
        visitor). The `X-TaleArt-Visitor` header is required here: a missing
        or invalid visitor id answers 400 `visitor_id_required`. The response
        is kept only when the tale is delivered in that zone now (the
        visibility rule of AD-6: its group is placed there and on, the tale
        shown and updated, inside their windows, the zone set up), and its
        published document holds a visible element with that id of an
        interactive type; otherwise 404 `response_target_not_found`, the
        same for a tale of another project, a hidden tale and an unknown
        element. The value must be valid for the element (a poll's option
        id; a quiz's answer id; a Rating's whole number from 0 to 100,
        written plainly, such as `80`), else 422 `validation_failed`. Each visitor keeps one response
        per tale, component and interaction kind, and the first is kept
        (C9): a new response answers 201, a repeat 200 with the stored value
        and `recorded: false`. Either way the answer carries the current
        result (a poll's or a quiz's counts and percentages per option or
        answer, a Rating's count and average). A quiz's correct answer is
        not in the answer: it is in the published document (C10). The row records
        the project, zone, display, tale group and tale ids, the element's
        id and type, the value, the visitor id and the client's and the
        server's times (AD-10); no user data (AD-13). Deleting the tale
        deletes its responses. Answers are `Cache-Control: no-store`.
      security:
        - siteKey: []
      parameters:
        - name: zone
          in: query
          required: true
          description: The zone's slug, as for `GET /zone`.
          schema:
            type: string
        - name: X-TaleArt-Visitor
          in: header
          required: true
          description: >-
            The visitor id (epic UX rework 8.23): a random UUID v4 the SDK
            keeps on the device, all in lowercase or all in uppercase.
            Responses are kept per visitor id.
          schema:
            type: string
            format: uuid
            pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9A-F]{8}-[0-9A-F]{4}-4[0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12})$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveResponseRequest'
      responses:
        '200':
          description: A repeat; the visitor's first response, kept, with the current result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveResponse'
        '201':
          description: The response was recorded; the current result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: taleart_session
      description: >-
        Server-side session started by a passkey sign-in (AD-9). Without a valid
        session every route except `/health` and `/auth/*` answers 401 `unauthenticated`.
        A signed-in user who cannot access the project of a resource gets 403
        `forbidden`; a resource that does not exist still answers 404.
        When a request carries an `Authorization` header, the cookie is not
        read (see `token`).
    token:
      type: http
      scheme: bearer
      bearerFormat: tat_
      description: >-
        A personal API token (`tat_...`) created in the dashboard under
        Settings > API tokens (epic developer experience 10.1), sent as
        `Authorization: Bearer <token>`. It acts as the user who created it,
        within the token's scope: its projects (or all of the user's projects)
        intersected with the user's access read on every request, and, for a
        read-only token, GET and HEAD only (anything else answers 403
        `forbidden`). Admin-only routes stay admin-only. A token follows its
        user's role as it is now: a token for all projects reaches every
        project once its user is made an admin (and fewer when the user loses
        projects or admin), and an admin's read-write token can do what the
        admin can within its projects, including issuing, rotating and
        revoking site keys, which affects every zone of the project. An admin
        can revoke every token of a user (`DELETE /users/{userId}/api-tokens`).
        At most 50 tokens per user are active (expired and revoked ones do not
        count). A missing, unknown,
        revoked or expired token, or any other credential in the header (such
        as a `tas_` site key), answers 401 `unauthenticated`; when a request
        carries an `Authorization` header the session cookie is ignored, even
        if the header is refused. Failed attempts count against the caller's
        address (by default 10 at once, refilled at 10 a minute); past that, a
        failed attempt answers 429 `rate_limited` with `Retry-After` instead
        of 401, while a valid token keeps working. A token can never create, list or revoke tokens, use
        `/auth/*` (sign-in, sign-out, setup, invitations: 403 `forbidden`),
        manage passkeys or sessions, or create invitations; a token limited to
        some projects cannot create projects. Only the Management API accepts
        it; the Delivery API refuses it.
    siteKey:
      type: http
      scheme: bearer
      description: >-
        The project's site key (`tas_...`) issued in the dashboard (AD-9
        amended), sent as `Authorization: Bearer <key>` with the zone's slug
        in the `zone` query parameter. Only the Delivery API accepts it.
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      description: The one-time token from the invitation link.
      schema:
        type: string
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Zone:
      type: object
      required: [id, name, slug, projectId, createdFromTemplate, frame, visibility, firstVisibleAt]
      properties:
        firstVisibleAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When the zone was first read as visible on the site (epic UX rework
            R9), or null while it never was. Set once, by the API, the first
            time it returns the zone with `visibility.visible` true, and never
            cleared: the dashboard hides the zone's setup checklist from then
            on, for every user, even when the zone later stops being visible.
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: >-
            Whether the zone shows anything on the site now (epic UX rework
            R7): it has a display, it is installed, and a tale group placed
            in it is delivered. Computed by the rule the Delivery API uses.
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 64
          description: >-
            Unique in the zone's project (epic UX rework R1): lowercase letters
            and digits, words joined by single hyphens. The value a host page
            names in `zone="…"`.
        projectId:
          type: string
          format: uuid
        createdFromTemplate:
          type: [string, 'null']
          description: >-
            The key of the template the zone was created from (epic UX rework
            R5), from the template registry in `libs/contract`; null when none.
            Only a "created from template" note: the template set the display
            once and nothing links the zone to it afterwards. A zone the
            migration made from a stage keeps its original zone's note.
        frame:
          description: >-
            The zone's display (AD-5, AD-17): at most one frame, or null when
            the zone has none. A zone without a display delivers nothing.
          oneOf:
            - $ref: '#/components/schemas/Frame'
            - type: 'null'
    CreateZoneRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
          minLength: 1
        projectId:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 64
          description: >-
            The zone's slug. When missing, it is made from the name and made
            unique in the project with a numeric suffix (`home-2`). A slug
            another zone of the project has answers 409 `slug_taken`.
        template:
          type: string
          enum: [stories-bar, promo-banner, blank]
          description: >-
            A template from the template registry in `libs/contract` (epic UX
            rework R5). It sets the zone's display and its settings once, in
            the same transaction, and is recorded as the zone's
            `createdFromTemplate` note. `blank` sets no display. When missing,
            the zone has no display and no note.
    UpdateZoneRequest:
      type: object
      description: At least one of `name` and `slug`.
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 64
    FrameType:
      type: object
      required: [key, label, schema]
      properties:
        key:
          type: string
          description: Registry key stored on each frame as `type`.
        label:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: >-
            The JSON Schema (draft 2020-12) of the type's `settings`, from
            `libs/contract/frame-types/`. Each field's `title`, `description`
            and `default` drive the dashboard's settings form.
    Frame:
      type: object
      required: [id, zoneId, projectId, type, settings]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key from the registry.
        settings:
          type: object
          additionalProperties: true
          description: Settings valid against the frame type's JSON Schema.
    SetFrameRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
        settings:
          type: object
          additionalProperties: true
    UpdateFrameRequest:
      type: object
      description: At least one of `type` and `settings`.
      properties:
        type:
          type: string
          minLength: 1
          description: A new frame type; without `settings`, the settings reset to its defaults.
        settings:
          type: object
          additionalProperties: true
          description: The display's new settings, valid against its (new) type's JSON Schema.
    TaleGroup:
      type: object
      description: >-
        A tale group belongs to its project (AD-14). Zones place it, each in
        its own order; its tales, tags and media are the same in every zone.
      required: [id, projectId, name, status, storedStatus, startsAt, endsAt, cover, zoneIds, tales, tags, tagMatch, userLists, visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: >-
            Whether the group is visible on the site now (epic UX rework R7).
            As a zone lists it (`ZoneTaleGroup`), in that zone: the visibility
            of this placement. Elsewhere, in any zone it is placed in.
        cover:
          description: >-
            The group's cover, still or animated, or null when it has none;
            then the bar shows its first published tale's media.
          oneOf:
            - $ref: '#/components/schemas/TaleGroupCover'
            - type: 'null'
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The group's status as read (AD-6): `scheduled` or `expired` when
            `storedStatus` is `live` and the current time is before
            `startsAt` or at or after `endsAt`, else `storedStatus`.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The status key a person set (AD-6): `draft` for a new group, then
            `live`, `paused` or `archived`.
        startsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Start of the window, ISO 8601 UTC, or null for no start. Before it,
            live content reads `scheduled` and is not delivered (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            End of the window, ISO 8601 UTC, or null for no end; later than
            `startsAt`. From it on, live content reads `expired` and is not
            delivered (AD-6).
        zoneIds:
          type: array
          description: Every zone the group is placed in, in the order it was placed; empty when none.
          items:
            type: string
            format: uuid
        tales:
          type: array
          maxItems: 100
          description: The group's tales, by position.
          items:
            $ref: '#/components/schemas/Tale'
        tags:
          type: array
          description: The group's tags, by name ignoring case.
          items:
            $ref: '#/components/schemas/TaleGroupTag'
        tagMatch:
          $ref: '#/components/schemas/TagMatch'
        userLists:
          type: array
          description: >-
            The user lists the group is targeted to (epic targeting R4), by
            name ignoring case; empty when none. With any, the group shows only
            to viewers whose external user ID is in one of them (and whose tags
            pass its tag rule).
          items:
            $ref: '#/components/schemas/TaleGroupUserList'
    ZoneTaleGroup:
      description: A tale group as a zone lists it, with its position in that zone.
      allOf:
        - $ref: '#/components/schemas/TaleGroup'
        - type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 0
              description: Order within this zone; the zone's lists are sorted by it.
    ProjectTaleGroup:
      type: object
      description: >-
        A tale group as the project's list shows it (epic UX rework R14): the
        group's own fields, cover, tags and visibility in any zone it is placed
        in, with its tale counts instead of its tales, so the list stays small.
      required: [id, projectId, name, status, storedStatus, startsAt, endsAt, cover, zoneIds, tags, tagMatch, userLists, visibility, taleCount, shownTaleCount]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: Whether the group is visible on the site now, in any zone it is placed in (epic UX rework R7).
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: The group's status as read (AD-6), as on `TaleGroup`.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: The status key a person set (AD-6).
        startsAt:
          type: [string, 'null']
          format: date-time
          description: Start of the window, ISO 8601 UTC, or null for no start (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: End of the window, ISO 8601 UTC, or null for no end (AD-6).
        cover:
          description: The group's cover, or null when it has none, as on `TaleGroup`.
          oneOf:
            - $ref: '#/components/schemas/TaleGroupCover'
            - type: 'null'
        zoneIds:
          type: array
          description: Every zone the group is placed in, in the order it was placed; empty when none.
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: The group's tags, by name ignoring case.
          items:
            $ref: '#/components/schemas/TaleGroupTag'
        tagMatch:
          $ref: '#/components/schemas/TagMatch'
        userLists:
          type: array
          description: >-
            The user lists the group is targeted to (epic targeting R4), by
            name ignoring case; empty when none. With any, the group shows only
            to viewers whose external user ID is in one of them (and whose tags
            pass its tag rule).
          items:
            $ref: '#/components/schemas/TaleGroupUserList'
        taleCount:
          type: integer
          minimum: 0
          maximum: 100
        shownTaleCount:
          type: integer
          minimum: 0
          maximum: 100
          description: The group's tales that are Shown (stored `live`, AD-6 amended).
    Tag:
      type: object
      required: [id, projectId, name]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
    TaleGroupTag:
      type: object
      required: [id, name]
      description: A tag as a tale group carries it.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TaleGroupUserList:
      type: object
      required: [id, name, idCount]
      description: A user list as a tale group is targeted to it, with how many IDs it holds (never which).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        idCount:
          type: integer
          minimum: 0
    UserListTaleGroup:
      type: object
      required: [id, name]
      description: A tale group a user list targets.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Trimmed before it is checked and stored; unique in the project ignoring case.
    UserList:
      type: object
      required: [id, projectId, name, idCount, taleGroups, createdAt, updatedAt]
      description: >-
        A project's list of external user IDs (epic targeting R3). It tells
        how many IDs it holds, never which: they are stored only as keyed
        hashes (R5), and the tale groups it targets.
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        idCount:
          type: integer
          minimum: 0
          description: How many distinct external user IDs the list holds.
        taleGroups:
          type: array
          description: The tale groups targeted to the list (epic targeting R4), by name ignoring case.
          items:
            $ref: '#/components/schemas/UserListTaleGroup'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the list was created, renamed or last had IDs added.
    CreateUserListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before it is checked and stored; unique in the project ignoring case.
    RenameUserListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before it is checked and stored; unique in the project ignoring case.
    UserListRefusedRow:
      type: object
      required: [line, reason]
      description: A refused row, by its line number in the file (from 1), never by its value.
      properties:
        line:
          type: integer
          minimum: 1
        reason:
          $ref: '#/components/schemas/UserListRefusal'
    UserListRefusal:
      type: string
      enum: [too-long, control-character, not-one-column]
      description: >-
        Why a row was refused: longer than 256 characters (code points),
        holding a control character, or more than one field (an unquoted
        comma or quote, or a broken quoted field). Any other Unicode text is
        an ID: the SDKs send it base64url-encoded (`X-TaleArt-External-User-Id`),
        and it matches exactly, case included, with no Unicode normalization.
    UserListUploadReport:
      type: object
      required: [added, alreadyPresent, refused, refusedRows, emptyRows, emailLike, phoneLike, idCount]
      description: >-
        What an upload did, in counts only (epic targeting R3, R5). It never
        holds an uploaded value.
      properties:
        added:
          type: integer
          minimum: 0
          description: IDs added to the list.
        alreadyPresent:
          type: integer
          minimum: 0
          description: Rows whose ID the list already held, or an earlier row of the file held.
        refused:
          type: integer
          minimum: 0
        refusedRows:
          type: array
          maxItems: 10
          description: The first refused rows, by line number.
          items:
            $ref: '#/components/schemas/UserListRefusedRow'
        emptyRows:
          type: integer
          minimum: 0
          description: Blank rows, skipped.
        emailLike:
          type: integer
          minimum: 0
          description: Accepted rows that look like an email address.
        phoneLike:
          type: integer
          minimum: 0
          description: Accepted rows that look like a phone number.
        idCount:
          type: integer
          minimum: 0
          description: How many IDs the list holds now.
    SetTaleGroupTagsRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          description: The ids of the group's new tags, all of the group's project. Repeats count once.
          items:
            type: string
        tagMatch:
          $ref: '#/components/schemas/TagMatch'
          description: How the tags combine (epic targeting R1); left out, the group keeps its match mode.
    SetTaleGroupUserListsRequest:
      type: object
      required: [userListIds]
      properties:
        userListIds:
          type: array
          maxItems: 100
          description: The ids of the group's new user lists, all of the group's project. Repeats count once; empty clears them.
          items:
            type: string
    TagMatch:
      type: string
      enum: [any, all]
      description: >-
        How a tale group's targeting tags combine (epic targeting R1, R2):
        `any` (the default) shows the group to a viewer with at least one of
        its tags, `all` only to a viewer with every one of them. A group with
        no tags, or a viewer whose page passed no tags, always passes. The
        SDK decides (AD-13), with `tagRulePasses` from the contract.
    CreateTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before it is checked and stored; at most 100 characters.
    RenameTaleGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before it is checked and stored.
    CopyTaleGroupRequest:
      type: object
      required: [zoneId]
      properties:
        zoneId:
          type: string
          description: The zone to place the copy in; its project may differ from the source's.
    DuplicateTaleRequest:
      type: object
      properties:
        taleGroupId:
          type: string
          description: The tale group of the tale's project to put the copy in; absent, the tale's own group.
    Tale:
      type: object
      required: [id, taleGroupId, projectId, title, position, status, storedStatus, startsAt, endsAt, media, visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: >-
            Whether the tale is visible on the site now (epic UX rework R7).
            Inside a zone's list of tale groups, in that zone; elsewhere, in
            any zone its group is placed in.
        id:
          type: string
          format: uuid
        taleGroupId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          minimum: 0
          description: Order within the tale group; lists are sorted by it.
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The tale's status as read (AD-6): `storedStatus` unless it is
            `live`; then `blocked-by-group` when its group is `draft` or
            `paused`, else
            `scheduled` before `startsAt`, `expired` at or after `endsAt`, else
            `live`. The group's window does not change the tale's status, but
            the Delivery API needs both windows to contain the current time.
        storedStatus:
          $ref: '#/components/schemas/ContentStatus'
          description: >-
            The status key a person set: `live` for a new tale (Shown, so a
            group turned On shows it), then `paused` (Hidden), `live` (Shown)
            or `archived`. `draft` (Hidden) remains on tales from before the
            UX rework and on kept copies. The dashboard shows `live` as Shown
            and `draft` or `paused` as Hidden (`taleShownStatus`). A tale is
            delivered only when it also has a published document (AD-15).
        startsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Start of the window, ISO 8601 UTC, or null for no start. Before it,
            live content reads `scheduled` and is not delivered (AD-6).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: >-
            End of the window, ISO 8601 UTC, or null for no end; later than
            `startsAt`. From it on, live content reads `expired` and is not
            delivered (AD-6).
        media:
          description: >-
            The tale's image, GIF or video, or null when it has none. Kept
            for SDKs from before documents: the document holds the same media
            as its `taleMedia` element (epic Tale Studio R16), and current
            SDKs render only the document.
          oneOf:
            - $ref: '#/components/schemas/TaleMedia'
            - type: 'null'
    TaleMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          description: Where the Management API serves the file, such as `/api/v1/tales/{taleId}/media`.
    TaleGroupCover:
      type: object
      required: [kind, contentType, animated, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        animated:
          type: boolean
          description: >-
            True for a video, a GIF, an animated WebP or an APNG: the bar
            animates it unless the visitor prefers reduced motion.
        url:
          type: string
          description: Where the Management API serves the file, such as `/api/v1/tale-groups/{taleGroupId}/cover`.
    Visibility:
      type: object
      description: >-
        Whether content is visible on the site now, and why not (epic UX
        rework R7). Computed from the same rule the Delivery API filters by,
        so the two cannot disagree: `visible` is true exactly when `reasons`
        is empty.
      required: [visible, reasons]
      properties:
        visible:
          type: boolean
        reasons:
          type: array
          description: >-
            Every reason the content is not visible, most useful first
            (`VISIBILITY_REASON_ORDER` in `libs/contract`); empty when it is visible.
          items:
            $ref: '#/components/schemas/VisibilityReason'
    VisibilityReason:
      type: object
      required: [code, subject]
      properties:
        code:
          $ref: '#/components/schemas/VisibilityReasonCode'
        subject:
          type: string
          enum: [zone, group, tale]
          description: What the reason is about, such as the tale's group for `group-off` on a tale.
        at:
          type: string
          format: date-time
          description: For `starts-at` and `ended-at`, the start or end of the window, ISO 8601 UTC.
    VisibilityReasonCode:
      type: string
      description: >-
        Why content is not visible (epic UX rework R7). `group-off`: the
        group is stored `draft` or `paused`. `tale-hidden`: the tale is.
        `group-blocked`: a process set the group's key (`processing`,
        `invalid-media`, `quota-reached`). `archived`. `no-shown-tales`: a
        group has no delivered tale. `no-visible-groups`: a zone has tale
        groups but delivers none. `no-tale-groups`: a zone has none.
        `not-in-any-zone`. `starts-at` and `ended-at`: outside the window.
        `zone-no-display`: the zone has no frame. `zone-not-installed`: the
        zone has no active key. `media-processing`: the tale is stored
        `processing`. `media-problem`: the tale is stored `invalid-media` or
        `quota-reached`. `not-updated-yet`: nothing published to deliver.
        `audience-empty`: the group is targeted only to user lists and none
        of them holds an ID, so no viewer can match (epic targeting R7).
      enum:
        - group-off
        - tale-hidden
        - group-blocked
        - archived
        - no-shown-tales
        - not-in-any-zone
        - starts-at
        - ended-at
        - zone-no-display
        - zone-not-installed
        - media-processing
        - media-problem
        - not-updated-yet
        - no-visible-groups
        - no-tale-groups
        - audience-empty
    ContentStatus:
      type: string
      description: >-
        A status key of the AD-6 scheme. Each key has one HTTP code, defined
        in `libs/contract` (`CONTENT_STATUS_HTTP_CODES`): draft 204, live 200,
        scheduled 202, processing 102, invalid-media 422, paused 403,
        blocked-by-group 423, expired 410, quota-reached 429, archived 404.
        `scheduled`, `expired` and `blocked-by-group` are computed when
        content is read and never stored.
      enum:
        - draft
        - live
        - scheduled
        - processing
        - invalid-media
        - paused
        - blocked-by-group
        - expired
        - quota-reached
        - archived
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [live, paused, archived]
          description: >-
            `live` publishes, `paused` pauses (or restores an archived item),
            `archived` archives.
    SetScheduleRequest:
      type: object
      required: [startsAt, endsAt]
      description: >-
        The window in which live content is delivered (AD-6). Each bound is an
        ISO 8601 date-time with `Z` or an offset, stored and returned in UTC,
        or null for an open bound. `endsAt` must be later than `startsAt`
        when both are set.
      properties:
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
    MediaKind:
      type: string
      enum: [image, video]
    MediaContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
        - video/mp4
        - video/webm
    CreateTaleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    OrderTaleGroupsRequest:
      type: object
      required: [taleGroupIds]
      properties:
        taleGroupIds:
          type: array
          description: Every tale group id placed in the zone, once each, in the new order.
          items:
            type: string
    OrderTalesRequest:
      type: object
      required: [taleIds]
      properties:
        taleIds:
          type: array
          description: Every tale id of the group, once each, in the new order.
          items:
            type: string
    InstallInfo:
      type: object
      required: [apiUrl, sdkUrl, sdkPinnedUrl, sdkIntegrity, sdkBuildsKept, testPageUrl]
      properties:
        apiUrl:
          type: string
          description: The API's public origin, the value of `api-url` on a host page.
        sdkUrl:
          type: string
          description: >-
            The Web SDK bundle (an ES module) for a host page's script tag, at a
            stable URL: a deploy replaces it there (cached five minutes).
        sdkPinnedUrl:
          type: [string, 'null']
          description: >-
            The same bundle at a URL pinned to its content
            (`<apiUrl>/sdk/v1/taleart.<hash>.js`, cached a year, immutable),
            for a page that also pins it with `integrity`. The API keeps serving
            it while it is one of the last `sdkBuildsKept` SDK builds it
            served. Null when the API has no bundle.
        sdkIntegrity:
          type: [string, 'null']
          description: The bundle's Subresource Integrity value (`sha384-…`); null when the API has no bundle.
        sdkBuildsKept:
          type: integer
          minimum: 1
          description: >-
            How many SDK builds this server keeps at their pinned URLs, the
            current one included (SDK_BUILDS_KEPT, default 5). 1 when the
            server keeps no earlier builds (SDK_BUILDS_DIR=off): a pinned URL
            then stops working at the next SDK build.
        testPageUrl:
          type: string
          description: >-
            The test page. It takes the zone's slug as `?zone=<slug>` and a site key in the URL
            fragment, `#siteKey=<key>`, or pasted on the page.
    SiteKeyInfo:
      type: object
      required: [prefix, createdAt]
      properties:
        prefix:
          type: string
          description: The start of the site key, `tas_` and the next 6 characters, to recognise it.
        createdAt:
          type: string
          format: date-time
    IssueSiteKeyRequest:
      type: object
      properties:
        ifNone:
          type: boolean
          description: >-
            Issue only when the project has no active site key; otherwise 409
            `site_key_exists` and nothing changes. Leave it out (or false) to
            rotate.
    IssuedSiteKey:
      type: object
      required: [key, prefix, createdAt]
      properties:
        key:
          type: string
          description: The secret site key, `tas_` and 32 random bytes in base64url. Shown only once.
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiToken:
      type: object
      description: A personal API token as its user sees it (epic developer experience 10.1), never the token or its hash.
      required: [id, name, prefix, projectIds, readOnly, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the token is for, 1 to 80 characters.
        prefix:
          type: string
          description: The start of the token, `tat_` and the next 6 characters, to recognise it.
        projectIds:
          type: [array, 'null']
          items:
            type: string
            format: uuid
          description: >-
            The projects the token is limited to; null for every project its
            user can access. Either way the user's own access is applied too.
        readOnly:
          type: boolean
          description: When true the token may only read (GET and HEAD).
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the token stops working; null when it does not expire.
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When the token was last used, to within a minute (it is written at
            most once a minute); null when it was never used.
    CreateApiTokenRequest:
      type: object
      required: [name, projectIds, readOnly]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        projectIds:
          type: [array, 'null']
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: The projects to limit the token to, or null for every project the user can access.
        readOnly:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the token stops working, in the future; null or left out for never.
    RevokedApiTokens:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0
          description: How many active tokens were revoked.
    IssuedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret token, `tat_` and 32 random bytes in base64url. Shown only once.
    ThemeColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
      description: A colour as `#rrggbb`; nothing else is accepted, so no value can inject CSS.
    RingStyle:
      type: string
      enum: [gradient, solid, none]
    ThemeSettings:
      type: object
      description: >-
        The fields of a theme a project sets (epic web zones R9); a field left
        out takes TaleArt's default, which keeps the look host pages had before
        themes: a transparent background, and the title colour, font and
        corner radius of the host page or the frame (`null`). Validated by
        `themeSettingsError` in `libs/contract`.
      additionalProperties: false
      properties:
        ringStyle:
          $ref: '#/components/schemas/RingStyle'
          default: gradient
        ringColors:
          type: array
          description: The unseen ring's colours; a gradient runs through them, `solid` uses the first.
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ThemeColor'
          default: ['#ea580c', '#db2777', '#7c3aed']
        seenRingColor:
          $ref: '#/components/schemas/ThemeColor'
          default: '#6b7280'
        ringWidth:
          type: integer
          minimum: 1
          maximum: 4
          default: 2
          description: The ring's width in px.
        cornerRadius:
          type: [integer, 'null']
          minimum: 0
          maximum: 32
          default: null
          description: >-
            Corner radius in px of rounded-square bar items and banner slides;
            null keeps the frame's own (a quarter of the item size, 12 px on a banner).
        fontFamily:
          type: [string, 'null']
          maxLength: 200
          pattern: '^(?!.*(?:^|[\s,"''])(?:[iI][nN][hH][eE][rR][iI][tT]|[iI][nN][iI][tT][iI][aA][lL]|[uU][nN][sS][eE][tT]|[rR][eE][vV][eE][rR][tT]|[rR][eE][vV][eE][rR][tT]-[lL][aA][yY][eE][rR]|[dD][eE][fF][aA][uU][lL][tT])(?=$|[\s,"'']))(?!.*(?:^|[\s,"''])[tT][aA][lL][eE][aA][rR][tT]-[fF][oO][nN][tT]-)\s*(?:[A-Za-z][A-Za-z0-9 -]*|"[A-Za-z0-9 -]+"|''[A-Za-z0-9 -]+'')\s*(?:,\s*(?:[A-Za-z][A-Za-z0-9 -]*|"[A-Za-z0-9 -]+"|''[A-Za-z0-9 -]+'')\s*)*$'
          default: null
          description: >-
            A CSS font-family list (the host page loads the font): names of
            letters, digits, spaces and hyphens, bare (starting with a letter)
            or quoted, never a CSS-wide keyword or `default`. Null inherits the
            host page's font.
        titleColor:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          default: null
          description: Titles and banner dots as `#rrggbb`; null inherits the host page's text colour.
        backgroundColor:
          type: string
          pattern: '^(?:#[0-9a-fA-F]{6}|transparent)$'
          default: transparent
          description: Behind the bar and the banner, as `#rrggbb` or `transparent` (the host page shows through).
        accentColor:
          $ref: '#/components/schemas/ThemeColor'
          default: '#ffffff'
          description: The viewer's progress and button icons.
    Theme:
      type: object
      description: >-
        A complete theme, every field present (TaleArt's default where the
        project sets none); `null` takes the host page's or the frame's own value.
      required: [ringStyle, ringColors, seenRingColor, ringWidth, cornerRadius, fontFamily, titleColor, backgroundColor, accentColor]
      additionalProperties: false
      properties:
        ringStyle:
          $ref: '#/components/schemas/RingStyle'
        ringColors:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ThemeColor'
        seenRingColor:
          $ref: '#/components/schemas/ThemeColor'
        ringWidth:
          type: integer
          minimum: 1
          maximum: 4
        cornerRadius:
          type: [integer, 'null']
          minimum: 0
          maximum: 32
        fontFamily:
          type: [string, 'null']
        titleColor:
          type: [string, 'null']
        backgroundColor:
          type: string
        accentColor:
          $ref: '#/components/schemas/ThemeColor'
    ProjectTheme:
      type: object
      required: [projectId, theme, resolved]
      properties:
        projectId:
          type: string
          format: uuid
        theme:
          $ref: '#/components/schemas/ThemeSettings'
        resolved:
          $ref: '#/components/schemas/Theme'
    DeliveryFrame:
      type: object
      required: [id, type, settings]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: A frame type key; clients skip types they don't know (AD-5).
        settings:
          type: object
          additionalProperties: true
          description: >-
            The frame's settings, with every field the stored settings leave
            out filled with its default from the type's JSON Schema.
    DeliveryZone:
      type: object
      required: [id, name, slug, theme, frame, taleGroups]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: The zone's slug (epic UX rework R1).
        theme:
          $ref: '#/components/schemas/Theme'
          description: >-
            The zone's project theme (R9), every field filled with TaleArt's
            default where the project sets none.
        frame:
          description: >-
            The zone's display (AD-17), or null when it has none; a zone
            without a display lists no tale group.
          oneOf:
            - $ref: '#/components/schemas/DeliveryFrame'
            - type: 'null'
        taleGroups:
          type: array
          description: >-
            The published tale groups placed in the zone, in this zone's order
            (AD-2, AD-14); the display shows all of them.
          items:
            $ref: '#/components/schemas/DeliveryTaleGroup'
    DeliveryTaleGroup:
      type: object
      required: [id, name, cover, tales, tags, tagMatch]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tags:
          type: array
          description: >-
            The names of the group's targeting tags, ignoring case by name
            (epic targeting R2); empty when the group has none. The SDK
            compares them with the viewer's tags (AD-13); every viewer gets
            the same list.
          items:
            type: string
        tagMatch:
          $ref: '#/components/schemas/TagMatch'
        userListMatched:
          type: boolean
          description: >-
            True when the group is targeted to user lists and the viewer's
            external user ID (header `X-TaleArt-External-User-Id`) is in one of
            them (epic targeting R4); left out otherwise. A group targeted to
            lists the viewer is in none of is not in the response at all, so
            the SDK never needs the lists.
        cover:
          description: >-
            The group's cover, or null when it has none; the bar then shows
            its first tale's lowest media element (the document's media
            background, else its first image or video element), or, when that
            tale has no media, its canvas colour (epic Tale Studio R16).
          oneOf:
            - $ref: '#/components/schemas/DeliveryCover'
            - type: 'null'
        tales:
          type: array
          description: The group's published tales by position.
          items:
            $ref: '#/components/schemas/DeliveryTale'
    DeliveryTale:
      type: object
      required: [id, title, media, document]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        media:
          description: >-
            The tale's image, GIF or video, or null when it has none. Kept
            for SDKs from before documents: the document holds the same media
            as its `taleMedia` element (epic Tale Studio R16), and current
            SDKs render only the document.
          oneOf:
            - $ref: '#/components/schemas/DeliveryMedia'
            - type: 'null'
        document:
          description: >-
            The tale's document (AD-15) as SDKs render it. Every delivered
            tale has one (epic Tale Studio R16): a tale whose media is not
            yet in its published document gets it composed in, and a tale
            with neither gets an empty one. Null only from servers before
            R16.
          oneOf:
            - $ref: '#/components/schemas/DeliveryTaleDocument'
            - type: 'null'
        fonts:
          type: array
          description: >-
            The project fonts the document's visible text uses (epic Tale
            Studio R18), left out when it uses none. SDKs fetch them only when
            the tale opens.
          items:
            $ref: '#/components/schemas/DeliveryFont'
    DeliveryFont:
      type: object
      required: [id, family, url, weight, style]
      properties:
        id:
          type: string
          format: uuid
          description: The font id a text's `font.fontId` names.
        family:
          type: string
          description: >-
            The face's family name as the project stores it (spaces collapsed). The
            Web SDK draws the face under its id's alias and does not use it; native
            SDKs, which do not download project fonts, draw the text in a font the
            host app installed under this family name, else its fallback stack.
        url:
          type: string
          format: uri
          description: The public `font/woff2` URL of the file (AD-11), open to any origin.
        weight:
          type: integer
        style:
          type: string
          enum: [normal, italic]
    DeliveryTaleDocument:
      type: object
      description: >-
        A tale document as delivered (AD-15): hidden elements are removed, and
        so are the editor-only fields `hidden` and `locked`. Clients ignore
        fields they do not know and skip element types they do not know.
      required: [version, canvas, elements]
      properties:
        version:
          type: integer
        canvas:
          $ref: '#/components/schemas/DeliveryCanvas'
        durationMs:
          type: integer
        placeholder:
          type: boolean
          description: >-
            True only on the document the Delivery API makes for a tale with
            neither media nor a document (epic Tale Studio R16): viewers paint
            its colour across the whole stage, as such a tale always showed.
        elements:
          type: array
          description: The visible elements, first at the bottom of the z-order.
          items:
            $ref: '#/components/schemas/DeliveryTaleElement'
    DeliveryTaleElement:
      type: object
      required: [id, type, box, a11y, props]
      properties:
        id:
          type: string
        type:
          type: string
          description: >-
            A key of the element-type registry, such as `text`, `image`,
            `video`, `shape`, `emoji`, `sticker`, `button`, `image-button`,
            `swipe-up`, `poll`, `rating` or `quiz`.
        box:
          $ref: '../tale-document/v1.schema.json#/$defs/Box'
        a11y:
          $ref: '../tale-document/v1.schema.json#/$defs/A11y'
        props:
          type: object
          description: >-
            The type's props, as its schema in `tale-document/element-types/`
            defines them, except that an image's, video's, image sticker's
            or image button's `mediaKey` is replaced by `url`, its public URL
            (AD-11). A link's destination stays `href`.
    TaleDocument:
      $ref: '../tale-document/v1.schema.json'
    TextElementProps:
      $ref: '../tale-document/element-types/text.schema.json'
    ImageElementProps:
      $ref: '../tale-document/element-types/image.schema.json'
    VideoElementProps:
      $ref: '../tale-document/element-types/video.schema.json'
    ShapeElementProps:
      $ref: '../tale-document/element-types/shape.schema.json'
    EmojiElementProps:
      $ref: '../tale-document/element-types/emoji.schema.json'
    StickerElementProps:
      $ref: '../tale-document/element-types/sticker.schema.json'
    ButtonElementProps:
      $ref: '../tale-document/element-types/button.schema.json'
    ImageButtonElementProps:
      $ref: '../tale-document/element-types/image-button.schema.json'
    SwipeUpElementProps:
      $ref: '../tale-document/element-types/swipe-up.schema.json'
    PollElementProps:
      $ref: '../tale-document/element-types/poll.schema.json'
    RatingElementProps:
      $ref: '../tale-document/element-types/rating.schema.json'
    QuizElementProps:
      $ref: '../tale-document/element-types/quiz.schema.json'
    ChoiceCount:
      type: object
      required: [id, count, percent]
      properties:
        id:
          type: string
          description: The choice's id (a poll's option id, a quiz's answer id).
        count:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            The choice's share of the votes as a whole percentage; the shares
            add up to 100 when there is a vote, and are 0 without one.
    ChoiceResult:
      type: object
      description: >-
        A choice component's result, over the choices its published document
        holds now, in their order.
      required: [total, choices]
      properties:
        total:
          type: integer
          minimum: 0
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceCount'
    RatingResult:
      type: object
      description: >-
        A Rating's result (epic interactive components R5): how many visitors
        rated it, and the average of their ratings.
      required: [total, average]
      properties:
        total:
          type: integer
          minimum: 0
        average:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            The ratings' mean on the 0 to 100 scale, rounded to a whole
            number (half up); 0 without a rating.
    InteractiveResponseRequest:
      type: object
      additionalProperties: false
      required: [taleId, elementId, value]
      properties:
        taleId:
          type: string
          format: uuid
        elementId:
          type: string
          format: uuid
        value:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The response, such as a poll's option id, a quiz's answer id or
            a Rating's whole number from 0 to 100 (`80`).
        clientAt:
          type: string
          format: date-time
          description: When the visitor responded, by the device's clock.
    InteractiveResponse:
      type: object
      required: [elementId, value, recorded, result]
      properties:
        elementId:
          type: string
          format: uuid
        value:
          type: string
          description: The visitor's stored response; on a repeat, the first one.
        recorded:
          type: boolean
          description: True when this request recorded it; false for a repeat.
        result:
          description: >-
            The component's result now: a poll's or a quiz's counts and
            percentages per choice, or a Rating's count and average.
          oneOf:
            - $ref: '#/components/schemas/ChoiceResult'
            - $ref: '#/components/schemas/RatingResult'
    ElementResponseCounts:
      type: object
      required: [elementId, elementType, total, values]
      properties:
        elementId:
          type: string
          format: uuid
        elementType:
          type: string
          description: The element's type when its responses were recorded, such as `poll`.
        total:
          type: integer
          minimum: 0
        values:
          type: array
          description: The number of responses per stored value, most first.
          items:
            type: object
            required: [value, count]
            properties:
              value:
                type: string
              count:
                type: integer
                minimum: 1
    TaleResponses:
      type: object
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementResponseCounts'
    MediaBackground:
      $ref: '../tale-document/v1.schema.json#/$defs/MediaBackground'
    ColorBackground:
      $ref: '../tale-document/v1.schema.json#/$defs/ColorBackground'
    DeliveryCanvas:
      type: object
      description: >-
        The canvas as delivered: a colour background as stored; a media
        background with its storage key replaced by the public `url` (AD-11).
      required: [background]
      properties:
        background:
          oneOf:
            - $ref: '../tale-document/v1.schema.json#/$defs/ColorBackground'
            - $ref: '#/components/schemas/DeliveryMediaBackground'
    DeliveryMediaBackground:
      type: object
      required: [type, url, fit, color]
      properties:
        type:
          type: string
          enum: [media]
        url:
          type: string
          format: uri
          description: The public URL of the image (AD-11).
        fit:
          type: string
          enum: [cover, contain]
        color:
          type: string
          description: The band colour, as `#RRGGBB` or `#RRGGBBAA`.
    ProjectMedia:
      type: object
      description: >-
        An image or video of a project (epic Tale Studio R5): one of its
        uploads, a tale's media, or media its tales' documents use. A tale
        document references it by `key`.
      required: [key, kind, contentType, url, source]
      properties:
        key:
          type: string
          description: The storage key a document's `mediaKey` names.
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          description: Where the Management API serves the file, with a session.
        source:
          type: string
          enum: [upload, tale, document]
          description: >-
            `upload` for a file uploaded to the project's media, `tale` for a
            tale's media, `document` for media only documents use.
        taleTitle:
          type: string
          description: For `tale`, the title of a tale holding it.
        sizeBytes:
          type: integer
          description: For `upload`, the file's size.
        createdAt:
          type: string
          format: date-time
          description: For `upload`, when it was uploaded.
    ProjectFont:
      type: object
      description: A font face uploaded to a project (epic Tale Studio R18).
      required: [id, projectId, family, weight, style, fallback, sizeBytes, licenceConfirmedBy, licenceConfirmedAt, inUse]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        family:
          type: string
          description: The family name people read; never used as a CSS name.
        weight:
          type: integer
          minimum: 100
          maximum: 900
        style:
          type: string
          enum: [normal, italic]
        fallback:
          type: string
          enum: [sans, serif, rounded, monospace]
        sizeBytes:
          type: integer
        licenceConfirmedBy:
          type: object
          description: Who uploaded the font and confirmed they may use and distribute it.
          required: [id, name]
          properties:
            id:
              type: [string, 'null']
              format: uuid
            name:
              type: string
        licenceConfirmedAt:
          type: string
          format: date-time
        inUse:
          type: boolean
          description: >-
            True while a tale's draft or published document uses the font,
            which then cannot be deleted.
    TaleDocumentRevision:
      type: object
      required: [document, revision, published]
      properties:
        document:
          description: The tale's draft document, the one Tale Studio edits, or null when it has none.
          oneOf:
            - $ref: '#/components/schemas/TaleDocument'
            - type: 'null'
        revision:
          type: integer
          minimum: 0
          description: The draft's revision, raised by one on every save; 0 before the first save.
        published:
          $ref: '#/components/schemas/PublishedTaleDocument'
    TaleStatusResult:
      description: A tale as a status change answers it.
      allOf:
        - $ref: '#/components/schemas/Tale'
        - type: object
          properties:
            draftNotPublished:
              type: boolean
              description: >-
                Present and true when the tale went live with nothing published yet and its draft
                document no longer passes the checks, so the draft was not published (AD-15).
            draftNotPublishedReason:
              type: string
              description: >-
                With `draftNotPublished`, why the draft was not published, such as an image
                without alt text, named as Tale Studio names it.
    PublishedTaleDocument:
      type: object
      required: [document, revision]
      properties:
        document:
          description: The published document, the one the Delivery API serves, or null when none is published.
          oneOf:
            - $ref: '#/components/schemas/TaleDocument'
            - type: 'null'
        revision:
          type: integer
          minimum: 0
          description: Raised by one on every publish; 0 before the first.
    TaleDocumentRevisionsRequest:
      type: object
      required: [revision, publishedRevision]
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The draft revision the request is based on.
        publishedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The published revision the request is based on.
    SaveTaleDocumentRequest:
      type: object
      required: [document, revision]
      properties:
        document:
          $ref: '#/components/schemas/TaleDocument'
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The revision this document was based on, as the last read or save returned it.
        sawTaleMedia:
          type: boolean
          description: >-
            True when the document the editor loaded held the tale's own media
            (its `taleMedia` element, epic Tale Studio R16). The server then
            takes the saved document as the person's choice: when it lacks
            that element the person removed it, and it is not composed back.
            False or absent from an editor that never saw it (one opened before
            the media was put in the documents): the media stays composed in.
    CopyTaleDocumentRequest:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/TaleDocument'
        sawTaleMedia:
          type: boolean
          description: >-
            True when the document the editor loaded held the tale's own media
            (its `taleMedia` element, epic Tale Studio R16). The server then
            takes the saved document as the person's choice: when it lacks
            that element the person removed it, and it is not composed back.
            False or absent from an editor that never saw it (one opened before
            the media was put in the documents): the media stays composed in.
    DeliveryMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        url:
          type: string
          format: uri
          description: >-
            Absolute, public and unguessable URL of the file, such as
            `https://api.example.com/media/tales/<uuid>.png`. Needs no key (AD-11).
    DeliveryCover:
      type: object
      required: [kind, contentType, animated, url]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        contentType:
          $ref: '#/components/schemas/MediaContentType'
        animated:
          type: boolean
          description: >-
            True when the cover moves (a video, a GIF, an animated WebP or an
            APNG); clients show it still when the visitor prefers reduced motion.
        url:
          type: string
          format: uri
          description: >-
            Absolute, public and unguessable URL of the file, such as
            `https://api.example.com/media/covers/<uuid>.webm`. Needs no key (AD-11).
    UserRole:
      type: string
      enum: [admin, content_manager]
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    AuthState:
      type: object
      required: [setupRequired, user]
      properties:
        setupRequired:
          type: boolean
          description: True while no user exists; the dashboard then shows the setup screen.
        user:
          description: The signed-in user, or null without a valid session.
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    SetupRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    RedeemInvitationRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    Invitation:
      type: object
      required: [id, projectId, url, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        url:
          type: string
          description: The one-time link to share, `<dashboard origin>/invite/<token>`. Shown only once.
        expiresAt:
          type: string
          format: date-time
    InvitationPreview:
      type: object
      required: [projectName, expiresAt]
      properties:
        projectName:
          type: string
        expiresAt:
          type: string
          format: date-time
    SignedIn:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    PasskeyCreationOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialCreationOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyRequestOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialRequestOptionsJSON`, passed to the browser as is.
      properties:
        challenge:
          type: string
    PasskeyResponse:
      type: object
      required: [id]
      additionalProperties: true
      description: >-
        The authenticator's answer as WebAuthn JSON (`RegistrationResponseJSON`
        or `AuthenticationResponseJSON`), sent as the browser produced it.
      properties:
        id:
          type: string
    FindStorylyAppsRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: A Storyly API token. Used for this call only; never stored.
    StorylyApp:
      type: object
      required: [id, name]
      description: An app of the Storyly account, as the import source.
      properties:
        id:
          type: string
        name:
          type: string
    StartImportRequest:
      type: object
      required: [token, appId]
      properties:
        token:
          type: string
          minLength: 1
          description: The Storyly API token; stored encrypted only while the job is queued or running.
        appId:
          type: string
          minLength: 1
          description: The id of the Storyly app to import, from the apps list.
        selection:
          $ref: '#/components/schemas/ImportSelection'
    ImportPreviewRequest:
      type: object
      required: [token, appId]
      properties:
        token:
          type: string
          minLength: 1
          description: A Storyly API token. Used for this call only; never stored.
        appId:
          type: string
          minLength: 1
          description: The id of the Storyly app, from the apps list.
    ImportPreviewZone:
      type: object
      required: [id, name, taleGroups, tales]
      description: A Storyly instance of the app, which an import makes a zone.
      properties:
        id:
          type: string
          description: The instance's id at the source.
        name:
          type: string
        taleGroups:
          type: [integer, 'null']
          description: How many story groups the instance lists; null when they were not counted.
        tales:
          type: [integer, 'null']
          description: How many stories its story groups list; null when they were not all counted.
    ImportPreview:
      type: object
      required: [appId, appName, zones, zonesBeyond, countsComplete, selectionKey, expiresAt]
      description: What an app holds, to pick what to import. Holds no token.
      properties:
        appId:
          type: string
        appName:
          type: string
        zones:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ImportPreviewZone'
        zonesBeyond:
          type: integer
          minimum: 0
          description: How many more instances the app has than are listed; they cannot be picked.
        countsComplete:
          type: boolean
          description: False when some counts were not read (null), to keep the preview short.
        selectionKey:
          type: string
          description: Proves which zones this preview listed; a start with a selection carries it.
        expiresAt:
          type: string
          format: date-time
          description: When the selection key stops being accepted.
    ImportEntityChoice:
      type: string
      enum: [taleGroups, media, tags]
      description: >-
        An entity type an import may leave out: tale groups and tales, tale media, or labels as tags. Zones are
        always imported, the picked ones.
    ImportSelection:
      type: object
      required: [selectionKey, zones, taleGroups, media, tags]
      description: What to import. Media and tags need tale groups.
      properties:
        selectionKey:
          type: string
          minLength: 1
          description: The preview's selection key.
        zones:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: The source ids of the zones (instances) to import, all listed by the preview.
          items:
            type: string
            minLength: 1
        taleGroups:
          type: boolean
          description: Import story groups as tale groups and stories as tales.
        media:
          type: boolean
          description: Copy tale media.
        tags:
          type: boolean
          description: Import labels as tags.
    ImportNotSelectedZone:
      type: object
      required: [sourceId, name]
      properties:
        sourceId:
          type: string
        name:
          type: string
    ImportNotSelected:
      type: object
      required: [zones, entities]
      description: What the import left out because it was not picked.
      properties:
        zones:
          type: array
          maxItems: 500
          description: The zones not picked (at most 500 listed; zones.notSelected counts them all).
          items:
            $ref: '#/components/schemas/ImportNotSelectedZone'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/ImportEntityChoice'
    ImportStatus:
      type: string
      enum: [queued, running, done, failed]
    ImportStarted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
    ImportCount:
      type: object
      required: [source, imported, skipped]
      description: How many records the source had, how many are in TaleArt now, and how many were skipped.
      properties:
        source:
          type: integer
        imported:
          type: integer
        skipped:
          type: integer
        notSelected:
          type: integer
          minimum: 0
          description: How many of the skipped were left out because they were not picked. Absent when none were.
    ImportReport:
      type: object
      required: [zones, notes]
      properties:
        zones:
          $ref: '#/components/schemas/ImportCount'
        taleGroups:
          $ref: '#/components/schemas/ImportCount'
          description: Story groups as tale groups. Absent in reports of imports made before tale groups were imported.
        tales:
          $ref: '#/components/schemas/ImportCount'
          description: Stories as tales. Absent in reports of imports made before tales were imported.
        media:
          $ref: '#/components/schemas/ImportCount'
          description: >-
            Tale media: the imported tales whose story names media, how many hold it now, and how many do not
            (each listed as a difference or a note). Absent in reports of imports made before media was copied.
        tags:
          $ref: '#/components/schemas/ImportCount'
          description: >-
            Labels as tags, counted per occurrence: every label read (each entry of the labels list and each value
            of a story group's segments), how many are carried by a tag of the project now, and how many are not.
            Each skipped label is listed as a difference, counted in differencesOmitted when its record or the
            report is full, or counted in a note (a repeated list record, or a label past an import limit). Absent
            in reports of imports made before labels were imported.
        notes:
          type: array
          description: What did not come across, such as "frame type unknown" for each zone or a skipped tale.
          items:
            type: string
        differences:
          type: array
          description: >-
            Each difference between a source record and the shape the import expects, or a field TaleArt
            does not hold, in reading order, once per record. Holds field names, never field values. Absent
            in reports of imports made before records were checked.
          items:
            $ref: '#/components/schemas/ImportDifference'
        differencesOmitted:
          type: integer
          minimum: 0
          description: How many more differences were found than the report stores.
        unreadableLayers:
          type: integer
          minimum: 0
          description: >-
            How many imported tales may hold text, stickers and components the source's API does not expose, so
            they were not imported (Tale Studio R17): each imported tale, listed once per report as a count, not
            as differences. Absent when no tale was imported.
        notImportedByDesign:
          type: array
          description: What the import never brings across, listed once, such as conversion records and stats.
          items:
            type: string
        notSelected:
          $ref: '#/components/schemas/ImportNotSelected'
          description: What was left out because it was not picked. Absent when the import took everything.
        changes:
          $ref: '#/components/schemas/ImportChanges'
        elapsedSeconds:
          type: integer
          minimum: 0
          description: >-
            How long the import took, in seconds: from the first time a worker started it to its end, over every
            run of it when a stopped worker's job ran again. Absent in reports of imports made before it was recorded.
    ImportChangeCount:
      type: object
      required: [created, updated, unchanged, keptLocalEdit, removedAtSource]
      description: >-
        What one import changed in TaleArt for one entity type. created + updated + unchanged is the imported
        count. keptLocalEdit counts records (or tale media) where a value changed at the source was not written
        because a person had changed it in TaleArt; they are also counted updated or unchanged (media: skipped).
        removedAtSource counts records an earlier import of the same app brought across that the source no
        longer lists; they stay in TaleArt.
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        keptLocalEdit:
          type: integer
        removedAtSource:
          type: integer
    ImportChanges:
      type: object
      required: [zones, taleGroups, tales]
      description: >-
        Per entity type, what this import created, updated or left unchanged in TaleArt. Absent in reports of
        imports made before re-imports updated records.
      properties:
        zones:
          $ref: '#/components/schemas/ImportChangeCount'
        taleGroups:
          $ref: '#/components/schemas/ImportChangeCount'
        tales:
          $ref: '#/components/schemas/ImportChangeCount'
        media:
          $ref: '#/components/schemas/ImportChangeCount'
    ImportDifferenceEntity:
      type: string
      enum: [app, zone, taleGroup, tale, tag]
      description: What the source record becomes in TaleArt (the app is the project; a label is a tag).
    ImportDifferenceKind:
      type: string
      enum: [missing, renamed, unexpected, wrongType, notHeld, invalidRecord, mediaNotImported, tagNotImported, keptLocalEdit, removedAtSource, movedAtSource, linkNotImported]
      description: >-
        missing: a field the import needs is absent; renamed: an expected field came under another name;
        unexpected: a field the import does not know; wrongType: a needed field is empty or of the wrong
        type; notHeld: a field with a value TaleArt does not hold; invalidRecord: the record could not be
        read and was skipped; mediaNotImported: the record's media could not be copied, so it was imported
        without it (see reason); tagNotImported: a label could not become a tag, so it was skipped (see reason);
        keptLocalEdit: the field changed at the source, but a person had changed it in TaleArt, so their value
        was kept; removedAtSource: an earlier import brought the record (or label) across and the source no
        longer lists it, so it stays in TaleArt unchanged (listed again on every run while it is there);
        movedAtSource: the source lists the record under another parent than the one the import put it in;
        an import moves nothing, so it stays where it is; linkNotImported: a story's link (outlink or deep_link)
        is not a web address a tale's button may open, so it was not imported (see reason).
    ImportLinkFailure:
      type: string
      enum: [scheme, tooLong, characters, invalid, credentials]
      description: >-
        Why a story's link was not imported, by the rule every tale link follows (AD-15). scheme: not an
        http or https address (an app link such as myapp://, or javascript:); tooLong: over 2,048 characters;
        characters: it holds spaces or control characters; invalid: not an address a browser reads, or one
        without a host; credentials: it holds a user name or password.
    ImportTagFailure:
      type: string
      enum: [blank, tooLong, notText, invalidCharacters]
      description: >-
        Why a label did not become a tag. blank: it holds no text; tooLong: longer than a tag name may be;
        notText: the value is not text; invalidCharacters: it holds control characters, which a tag name may not.
    ImportMediaFailure:
      type: string
      enum: [invalidUrl, blockedAddress, unreachable, timeout, tooManyRedirects, httpError, tooLarge, unsupportedType, jobBudgetExceeded]
      description: >-
        Why media was not copied. invalidUrl: not an http or https URL; blockedAddress: it leads to a private,
        loopback, link-local or otherwise non-public address; unreachable: no connection or the transfer
        broke off; timeout: it took too long; tooManyRedirects: more redirects than allowed; httpError: the
        media host answered an error status; tooLarge: over the size limit of its type; unsupportedType: not
        an accepted image or video type, or its bytes do not match the type; jobBudgetExceeded: the import
        had already copied as many bytes, or spent as long on media, as one import may.
    ImportDifferenceRecord:
      type: object
      required: [sourceId, name, within, withinSourceId, position]
      description: The source record a difference belongs to.
      properties:
        sourceId:
          type: [string, 'null']
          description: The record's id at the source; null when it has none.
        name:
          type: [string, 'null']
          description: The record's title at the source, if it has one.
        within:
          type: [string, 'null']
          description: The title of the record it belongs to, such as a story's group; null for top-level records.
        withinSourceId:
          type: [string, 'null']
          description: The source id of the record it belongs to; null for top-level records.
        position:
          type: [integer, 'null']
          minimum: 1
          description: The record's place in its source list, from 1; null for a record the source no longer lists.
    ImportDifference:
      type: object
      required: [entity, record, kind, field, sourceField]
      properties:
        entity:
          $ref: '#/components/schemas/ImportDifferenceEntity'
        record:
          $ref: '#/components/schemas/ImportDifferenceRecord'
        kind:
          $ref: '#/components/schemas/ImportDifferenceKind'
        field:
          type: [string, 'null']
          description: The field name the import expects (or the unexpected one); null for an invalid record.
        sourceField:
          type: [string, 'null']
          description: For a rename, the name the source used; null otherwise.
        reason:
          description: >-
            For mediaNotImported, why the media was not copied; for tagNotImported, why the label did not become
            a tag; for linkNotImported, why the link was refused; absent otherwise. The lists share some values
            (such as tooLong), so any of them matches.
          anyOf:
            - $ref: '#/components/schemas/ImportMediaFailure'
            - $ref: '#/components/schemas/ImportTagFailure'
            - $ref: '#/components/schemas/ImportLinkFailure'
    ImportProgressCount:
      type: object
      required: [read, written]
      description: Records read from the source so far, and records in TaleArt so far (already linked ones included).
      properties:
        read:
          type: integer
        written:
          type: integer
    ImportProgress:
      type: object
      required: [zones, taleGroups, tales]
      description: How far a job got, per entity type; updated while it runs.
      properties:
        notSelected:
          type: array
          description: >-
            The entity types this import leaves out because they were not picked; their counts stay 0. Absent when
            the import takes everything.
          items:
            $ref: '#/components/schemas/ImportEntityChoice'
        zones:
          $ref: '#/components/schemas/ImportProgressCount'
        taleGroups:
          $ref: '#/components/schemas/ImportProgressCount'
        tales:
          $ref: '#/components/schemas/ImportProgressCount'
    ImportJobSummary:
      type: object
      required: [id, status, sourceAppName, error, createdAt, startedAt, finishedAt]
      description: An import job in the project's list of imports, without its report.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        sourceAppName:
          type: [string, 'null']
          description: The source app's name, once the worker has read it.
        error:
          type: [string, 'null']
          description: Why the job failed; null unless the status is failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When a worker last started the job; null while it waits in the queue.
        finishedAt:
          type: [string, 'null']
          format: date-time
    ImportJob:
      type: object
      required: [id, status, sourceAppName, report, progress, error, createdAt, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        sourceAppName:
          type: [string, 'null']
          description: The source app's name, once the worker has read it.
        report:
          oneOf:
            - $ref: '#/components/schemas/ImportReport'
            - type: 'null'
        progress:
          description: How far the job got; null until a worker has started it.
          oneOf:
            - $ref: '#/components/schemas/ImportProgress'
            - type: 'null'
        error:
          type: [string, 'null']
          description: Why the job failed; null unless the status is failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When a worker last started the job; null while it waits in the queue.
        finishedAt:
          type: [string, 'null']
          format: date-time
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - project_not_found
        - not_found
        - zone_not_found
        - unknown_frame_type
        - invalid_frame_settings
        - invalid_theme
        - display_not_found
        - display_exists
        - slug_taken
        - tale_group_not_found
        - tale_group_full
        - tale_group_limit_reached
        - tale_not_found
        - order_mismatch
        - media_not_found
        - unsupported_media_type
        - media_too_large
        - unauthenticated
        - setup_closed
        - passkey_failed
        - forbidden
        - invitation_invalid
        - email_taken
        - tag_exists
        - tag_not_found
        - site_key_not_found
        - site_key_exists
        - invalid_site_key
        - api_token_not_found
        - api_token_limit_reached
        - rate_limited
        - storyly_token_invalid
        - storyly_unavailable
        - importer_not_configured
        - import_selection_invalid
        - preview_busy
        - invalid_status_transition
        - tale_group_archived
        - unknown_template
        - concurrent_change
        - invalid_tale_document
        - tale_document_too_large
        - stale_revision
        - nothing_to_publish
        - font_not_found
        - font_exists
        - font_in_use
        - font_limit_reached
        - font_storage_full
        - media_limit_reached
        - media_storage_full
        - upload_busy
        - length_required
        - response_target_not_found
        - visitor_id_required
        - user_list_not_found
        - user_list_exists
        - user_list_limit_reached
        - user_list_file_too_large
        - internal_error
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            pointer:
              type: string
              description: >-
                For `invalid_tale_document`: the JSON pointer (RFC 6901) of the
                document field that was refused, such as `/elements/0/box/x`.
