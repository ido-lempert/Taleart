      description: >-
        Calls the Storyly External API with the token and answers its apps. The
        token is not stored and no job is created. A token Storyly refuses
        answers 400 `storyly_token_invalid`; Storyly unreachable or answering an
        unexpected shape 502 `storyly_unavailable`. Without `IMPORT_TOKEN_KEY`
        the importer answers 503 `importer_not_configured`. A content manager
        gets 403 `forbidden`; an unknown project 404 `project_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindStorylyAppsRequest'
      responses:
        '200':
          description: The token's apps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorylyApp'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports/storyly/preview:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: previewStorylyApp
      summary: Show what a Storyly app holds before importing it (admins only).
      description: >-
        Reads the app's instances (zones) with their story group and story counts through the Storyly External
        API, so the admin can pick what to import. The token is used for this call only: it is not stored and no
        job is created. At most 500 zones are listed (`zonesBeyond` counts the rest); counting reads at most 100
        lists in at most 20 seconds, and a zone whose counts were not read has null counts. The whole preview
        takes at most 30 seconds, and its reads stop when the caller goes away. One preview runs per person and
        four per server at a time; another answers 429 `preview_busy`. The answer's
        `selectionKey` names the zones listed and is valid for 30 minutes: a start with a selection must carry
        it. A token Storyly refuses answers 400 `storyly_token_invalid`; an app the token cannot read 400
        `import_selection_invalid`; Storyly unreachable, or its app or instance list unreadable, 502
        `storyly_unavailable`. A content manager gets 403 `forbidden`; an unknown project 404
        `project_not_found`; without `IMPORT_TOKEN_KEY` 503 `importer_not_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '200':
          description: The app's zones with their counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listImports
      summary: List the project's imports, newest first (admins only).
      description: >-
        The project's import jobs, newest first, at most 50, with their state,
        times and failure reason; the report is read per job. A content manager
        gets 403 `forbidden`; an unknown project 404 `project_not_found`;
        without `IMPORT_TOKEN_KEY` 503 `importer_not_configured`.
      responses:
        '200':
          description: The project's imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJobSummary'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startImport
      summary: Start importing a Storyly app into the project (admins only).
      description: >-
        Stores a queued import job and answers at once (AD-8); a background
        worker runs it. The token is stored encrypted with the job only until
        the job ends. Without `selection` everything is imported; with it, only
        the picked zones and entity types; `selection: null` is refused as
        malformed. A selection whose key is invalid,
        expired or for another project, app or person, that names a zone the
        key does not, or that asks for media or tags without tale groups,
        answers 400 `import_selection_invalid` and creates no job; a malformed
        one 400 `validation_failed`. A content manager gets 403 `forbidden`; an unknown project
        404 `project_not_found`; without `IMPORT_TOKEN_KEY` 503
        `importer_not_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImportRequest'
      responses:
        '202':
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStarted'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/imports/{importId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: importId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getImport
      summary: Read an import job, its state, progress and report (admins only).
      description: >-
        Poll it while the job is queued or running to follow its progress. A job of another project, or none, answers 404 `not_found`. A content
        manager gets 403 `forbidden`; without `IMPORT_TOKEN_KEY` 503
        `importer_not_configured`.
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones:
    get:
      operationId: listZones
      summary: List the zones of the projects the caller can access, oldest first.
      responses:
        '200':
          description: The accessible zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZone
      summary: Create a zone in a project, from a template or without a display.
      description: >-
        `template` is optional: a template with a display gives the new zone
        that display with its preset settings in the same transaction, so a
        refused display leaves no zone; its key is recorded as the zone's
        `createdFromTemplate` note. A key not in the template registry answers
        400 `unknown_template` and nothing is created.
        `slug` is optional: when missing, it is made from the name (lowercase
        ASCII letters and digits joined by hyphens; `zone` when the name has
        none, as a Hebrew name has none) and made unique in the project with
        `-2`, `-3`. A given slug must be lowercase letters and digits, words
        joined by single hyphens, at most 64 characters (400
        `validation_failed`), and free in the project (409 `slug_taken`). A
        blank name answers 400 `validation_failed`; a project that does not
        exist 400 `project_not_found`; a project the caller cannot access 403
        `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /install:
