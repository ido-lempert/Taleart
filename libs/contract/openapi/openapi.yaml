      responses:
        '201':
          description: The zone's display.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateZoneFrame
      summary: Change the type or the settings of a zone's display.
      description: >-
        A new `type` changes the display's frame type and resets its settings
        to that type's defaults, unless `settings` is given too. `settings`
        replaces the settings and is validated against the JSON Schema of the
        display's (new) type (AD-5): an invalid value answers 400
        `invalid_frame_settings` naming the field, and nothing is stored. A
        body with neither answers 400 `validation_failed`. The display keeps
        its id, so events keep their `frame_id` (AD-10). Unknown zone: 404
        `zone_not_found`; a zone without a display: 404 `display_not_found`.
        When another change switches the display's type meanwhile, the change
        is checked again against the new type once, then refused with 409
        `concurrent_change`; nothing is stored and it can be tried again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFrameRequest'
      responses:
        '200':
          description: The display as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zone:
    servers:
      - url: /delivery/v1
        description: Delivery API (AD-2), for SDKs. Accepts site keys only.
    get:
      operationId: getDeliveryZone
      summary: A zone, named by site key and slug, with its display and tale groups (Delivery API).
      description: >-
        Served under `/delivery/v1`. Accepts only the project's site key
        (`tas_...`) in `Authorization: Bearer <key>`, never a session, and
        answers the project's zone whose slug the `zone` query parameter
        names (epic UX rework R3). Every refusal (a missing, unknown or
        revoked site key, any other key, a missing slug, or a slug no zone of
        the key's project has) answers the same 401 `invalid_site_key` body,
        so a caller cannot tell an unknown slug from a refused key. A 401 is sent with
        `Cache-Control: no-store`. Every Delivery API request counts against
        its visitor's token bucket (by default 600 at once, 20 per second),
        the visitor named by the `X-TaleArt-Visitor` header; a request
        without a valid visitor id counts against a bucket of the same size
        for its address (an IPv4 address or an IPv6 /48). Every request also
        counts against its address's backstop, ten times that size, so a
        client inventing ids gains no more than ten visitors' allowance (epic
        UX rework 8.23). Over either the API answers 429 `rate_limited` with
        `Retry-After`. CORS is open to any origin, without credentials, and
        allows the `X-TaleArt-Visitor` and `X-TaleArt-External-User-Id` headers. Tale groups and their tales come in dashboard
        order; only `live` groups and tales whose start and end times, and
        their group's, contain the current time are listed (AD-6); each
        tale's media URL is absolute and public (AD-11). A group targeted to
        user lists is listed only when the external user ID header names an
        ID in one of them (epic targeting R4). Without that header the zone
        is cached as `private, no-cache`, varies by `Authorization` and
        `X-TaleArt-External-User-Id` and carries an ETag, so a browser
        revalidates it on every load (304 while unchanged) and sees a change
        at once (NFR-006). With the header (even one that reads as no ID) the
        answer is `private, no-store`, with no ETag and never a 304, so no
        cache keeps a per-viewer answer.
      security:
        - siteKey: []
      parameters:
        - name: zone
          in: query
          required: true
          description: >-
            The zone's slug (lowercase letters, digits and hyphens), sent with
            the project's site key, as a host page names it in `zone="..."`.
          schema:
            type: string
        - name: X-TaleArt-Visitor
          in: header
          required: false
          description: >-
            The visitor id: a random UUID v4 the SDK generates once per device
            and keeps there (the Web SDK in localStorage, the native SDK in its
            device store), with no personal data. Written all in lowercase or
            all in uppercase; anything else counts as no id. It is used only to
            rate limit per visitor.
          schema:
            type: string
            format: uuid
            pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9A-F]{8}-[0-9A-F]{4}-4[0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12})$'
        - name: X-TaleArt-External-User-Id
          in: header
          required: false
          description: >-
            The viewer's external user ID, set by the host page
            (`setExternalUserId`), for user-list targeting (epic targeting
            R4): base64url (RFC 4648 section 5, no padding) of the ID's UTF-8
            bytes, as `encodeExternalUserIdHeader` in the contract writes it.
            Never sent in the URL. The API decodes it, hashes it with the
            project's secret for the lookup and drops it: it is not logged,
            stored, put in analytics, or linked to the visitor id. A value
            that is not canonical base64url of UTF-8, or decodes to an ID a
            user list could not hold (blank, over 256 characters, a control
            character), reads as no ID.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,1366}$'
      responses:
        '200':
          description: The zone, its display, and its tale groups by position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '304':
          description: The client's copy, named by `If-None-Match`, is still current.
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /media/{key}:
    servers:
      - url: /
        description: Public media (AD-11). No session and no site key.
    parameters:
      - name: key
        in: path
        required: true
        description: >-
          The storage key of a published tale's media, a published tale
          group's cover or a project font a published tale uses, such as
          `tales/<uuid>.png`, `covers/<uuid>.webm` or `fonts/<uuid>.woff2`.
          It contains a slash, sent as is.
        schema:
          type: string
        allowReserved: true
    get:
      operationId: getPublicMedia
      summary: Read a published tale's media file, with no credentials.
      description: >-
        Serves only keys that a published tale (a `live` tale of a `live`
        group, each inside its start and end time, AD-6) currently
        references; any other key, including the key of replaced media or of
        draft, paused, archived, scheduled or expired content, answers
        404 `media_not_found` (AD-11). A tale group's cover is served while
        the group is delivered: `live`, inside its window, with at least one
        published tale. A project font (`fonts/<uuid>.woff2`, epic Tale
        Studio R18) is served as `font/woff2` while a published tale of a
        delivered group (`live`, in its window, placed in a zone) has a
        published document with a visible text that uses it; any other
        font key answers 404. The response carries the stored
        `Content-Type`, supports one byte range (206, or 416 when
        unsatisfiable) and is open to any origin. It is cached as `public,
        no-cache` with the key as ETag, so a client revalidates (304 while
        published) and sees the 404 as soon as the content is unpublished.
      security: []
      responses:
        '200':
          description: The media file.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
            font/woff2:
              schema: { type: string, contentMediaType: font/woff2 }
        '206':
          description: The requested byte range of the media file.
        '304':
          description: The client's copy, named by `If-None-Match`, is still current.
        '404':
          $ref: '#/components/responses/Error'
        '416':
          description: The requested range lies outside the file.
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listZoneTaleGroups
      summary: List the tale groups placed in a zone by position, each with its tales by position.
      responses:
        '200':
          description: The zone's tale groups, each with its position in this zone.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneTaleGroup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createZoneTaleGroup
      summary: Create a tale group and place it in a zone, after the zone's existing groups.
      description: >-
        The tale group belongs to the zone's project and gets one placement, at
        the end of this zone. A project holds at most 500 tale groups that
        are not archived: 409 `tale_group_limit_reached`, and nothing is
        created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaleGroupRequest'
      responses:
        '201':
          description: The created tale group, with no tales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups/order:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: orderZoneTaleGroups
      summary: Set the order of the tale groups placed in a zone.
      description: >-
        The list names every tale group placed in the zone exactly once;
        positions in this zone are rewritten to 0..n-1 in that order, and other
        zones keep their own order. A list that omits, repeats or adds an
        id answers 409 `order_mismatch`. Unknown zone: 404 `zone_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTaleGroupsRequest'
      responses:
        '200':
          description: The zone's tale groups in the new order, each with its tales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /zones/{zoneId}/tale-groups/{taleGroupId}:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: string
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: placeZoneTaleGroup
      summary: Place an existing tale group of the zone's project in the zone, after its groups.
      description: >-
        The group keeps its tales, tags and media; edits show in every zone it
        is placed in (AD-14). A group already placed here answers 200
        unchanged. A group that does not exist or belongs to another project
        answers 400 `tale_group_not_found`. An archived group not placed here
        yet answers 409 `tale_group_archived`: restore it first (epic UX rework
        R10). Unknown zone: 404 `zone_not_found`.
      responses:
        '200':
          description: The group was already placed here; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '201':
          description: The placed tale group, with its position in this zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTaleGroup'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeZoneTaleGroup
      summary: Remove a tale group from a zone.
      description: >-
        Deletes only this placement: the group, its tales and its other
        placements stay. The zone's remaining positions become 0..n-1. A group
        not placed here answers 404 `tale_group_not_found`; an unknown zone 404
        `zone_not_found`.
      responses:
        '204':
          description: The group is no longer placed in the zone.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tale-groups/{taleGroupId}:
    parameters:
      - name: taleGroupId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTaleGroup
      summary: Read one tale group with its tales.
      description: >-
        The group with its tales in order, its tags, the zones it is placed in,
        and the visibility of the group and each tale in any of those zones
        (epic UX rework R7), placed in a zone or not. The dashboard reads it to
        open a group that no zone lists, such as one placed in no zone (epic UX
        rework R11, R14). Unknown tale group: 404 `tale_group_not_found`.
      responses:
        '200':
          description: The tale group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaleGroup'
        '403':
