    post:
      operationId: createUserList
      summary: Create an empty user list in a project.
      description: >-
        Admins and content managers create lists. The name is trimmed and
        holds 1 to 100 characters and no control characters (400
        `validation_failed`); names are unique per project ignoring case (409
        `user_list_exists`); a project holds at most 100 lists (409
        `user_list_limit_reached`). Unknown project 404 `project_not_found`.
      requestBody:
