    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: previewanother toolApp
      summary: Show what a another tool app holds before importing it (admins only).
      description: >-
        Reads the app's instances (zones) with their story group and story counts through the another tool External
        API, so the admin can pick what to import. The token is used for this call only: it is not stored and no
        job is created. At most 500 zones are listed (`zonesBeyond` counts the rest); counting reads at most 100
        lists in at most 20 seconds, and a zone whose counts were not read has null counts. The whole preview
        takes at most 30 seconds, and its reads stop when the caller goes away. One preview runs per person and
        four per server at a time; another answers 429 `preview_busy`. The answer's
        `selectionKey` names the zones listed and is valid for 30 minutes: a start with a selection must carry
        it. A token another tool refuses answers 400 `another tool_token_invalid`; an app the token cannot read 400
        `import_selection_invalid`; another tool unreachable, or its app or instance list unreadable, 502
        `another tool_unavailable`. A content manager gets 403 `forbidden`; an unknown project 404
        `project_not_found`; without `IMPORT_TOKEN_KEY` 503 `importer_not_configured`.
      requestBody:
        required: true
        content:
