#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# The SDKs' version: mobile-sdk, android-sdk (Maven Central) and the Web SDK package.json, TaleartSdk.VERSION and
# Package.swift must all match it (the verifyTaleartVersions task, run by check and every publish task).
taleartVersion=0.1.0

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
