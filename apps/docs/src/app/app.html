<a class="skip-link" [attr.href]="skipHref()">Skip to content</a>
<header class="site-header">
  <a class="site-header__brand" routerLink="/"><img class="site-header__logo" src="logo.svg" width="28" height="28" alt="" />TaleArt docs</a>
</header>
<div class="layout">
  <nav class="side-nav" aria-label="Docs">
    @for (group of groups; track group.name) {
      <details class="side-nav__section" [open]="isOpen(group.name)" (toggle)="onToggle(group.name, $event)">
        <summary>{{ group.name }}</summary>
        <ul>
          @for (page of group.pages; track page.path) {
            <li>
              <a
                [routerLink]="'/' + page.path"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                >{{ page.label }}</a
              >
            </li>
          }
        </ul>
      </details>
    }
  </nav>
  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
