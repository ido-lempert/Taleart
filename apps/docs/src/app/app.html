<a class="skip-link" [attr.href]="skipHref()">Skip to content</a>
<header class="site-header">
  <a class="site-header__brand" routerLink="/"><img class="site-header__logo" src="logo.svg" width="28" height="28" alt="" />TaleArt docs</a>
</header>
<div class="layout">
  <nav class="side-nav" aria-label="Docs">
    <ul>
      @for (page of pages; track page.path; let i = $index) {
        @if (i === 0 || pages[i - 1].group !== page.group) {
          <li class="side-nav__group">{{ page.group }}</li>
        }
        <li>
          <a
            [routerLink]="'/' + page.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ page.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
