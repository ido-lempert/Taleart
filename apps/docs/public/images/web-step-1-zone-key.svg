<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>The Install tab issues the zone key once</title>
  <desc>A schematic of the zone page's Install tab: the zone is selected, an Issue zone key button is pressed, and the new key appears once with a Copy button.</desc>
  <style>
    .ink { fill: #1d1d1f; }
    .muted { fill: #6e6e73; }
    .line { stroke: #c7c7cc; fill: none; }
    .card { fill: #ffffff; stroke: #c7c7cc; }
    .btn { fill: #1d1d1f; }
    .btn-text { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .ghost { fill: #ffffff; stroke: #1d1d1f; }
    .key { fill: #f2f2f7; stroke: #0a7d4f; stroke-width: 2; }
    .accent { fill: #0a7d4f; }
    .arrow { stroke: #0a7d4f; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a7d4f"/>
    </marker>
  </defs>

  <!-- Tab bar of the zone page -->
  <rect x="0" y="0" width="640" height="320" fill="#f5f5f7"/>
  <rect x="24" y="20" width="592" height="44" rx="10" class="card"/>
  <text x="44" y="48" class="muted" font-size="14">Zone: Home – top</text>
  <text x="200" y="48" class="muted" font-size="14">Bar</text>
  <text x="262" y="48" class="muted" font-size="14">Tale groups</text>
  <text x="372" y="48" font-size="14" font-weight="700" class="ink">Install</text>
  <line x1="364" y1="58" x2="408" y2="58" stroke="#1d1d1f" stroke-width="2"/>

  <!-- Step A: issue -->
  <rect x="24" y="84" width="280" height="200" rx="12" class="card"/>
  <text x="44" y="112" font-size="14" font-weight="700" class="ink">A. No key yet</text>
  <text x="44" y="136" font-size="13" class="muted">Zone key</text>
  <rect x="44" y="146" width="240" height="36" rx="8" fill="#f2f2f7" stroke="#c7c7cc"/>
  <text x="58" y="169" font-size="13" class="muted">no active key</text>
  <rect x="44" y="200" width="160" height="40" rx="8" class="btn"/>
  <text x="62" y="225" class="btn-text">Issue zone key</text>

  <!-- Arrow -->
  <path d="M320,184 L344,184" class="arrow"/>

  <!-- Step B: shown once -->
  <rect x="352" y="84" width="264" height="200" rx="12" class="card"/>
  <text x="372" y="112" font-size="14" font-weight="700" class="ink">B. Shown once</text>
  <rect x="372" y="126" width="224" height="50" rx="8" class="key"/>
  <text x="386" y="156" font-family="ui-monospace, Menlo, monospace" font-size="13" class="ink">tak_••••••••••••••••</text>
  <text x="372" y="198" font-size="13" class="muted">Copy it now: it is not</text>
  <text x="372" y="214" font-size="13" class="muted">shown again. Rotating issues</text>
  <text x="372" y="230" font-size="13" class="muted">a new key and revokes this one.</text>
  <rect x="372" y="244" width="110" height="26" rx="8" class="ghost"/>
  <text x="396" y="262" font-size="13" font-weight="600" class="ink">Copy</text>
  <rect x="492" y="244" width="110" height="26" rx="8" class="ghost"/>
  <text x="510" y="262" font-size="13" font-weight="600" class="ink">Open test page</text>

  <text x="24" y="306" font-size="12" class="muted">Schematic of the Install tab, not a screenshot. The key shown is a placeholder.</text>
</svg>
