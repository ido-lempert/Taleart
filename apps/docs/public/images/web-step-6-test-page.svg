<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>Check a zone with the test page before touching your site</title>
  <desc>The Install tab's Open test page link opens a page TaleArt serves. The zone key travels only in the URL fragment, which a browser does not send to a server, and the page removes it from the address bar. The zone then shows on that page.</desc>
  <style>
    .ink { fill: #1d1d1f; }
    .muted { fill: #6e6e73; }
    .box { fill: #ffffff; stroke: #c7c7cc; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .flow { stroke: #0a7d4f; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a7d4f"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="260" fill="#f5f5f7"/>

  <rect x="24" y="30" width="170" height="110" rx="10" class="box"/>
  <text x="40" y="60" font-size="14" font-weight="700" class="ink">Install tab</text>
  <text x="40" y="84" font-size="12.5" class="muted">Open test page</text>
  <text x="40" y="106" font-size="12.5" class="muted">(key copied in)</text>

  <path d="M194,85 L240,85" class="flow"/>

  <rect x="244" y="30" width="372" height="110" rx="10" class="box"/>
  <text x="260" y="56" font-size="13" font-weight="700" class="ink">Test page, served by TaleArt</text>
  <text x="260" y="80" class="code ink">…/test-page#zoneKey=YOUR_ZONE_KEY</text>
  <text x="260" y="100" font-size="12.5" class="muted">The fragment (after #) never goes to a server.</text>
  <text x="260" y="120" font-size="12.5" class="muted">The page removes it from the address bar.</text>

  <rect x="24" y="168" width="592" height="60" rx="10" fill="#eef6f2" stroke="#0a7d4f"/>
  <text x="44" y="194" font-size="14" font-weight="700" class="ink">Check: the zone appears with your bar or banner.</text>
  <text x="44" y="216" font-size="12.5" class="muted">Then add the snippet to your site. If nothing shows, the zone page says why (Not visible: …).</text>
</svg>
