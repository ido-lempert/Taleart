<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>Two ways to add the Web SDK: a script tag from the API, or the npm package</title>
  <desc>Left: one script tag loads the SDK from the TaleArt API. Right: the npm package is installed and init is imported from it. Both then place the same taleart-view element.</desc>
  <style>
    .ink { fill: #1d1d1f; }
    .muted { fill: #6e6e73; }
    .card { fill: #ffffff; stroke: #c7c7cc; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1d1d1f; }
    .tag { fill: #0a7d4f; font-size: 12px; font-weight: 700; }
    .sep { stroke: #c7c7cc; stroke-dasharray: 4 4; }
  </style>
  <rect x="0" y="0" width="640" height="300" fill="#f5f5f7"/>

  <rect x="24" y="24" width="292" height="200" rx="12" class="card"/>
  <text x="44" y="52" class="tag">A. SCRIPT TAG (ONCE PER PAGE)</text>
  <text x="44" y="78" font-size="14" font-weight="700" class="ink">Load it from the API</text>
  <rect x="40" y="92" width="260" height="62" rx="8" fill="#f2f2f7"/>
  <text x="52" y="116" class="code">&lt;script type="module"</text>
  <text x="52" y="136" class="code">  src="https://api.example.com/…"&gt;</text>
  <text x="44" y="176" font-size="13" class="muted">The origin of the script is the</text>
  <text x="44" y="194" font-size="13" class="muted">default API URL.</text>

  <rect x="324" y="24" width="292" height="200" rx="12" class="card"/>
  <text x="344" y="52" class="tag">B. NPM PACKAGE</text>
  <text x="344" y="78" font-size="14" font-weight="700" class="ink">Bundle it in your app</text>
  <rect x="340" y="92" width="260" height="62" rx="8" fill="#f2f2f7"/>
  <text x="352" y="116" class="code">npm i @lempert/taleart</text>
  <text x="352" y="136" class="code">import { init } from '@lempert/taleart'</text>
  <text x="344" y="176" font-size="13" class="muted">No script origin: pass apiUrl to</text>
  <text x="344" y="194" font-size="13" class="muted">init, then use the same element.</text>

  <line x1="320" y1="24" x2="320" y2="224" class="sep"/>

  <rect x="24" y="240" width="592" height="42" rx="10" fill="#1d1d1f"/>
  <text x="44" y="266" class="code" fill="#ffffff">&lt;taleart-view zone-key="YOUR_ZONE_KEY"&gt;&lt;/taleart-view&gt;</text>
  <text x="24" y="296" font-size="12" class="muted">The element is the same for both. A page with no script and no package shows nothing.</text>
</svg>
