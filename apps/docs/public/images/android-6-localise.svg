<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Localise the texts for one locale</text>
<rect class="phone" x="430" y="60" width="240" height="340" rx="30"/><rect class="screen" x="440" y="82" width="220" height="296" rx="18"/><rect class="phone" x="528" y="68" width="44" height="7" rx="3.5"/><circle class="soft" cx="478" cy="130" r="22"/><circle class="ring" cx="478" cy="130" r="25"/><text class="ink b" x="478" y="134" font-size="12" text-anchor="middle">Sum</text><circle class="soft" cx="526" cy="130" r="22"/><circle class="ring-seen" cx="526" cy="130" r="25"/><text class="ink b" x="526" y="134" font-size="12" text-anchor="middle">Pro</text><text class="muted" x="452" y="178" font-size="12" text-anchor="start">Pro, נצפה (seen)</text><rect class="card" x="452" y="200" width="196" height="80" rx="8"/><text class="muted" x="468" y="240" font-size="13" text-anchor="start">Your content</text><rect class="viewer" x="440" y="82" width="220" height="296" rx="18"/><rect x="452" y="100" width="60" height="4" rx="2" fill="#ffffff"/><rect x="518" y="100" width="60" height="4" rx="2" fill="#ffffff"/><rect x="584" y="100" width="60" height="4" rx="2" fill="#4a5164"/><text x="454" y="130" font-size="13" font-weight="700" fill="#ffffff" font-family="system-ui,sans-serif">Pro</text><text x="454" y="148" font-size="11" fill="#c9d0de" font-family="system-ui,sans-serif">Hebrew tale text</text><text x="646" y="130" font-size="13" font-weight="700" fill="#ffffff" font-family="system-ui,sans-serif" text-anchor="end">סגור</text><rect class="card" x="40" y="110" width="350" height="190" rx="10"/><text class="ink b" x="60" y="140" font-size="14" text-anchor="start">Config and view</text><text class="ink" x="60" y="170" font-size="13" text-anchor="start">locale = "he-IL"</text><text class="ink" x="60" y="196" font-size="13" text-anchor="start">strings["he"]["viewer.close"] = "סגור"</text><text class="ink" x="60" y="222" font-size="13" text-anchor="start">strings["he"]["bar.seen"] = "{name}, נצפה"</text><text class="ink" x="60" y="248" font-size="13" text-anchor="start">A missing key shows English.</text><line class="arrow" x1="396" y1="205" x2="424" y2="205" marker-end="url(#arr)"/><circle class="num" cx="40" cy="90" r="12"/><text class="numtxt" x="40" y="94.5">1</text><circle class="num" cx="430" cy="40" r="12"/><text class="numtxt" x="430" y="44.5">2</text><text class="muted" x="40" y="340" font-size="12" text-anchor="start">Lookup: full locale, then language, then every locale, then English.</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
