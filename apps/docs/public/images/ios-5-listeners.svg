<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Subclass TaleartListenerBase and override a link</text>
<rect class="card" x="40" y="150" width="200" height="90" rx="10"/><text class="ink b" x="140" y="191" font-size="14" text-anchor="middle">Zone event</text><text class="muted" x="140" y="210" font-size="12" text-anchor="middle">tap, load, action</text><line class="arrow" x1="242" y1="195" x2="280" y2="195" marker-end="url(#arr)"/><rect class="card" x="282" y="150" width="200" height="90" rx="10"/><text class="ink b" x="382" y="191" font-size="14" text-anchor="middle">Your listener subclass</text><text class="muted" x="382" y="210" font-size="12" text-anchor="middle">view first</text><line class="arrow" x1="484" y1="195" x2="520" y2="195" marker-end="url(#arr)"/><rect class="card" x="522" y="150" width="238" height="90" rx="10"/><text class="ink b" x="641" y="191" font-size="14" text-anchor="middle">TaleartSdk.init listener</text><text class="muted" x="641" y="210" font-size="12" text-anchor="middle">global, then onEvent</text><line class="arrow" x1="641" y1="242" x2="641" y2="288" marker-end="url(#arr)"/><text class="muted" x="641" y="257" font-size="12" text-anchor="middle">action</text><rect class="card" x="420" y="290" width="340" height="84" rx="10"/><text class="ink b" x="590" y="328" font-size="14" text-anchor="middle">onActionClicked returns true</text><text class="muted" x="590" y="347" font-size="12" text-anchor="middle">your app routes the link</text><rect class="card" x="40" y="290" width="340" height="84" rx="10"/><text class="ink b" x="210" y="328" font-size="14" text-anchor="middle">onActionClicked returns false</text><text class="muted" x="210" y="347" font-size="12" text-anchor="middle">the system browser opens it</text><text class="muted" x="40" y="404" font-size="13" text-anchor="start">Only onActionClicked answers. Other hooks only observe.</text><text class="muted" x="40" y="424" font-size="13" text-anchor="start">onGroupImpression and onUserInteracted do not fire natively yet.</text><circle class="num" cx="40" cy="140" r="12"/><text class="numtxt" x="40" y="144.5">1</text><circle class="num" cx="282" cy="140" r="12"/><text class="numtxt" x="282" y="144.5">2</text><circle class="num" cx="522" cy="140" r="12"/><text class="numtxt" x="522" y="144.5">3</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
