<svg xmlns="http://www.w3.org/2000/svg" width="640" height="316" viewBox="0 0 640 316" role="img" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>How the frequency cap decides whether a group shows</title>
  <desc>A viewer opens a tale group. The view is counted in this browser's local storage. The cap rule is checked: under the cap the group shows as usual; over the cap it is left out of the display and onGroupCapped fires.</desc>
  <style>
    .ink { fill: #1d1d1f; }
    .muted { fill: #6e6e73; }
    .box { fill: #ffffff; stroke: #c7c7cc; }
    .host { fill: #eef6f2; stroke: #0a7d4f; }
    .flow { stroke: #1d1d1f; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="316" fill="#f5f5f7"/>

  <!-- The view -->
  <rect x="24" y="40" width="150" height="64" rx="10" class="box"/>
  <text x="40" y="64" font-size="14" font-weight="700" class="ink">Viewer opens</text>
  <text x="40" y="86" font-size="12.5" class="muted">a tale group</text>

  <rect x="214" y="40" width="180" height="64" rx="10" class="box"/>
  <text x="230" y="64" font-size="14" font-weight="700" class="ink">Count the view</text>
  <text x="230" y="86" class="code ink">taleart.views</text>

  <rect x="434" y="40" width="182" height="64" rx="10" class="box"/>
  <text x="450" y="64" font-size="14" font-weight="700" class="ink">Check the cap</text>
  <text x="450" y="86" class="code ink">frequency="weekly"</text>

  <path d="M174,72 L214,72" class="flow"/>
  <path d="M394,72 L434,72" class="flow"/>

  <!-- The branches -->
  <path d="M460,104 L460,132 L169,132 L169,160" class="flow"/>
  <path d="M580,104 L580,132 L471,132 L471,160" class="flow"/>
  <text x="190" y="126" font-size="12" class="muted">under the cap</text>
  <text x="490" y="124" font-size="12" class="muted">over the cap</text>

  <rect x="24" y="160" width="290" height="96" rx="10" class="host"/>
  <text x="40" y="186" font-size="14" font-weight="700" class="ink">Under the cap: shown</text>
  <text x="40" y="210" font-size="12.5" class="muted">The group stays in the bar</text>
  <text x="40" y="228" font-size="12.5" class="muted">or banner. Its tales open as usual.</text>

  <rect x="326" y="160" width="290" height="96" rx="10" class="box"/>
  <text x="342" y="186" font-size="14" font-weight="700" class="ink">Over the cap: left out</text>
  <text x="342" y="210" font-size="12.5" class="muted">The group is removed from the display.</text>
  <text x="342" y="228" font-size="12.5" class="muted">onGroupCapped fires, once per render.</text>

  <text x="24" y="282" font-size="12" class="muted">once: after the first view. daily: for 24 hours after a view. weekly: for 7 days after a view.</text>
  <text x="24" y="300" font-size="12" class="muted">A number N from 1 to 50: after N views, for good. Counted in this browser only.</text>
</svg>
