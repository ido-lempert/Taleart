<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Place the zone: a view in XML, a composable in Compose</text>
<rect class="phone" x="60" y="80" width="220" height="330" rx="30"/><rect class="screen" x="70" y="102" width="200" height="286" rx="18"/><rect class="phone" x="148" y="88" width="44" height="7" rx="3.5"/><circle class="soft" cx="96" cy="150" r="22"/><circle class="ring" cx="96" cy="150" r="25"/><text class="ink b" x="96" y="154" font-size="12" text-anchor="middle">Sum</text><circle class="soft" cx="144" cy="150" r="22"/><circle class="ring" cx="144" cy="150" r="25"/><text class="ink b" x="144" y="154" font-size="12" text-anchor="middle">Pro</text><circle class="soft" cx="192" cy="150" r="22"/><circle class="ring" cx="192" cy="150" r="25"/><text class="ink b" x="192" y="154" font-size="12" text-anchor="middle">New</text><circle class="soft" cx="240" cy="150" r="22"/><circle class="ring" cx="240" cy="150" r="25"/><text class="ink b" x="240" y="154" font-size="12" text-anchor="middle">Tips</text><rect class="card" x="80" y="200" width="180" height="90" rx="8"/><text class="muted" x="96" y="240" font-size="13" text-anchor="start">Your content</text><text class="ink b" x="170" y="430" font-size="13" text-anchor="middle">XML: TaleartView</text><rect class="phone" x="330" y="80" width="220" height="330" rx="30"/><rect class="screen" x="340" y="102" width="200" height="286" rx="18"/><rect class="phone" x="418" y="88" width="44" height="7" rx="3.5"/><circle class="soft" cx="366" cy="150" r="22"/><circle class="ring" cx="366" cy="150" r="25"/><text class="ink b" x="366" y="154" font-size="12" text-anchor="middle">Sum</text><circle class="soft" cx="414" cy="150" r="22"/><circle class="ring" cx="414" cy="150" r="25"/><text class="ink b" x="414" y="154" font-size="12" text-anchor="middle">Pro</text><circle class="soft" cx="462" cy="150" r="22"/><circle class="ring" cx="462" cy="150" r="25"/><text class="ink b" x="462" y="154" font-size="12" text-anchor="middle">New</text><circle class="soft" cx="510" cy="150" r="22"/><circle class="ring" cx="510" cy="150" r="25"/><text class="ink b" x="510" y="154" font-size="12" text-anchor="middle">Tips</text><rect class="card" x="350" y="200" width="180" height="90" rx="8"/><text class="muted" x="366" y="240" font-size="13" text-anchor="start">Your content</text><text class="ink b" x="440" y="430" font-size="13" text-anchor="middle">Compose: TaleartZone</text><rect class="card" x="600" y="110" width="170" height="74" rx="10"/><text class="ink b" x="685" y="143" font-size="14" text-anchor="middle">app:taleartZoneKey</text><text class="muted" x="685" y="162" font-size="12" text-anchor="middle">the key, once</text><rect class="card" x="600" y="210" width="170" height="74" rx="10"/><text class="ink b" x="685" y="243" font-size="14" text-anchor="middle">height wrap_content</text><text class="muted" x="685" y="262" font-size="12" text-anchor="middle">the bar sets it</text><rect class="card" x="600" y="310" width="170" height="74" rx="10"/><text class="ink b" x="685" y="343" font-size="14" text-anchor="middle">modifier = fillMaxWidth</text><text class="muted" x="685" y="362" font-size="12" text-anchor="middle">width of its parent</text><circle class="num" cx="600" cy="98" r="12"/><text class="numtxt" x="600" y="102.5">1</text><circle class="num" cx="600" cy="198" r="12"/><text class="numtxt" x="600" y="202.5">2</text><circle class="num" cx="600" cy="298" r="12"/><text class="numtxt" x="600" y="302.5">3</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
