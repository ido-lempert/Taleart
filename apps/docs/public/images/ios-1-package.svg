<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Add the Swift package or the XCFramework</text>
<rect class="card" x="40" y="150" width="200" height="90" rx="10"/><text class="ink b" x="140" y="191" font-size="14" text-anchor="middle">Your Xcode project</text><text class="muted" x="140" y="210" font-size="12" text-anchor="middle">app target</text><line class="arrow" x1="242" y1="195" x2="280" y2="195" marker-end="url(#arr)"/><text class="muted" x="261" y="187" font-size="12" text-anchor="middle">Add Package</text><rect class="card" x="282" y="150" width="210" height="90" rx="10"/><text class="ink b" x="387" y="191" font-size="14" text-anchor="middle">github.com/ido-lempert/Taleart</text><text class="muted" x="387" y="210" font-size="12" text-anchor="middle">Package.swift, binaryTarget</text><line class="arrow" x1="494" y1="195" x2="532" y2="195" marker-end="url(#arr)"/><text class="muted" x="513" y="187" font-size="12" text-anchor="middle">downloads</text><rect class="card" x="534" y="150" width="226" height="90" rx="10"/><text class="ink b" x="647" y="191" font-size="14" text-anchor="middle">TaleartSDK.xcframework.zip</text><text class="muted" x="647" y="210" font-size="12" text-anchor="middle">release asset</text><text class="muted" x="40" y="290" font-size="13" text-anchor="start">Or: unzip the asset and drag TaleartSDK.xcframework into the target.</text><text class="muted" x="40" y="312" font-size="13" text-anchor="start">Device (arm64) and Apple silicon simulator slices only.</text><circle class="num" cx="40" cy="140" r="12"/><text class="numtxt" x="40" y="144.5">1</text><circle class="num" cx="282" cy="140" r="12"/><text class="numtxt" x="282" y="144.5">2</text><circle class="num" cx="534" cy="140" r="12"/><text class="numtxt" x="534" y="144.5">3</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
