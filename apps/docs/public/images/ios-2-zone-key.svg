<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Copy the zone key from the Install tab</text>
<rect class="card" x="40" y="70" width="720" height="330" rx="12"/><rect class="soft" x="40" y="70" width="720" height="40" rx="12"/><text class="ink b" x="60" y="96" font-size="14" text-anchor="start">TaleArt dashboard  ·  Zone: home-top</text><text class="muted" x="420" y="96" font-size="13" text-anchor="start">Overview</text><text class="muted" x="502" y="96" font-size="13" text-anchor="start">Display</text><text class="muted" x="584" y="96" font-size="13" text-anchor="start">Groups</text><text class="accent b" x="666" y="96" font-size="13" text-anchor="start">Install</text><line x1="594" y1="106" x2="640" y2="106" stroke="#2f5bd3" stroke-width="3"/><text class="ink b" x="64" y="150" font-size="15" text-anchor="start">Zone key</text><rect class="soft" x="64" y="164" width="500" height="44" rx="8"/><text class="ink" x="82" y="192" font-size="15" text-anchor="start">tak_••••••••••••••••••••</text><rect class="card" x="584" y="164" width="104" height="44" rx="8"/><text class="accent b" x="636" y="192" font-size="14" text-anchor="middle">Copy</text><text class="muted" x="64" y="240" font-size="13" text-anchor="start">Shown once, when it is issued. Rotating it issues a new key and stops the old one at once.</text><rect class="card" x="64" y="268" width="672" height="110" rx="8"/><text class="ink" x="84" y="296" font-size="13" text-anchor="start">Place it in your app as a value: app:taleartZoneKey (Android) or zone key (iOS).</text><text class="muted" x="84" y="320" font-size="13" text-anchor="start">The zone key names one zone. It is a read credential, so the zone is public.</text><text class="muted" x="84" y="344" font-size="13" text-anchor="start">A missing or rotated key shows nothing in the app and logs one load failure.</text><circle class="num" cx="396" cy="96" r="12"/><text class="numtxt" x="396" y="100.5">1</text><circle class="num" cx="300" cy="186" r="12"/><text class="numtxt" x="300" y="190.5">2</text><circle class="num" cx="636" cy="146" r="12"/><text class="numtxt" x="636" y="150.5">3</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
