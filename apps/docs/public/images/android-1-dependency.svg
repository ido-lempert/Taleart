<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<style>
  .bg{fill:#f5f7fb}
  .card{fill:#ffffff;stroke:#c3cbd9;stroke-width:1.5}
  .soft{fill:#e6ecfb}
  .ink{fill:#1c2433;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .b{font-weight:700}
  .muted{fill:#5a6478;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .accent{fill:#2f5bd3}
  .ring{fill:none;stroke:#2f5bd3;stroke-width:3}
  .ring-seen{fill:none;stroke:#9aa3b5;stroke-width:3}
  .arrow{stroke:#5a6478;stroke-width:1.6;fill:none}
  .num{fill:#2f5bd3}
  .numtxt{fill:#ffffff;font-weight:700;font-size:13px;font-family:system-ui,sans-serif;text-anchor:middle}
  .phone{fill:#2b2f3a}
  .screen{fill:#eef1f7}
  .viewer{fill:#14171f}
  .ok{fill:#2f9d5b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26} .card{fill:#1e2533;stroke:#3b4558} .soft{fill:#243457}
    .ink{fill:#e9edf5} .muted{fill:#a9b2c3} .arrow{stroke:#a9b2c3} .ring-seen{stroke:#6b7488}
    .screen{fill:#262c3a}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/></marker></defs>
<rect class="bg" x="0" y="0" width="800" height="450"/>
<text class="ink b" x="28" y="40" font-size="20">Add one dependency</text>
<rect class="card" x="40" y="170" width="190" height="90" rx="10"/><text class="ink b" x="135" y="211" font-size="14" text-anchor="middle">Your app module</text><text class="muted" x="135" y="230" font-size="12" text-anchor="middle">build.gradle.kts</text><line class="arrow" x1="232" y1="215" x2="290" y2="215" marker-end="url(#arr)"/><text class="muted" x="261" y="207" font-size="12" text-anchor="middle">implementation</text><rect class="card" x="292" y="170" width="200" height="90" rx="10"/><text class="ink b" x="392" y="211" font-size="14" text-anchor="middle">android-sdk 0.1.1</text><text class="muted" x="392" y="230" font-size="12" text-anchor="middle">TaleartView, Android</text><line class="arrow" x1="494" y1="215" x2="552" y2="215" marker-end="url(#arr)"/><text class="muted" x="523" y="207" font-size="12" text-anchor="middle">pulls in</text><rect class="card" x="554" y="170" width="206" height="90" rx="10"/><text class="ink b" x="657" y="211" font-size="14" text-anchor="middle">mobile-sdk 0.1.1</text><text class="muted" x="657" y="230" font-size="12" text-anchor="middle">core, Compose UI, TaleartZone</text><text class="muted" x="40" y="300" font-size="13" text-anchor="start">Both come from Maven Central, group site.lempert.taleart.</text><text class="muted" x="40" y="322" font-size="13" text-anchor="start">Use android-sdk alone; mobile-sdk comes with it.</text><circle class="num" cx="40" cy="150" r="12"/><text class="numtxt" x="40" y="154.5">1</text><circle class="num" cx="292" cy="150" r="12"/><text class="numtxt" x="292" y="154.5">2</text><circle class="num" cx="554" cy="150" r="12"/><text class="numtxt" x="554" y="154.5">3</text>
<text class="muted" x="758" y="434" font-size="11" text-anchor="end">Diagram, not a screenshot</text>
</svg>
