<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaleArt Web SDK sample</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: #111827;
        background: #fff;
      }
      code { background: #f3f4f6; padding: 0 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>TaleArt Web SDK sample</h1>
    <p>
      A host page for trying the SDK. Open it as
      <code>?key=&lt;zone key&gt;&amp;api=&lt;API URL&gt;</code>; the API URL defaults to
      <code>http://localhost:3333</code>. Add <code>&amp;stages=&lt;key&gt;,&lt;key&gt;</code> to place one
      <code>&lt;taleart-view stage="…"&gt;</code> per stage key instead of the whole zone.
    </p>

    <div id="views"><taleart-view id="zone"></taleart-view></div>

    <!-- The built SDK, served from dist/libs/web-sdk. Loading it registers <taleart-view>. -->
    <script type="module">
      import '/sdk/index.js';

      const params = new URLSearchParams(location.search);
      const apiUrl = params.get('api') || 'http://localhost:3333';
      const key = params.get('key');
      const stages = (params.get('stages') || '').split(',').map((s) => s.trim()).filter(Boolean);
      // One element per named stage (R7), each under its own heading; else one element for the whole zone.
      const views = stages.length
        ? stages.map((stage) => {
            const section = document.createElement('section');
            const heading = document.createElement('h2');
            heading.textContent = `Stage ${stage}`;
            const view = document.createElement('taleart-view');
            view.stage = stage;
            section.append(heading, view);
            return { section, view };
          })
        : [{ section: null, view: document.getElementById('zone') }];
      if (stages.length) document.getElementById('views').replaceChildren(...views.map((v) => v.section));
      for (const { view } of views) {
        view.apiUrl = apiUrl;
        if (key) view.zoneKey = key;
      }
    </script>
  </body>
</html>
