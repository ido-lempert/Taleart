# Uploads the Android SDKs alone to Maven Central when a tag maven-v<version> is pushed (the version is gradle.properties
# taleartVersion, which must match the tag and the other SDK versions; the verify job checks it):
#   - site.lempert.taleart:mobile-sdk and :android-sdk, signed, uploaded to the Central Portal. A person releases the
#     deployment there (Deployments > Publish), see RELEASING.md; a published Maven version can never be replaced.
#
# Secrets (repository settings > Secrets and variables > Actions):
#   MAVEN_TOKEN               The Central Portal user token as base64 of "<name>:<password>" (the value the portal's
#                             "Generate user token" shows for the Authorization header, without the word Bearer).
#   SIGNING_KEY               The GPG private key, ASCII-armored (gpg --armor --export-secret-keys <KEYID>).
#   SIGNING_KEY_PASSWORD      The passphrase of that key.
name: Release Maven only

on:
  push:
    tags:
      - 'maven-v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag matches the versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tag equals the SDKs' version
        run: |
          TAG="${GITHUB_REF_NAME#maven-v}"
          VERSION="$(grep '^taleartVersion=' gradle.properties | cut -d= -f2)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match taleartVersion ${VERSION} in gradle.properties." >&2
            exit 1
          fi
      - name: Versions agree across the SDKs
        run: ./gradlew :verifyTaleartVersions --console=plain

  test:
    name: Test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Mobile and Android SDK tests (host)
        run: ./gradlew :mobile-sdk:testAndroidHostTest :android-sdk:testDebugUnitTest --console=plain

  maven:
    name: Upload to Maven Central
    needs: [verify, test]
    # The Apple targets of mobile-sdk compile only on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Split the token into the portal user name and password
        env:
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: |
          DECODED="$(printf '%s' "$MAVEN_TOKEN" | base64 --decode)"
          NAME="${DECODED%%:*}"
          PASSWORD="${DECODED#*:}"
          if [ -z "$NAME" ] || [ -z "$PASSWORD" ] || [ "$NAME" = "$DECODED" ]; then
            echo "MAVEN_TOKEN must be base64 of <name>:<password>." >&2
            exit 1
          fi
          echo "::add-mask::$NAME"
          echo "::add-mask::$PASSWORD"
          echo "ORG_GRADLE_PROJECT_mavenCentralUsername=$NAME" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mavenCentralPassword=$PASSWORD" >> "$GITHUB_ENV"
      - name: Upload to the Central Portal (a person releases it there)
        run: ./gradlew :mobile-sdk:publishToMavenCentral :android-sdk:publishToMavenCentral --console=plain
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
