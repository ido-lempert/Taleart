# Publishes the self-host images to Docker Hub: lempert/taleart-api and lempert/taleart-dashboard (linux/amd64 and
# linux/arm64, built from the Dockerfile targets `api` and `dashboard`).
#   - push to main      -> :edge
#   - tag v<version>    -> :<version>, :<major>.<minor> and :latest
#   - by hand           -> :edge (Actions > Docker publish > Run workflow)
#
# Secrets (repository settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   The Docker Hub user that owns the lempert namespace.
#   DOCKERHUB_TOKEN      A Docker Hub access token with Read & Write scope.
name: Docker publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'deploy/dockerhub/**'
      - 'libs/**'
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: taleart-api
            target: api
          - image: taleart-dashboard
            target: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: lempert/${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Taleart self-host ${{ matrix.target }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Docker Hub description
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lempert/${{ matrix.image }}
          short-description: Taleart self-host ${{ matrix.target }} (Apache-2.0)
          readme-filepath: deploy/dockerhub/${{ matrix.image }}.md
